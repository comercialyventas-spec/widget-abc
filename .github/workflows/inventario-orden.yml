name: Inventario por orden (solo lectura)

# Se lanza cuando Claude sube migracion/inventario_orden.txt (IDs de blogs separados por espacios).
# No cambia ningún post: cuenta los posts publicados que siguen llamando a un script de Google
# (sin contar los contadores de clics) y guarda la lista en migracion/inventario_total.json.
# El resumen sale como avisos del run.
on:
  push:
    branches: [main]
    paths: ['migracion/inventario_orden.txt']

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inventario
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          cp migracion/inventario_productos.json /tmp/inventario_anterior.json
          node migracion/inventario_productos.js "$(tr '\n' ' ' < migracion/inventario_orden.txt)" > /tmp/inv.txt 2>&1 || true
          mv migracion/inventario_productos.json migracion/inventario_total.json
          cp /tmp/inventario_anterior.json migracion/inventario_productos.json
          grep -E 'posts publicados|^TOTAL|ERROR' /tmp/inv.txt > /tmp/blogs.txt || true
          echo "::notice::$(paste -sd'#' /tmp/blogs.txt | sed 's/#/ ### /g' | cut -c1-3900)"
          sed -n '/===== POSTS POR SCRIPT =====/,/===== POSTS CON SCRIPT =====/p' /tmp/inv.txt | grep -v '=====' > /tmp/scripts.txt || true
          echo "::notice::POR SCRIPT: $(paste -sd'#' /tmp/scripts.txt | sed 's/#/ ### /g' | cut -c1-3900)"
          sed -n '/===== POSTS CON SCRIPT =====/,/^TOTAL/p' /tmp/inv.txt | grep -v -E '=====|^TOTAL' | cut -f1,3,4,5 > /tmp/posts.txt || true
          split -l 25 /tmp/posts.txt /tmp/trozo_ || true
          for f in /tmp/trozo_*; do [ -s "$f" ] && echo "::notice::$(paste -sd'#' "$f" | sed 's/#/ ### /g' | cut -c1-3900)"; done
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/inventario_total.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Inventario total de posts con script de Google"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
