name: Actualizar Noticias El Pais

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS de El Pais a JSON con imagenes
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const rssUrl = "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada";

          https.get(rssUrl, (res) => {
              let data = "";

              res.on("data", (chunk) => data += chunk);

              res.on("end", () => {
                  const items = data.split("<item>").slice(1);
                  let noticias = [];

                  items.forEach(item => {

                      let titleMatch =
                          item.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>/) ||
                          item.match(/<title>(.*?)<\/title>/);

                      let linkMatch =
                          item.match(/<link><!\[CDATA\[(.*?)\]\]><\/link>/) ||
                          item.match(/<link>(.*?)<\/link>/);

                      let title = titleMatch ? titleMatch[1] : "";
                      let link = linkMatch ? linkMatch[1].trim() : "";

                      // Buscar imagen en media:content
                      let imgMatch =
                          item.match(/<media:content[^>]+url="(https?:\/\/[^"]+)"/i) ||
                          item.match(/<media:thumbnail[^>]+url="(https?:\/\/[^"]+)"/i) ||
                          item.match(/<enclosure[^>]+url="(https?:\/\/[^"]+)"/i) ||
                          item.match(/src="(https?:\/\/[^"]+)"/i);

                      let imagen = imgMatch ? imgMatch[1] : "";

                      if (title && link) {
                          noticias.push({
                              titulo: title.replace(/<[^>]*>/g, "").trim(),
                              link: link,
                              imagen: imagen
                          });
                      }
                  });

                  fs.writeFileSync(
                      "noticias-1351.json",
                      JSON.stringify(
                          { noticias: noticias.slice(0, 6) },
                          null,
                          2
                      )
                  );

                  console.log(
                      "JSON de El Pais actualizado con " +
                      Math.min(noticias.length, 6) +
                      " noticias."
                  );
              });

          }).on("error", (err) => {
              console.error(err);
              process.exit(1);
          });
          '

      - name: Guardar cambios automáticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias El Pais"
          file_pattern: noticias-1351.json
