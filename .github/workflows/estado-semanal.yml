name: Estado semanal de noticias y catalogos (solo lectura)

# Cada lunes de madrugada revisa los widgets de noticias (noticias-N) y los catálogos del motor de
# productos que están en posts PUBLICADOS de todos los blogs, y escribe docs/ESTADO_SEMANAL.md
# (y docs/estado_semanal.json para comparar con la semana siguiente).
# No cambia ningún post, ni la hoja, ni los JSON de noticias o productos: solo escribe esos dos archivos.
# Los fallos NUEVOS en posts publicados salen como avisos (annotations) en el run.
on:
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Grupo propio: en widget-abc-git-write (compartido con las noticias frecuentes) GitHub cancelaba la ejecución pendiente
# de este workflow poco frecuente. El choque de pushes lo resuelven el paso de sincronizar y los reintentos.
concurrency:
  group: estado-semanal
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial sin el contenido de los archivos: basta para saber cuándo cambió cada noticias-N.json
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Chromium (para comprobar en el navegador los widgets que cargan por respaldo)
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.47.2 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Revisar widgets y catalogos de posts publicados
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          LISTAR_FEEDS_URL: "https://script.google.com/macros/s/AKfycbw3CPo21pjeJ6Iom59N0glwaJuxC75FknVtX7Et5PgHoplWz33GjcH4Jble_uh6Pw0/exec"
          LISTAR_FEEDS_TOKEN: ${{ secrets.LISTAR_FEEDS_TOKEN }}
        run: node migracion/estado_semanal.js
      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin "${GITHUB_REF_NAME}" || true

      - name: Guardar el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO_SEMANAL.md docs/estado_semanal.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Estado semanal de noticias y catalogos $(date -u +%Y-%m-%d)"
          RAMA="${GITHUB_REF_NAME}"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          for intento in 1 2 3 4; do
            git push origin HEAD:"$RAMA" && exit 0
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin "$RAMA" || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          echo "::error title=No se pudo guardar el informe::El push a GitHub fallo 4 veces seguidas."
          exit 1
