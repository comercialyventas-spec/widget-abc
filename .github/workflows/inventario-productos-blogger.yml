name: Inventario productos Blogger (solo lectura)

# Solo se lanza a mano. No cambia ningún post: solo lee y guarda la lista en
# migracion/inventario_productos.json para preparar la migración.
on:
  workflow_dispatch:
    inputs:
      blogs:
        description: 'IDs de los blogs, separados por espacios'
        default: '6400647277621096048 204776635621748137 7861675855815378977 549142898166206103 6044710258238595430 517559064211767769 4762726155270759082 6130366386192364722 5156945776705335894 4896261559017639099 1328185844376620518 2799675443880190681 4316259817112832488 5787553850335478124 3339334388739759381 4631034600659689060 5070893862853201651'
        required: true

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inventario
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: node migracion/inventario_productos.js "${{ inputs.blogs }}"
      - name: Guardar inventario en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/inventario_productos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Inventario de posts de productos"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          ok=0
          for intento in 1 2 3 4; do
            if git push; then ok=1; break; fi
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=No se pudo guardar inventario de productos::El push a GitHub fallo 4 veces seguidas."
            exit 1
          fi
