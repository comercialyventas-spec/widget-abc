name: Actualizar noticias-1742
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout del repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. DESCARGAR EL SITEMAP DE NOTICIAS DE RTVE
      # ============================================================

      - name: Descargar sitemap de noticias RTVE
        run: |
          curl -L --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "https://www.rtve.es/sitemaps/sitemaps-news.xml" \
            -o sitemap.xml

          echo "Sitemap descargado correctamente."
          wc -c sitemap.xml


      # ============================================================
      # 3. GENERAR noticias-1742.json
      # ============================================================

      - name: Generar noticias-1742.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          (async function () {

            const xml =
              fs.readFileSync(
                "sitemap.xml",
                "utf8"
              );


            // ======================================================
            // FUNCIONES
            // ======================================================

            function decodeHtml(text) {

              return String(text || "")
                .replace(/&amp;/gi, "&")
                .replace(/&quot;/gi, '"')
                .replace(/&#39;/gi, "'")
                .replace(/&apos;/gi, "'")
                .replace(/&lt;/gi, "<")
                .replace(/&gt;/gi, ">")
                .replace(/&#x27;/gi, "'")
                .replace(/&#x2F;/gi, "/")
                .replace(/&#(\d+);/g, function (_, n) {
                  return String.fromCharCode(
                    Number(n)
                  );
                });

            }


            function extraerEtiqueta(
              bloque,
              etiqueta
            ) {

              const expresion =
                new RegExp(
                  "<" +
                  etiqueta +
                  "[^>]*>([\\s\\S]*?)<\\/" +
                  etiqueta +
                  ">",
                  "i"
                );

              const encontrado =
                bloque.match(
                  expresion
                );

              if (!encontrado) {
                return "";
              }

              return decodeHtml(
                encontrado[1].trim()
              );

            }


            // ======================================================
            // EXTRAER BLOQUES <url>...</url>
            // ======================================================

            const bloques =
              xml.match(
                /<url\b[^>]*>[\s\S]*?<\/url>/gi
              ) || [];


            const todas = [];

            for (
              const bloque of bloques
            ) {

              const loc =
                extraerEtiqueta(
                  bloque,
                  "loc"
                );

              const titulo =
                extraerEtiqueta(
                  bloque,
                  "news:title"
                );

              const fecha =
                extraerEtiqueta(
                  bloque,
                  "news:publication_date"
                );

              if (
                !loc ||
                !titulo
              ) {
                continue;
              }

              todas.push({
                titulo: titulo,
                link: loc,
                fecha: fecha
              });

            }


            console.log(
              "Noticias totales en el sitemap:",
              todas.length
            );


            // ======================================================
            // FILTRAR SOLO NOTICIAS DE MADRID
            // ======================================================

            const claves = [
              "Madrid", "madrileño", "madrileña", "Ayuso", "Almeida",
              "Moncloa", "Cibeles", "Puerta del Sol", "Sol", "Villaverde",
              "Vallecas", "Carabanchel", "Chamberí", "Salamanca", "Retiro",
              "Chamartín", "Tetuán", "Usera", "Moratalaz", "Hortaleza",
              "Fuencarral", "Barajas", "San Blas", "Leganés", "Getafe",
              "Alcorcón", "Móstoles", "Fuenlabrada", "Alcalá de Henares",
              "Torrejón", "Parla", "Alcobendas", "Las Rozas", "Majadahonda",
              "Pozuelo", "Boadilla", "San Sebastián de los Reyes", "Coslada",
              "Rivas", "Arganda", "Colmenar", "Tres Cantos", "Somosierra",
              "Navacerrada", "Manzanares"
            ];


            const filtradas =
              todas.filter(
                function (n) {

                  return claves.some(
                    function (p) {

                      return (
                        n.titulo.indexOf(p) !== -1
                      );

                    }
                  );

                }
              );


            const seleccion =
              filtradas.slice(
                0,
                6
              );


            if (
              seleccion.length === 0
            ) {

              throw new Error(
                "No se encontraron noticias de Madrid en el sitemap."
              );

            }


            console.log(
              "Noticias de Madrid encontradas:",
              seleccion.length
            );


            // ======================================================
            // OBTENER IMAGEN DE CADA NOTICIA (og:image)
            // ======================================================

            function atributo(
              bloque,
              nombre
            ) {

              const expresion =
                new RegExp(
                  nombre +
                  "\\s*=\\s*(['\"])(.*?)\\1",
                  "i"
                );

              const encontrado =
                bloque.match(
                  expresion
                );

              if (!encontrado) {
                return "";
              }

              return decodeHtml(
                encontrado[2]
              );

            }


            async function obtenerImagen(
              url
            ) {

              try {

                console.log(
                  "Buscando imagen:",
                  url
                );


                const respuesta =
                  await fetch(
                    url,
                    {
                      headers: {
                        "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36",
                        "Accept":
                          "text/html,application/xhtml+xml"
                      }
                    }
                  );


                if (
                  !respuesta.ok
                ) {

                  console.log(
                    "No se pudo descargar:",
                    respuesta.status
                  );

                  return "";

                }


                const pagina =
                  await respuesta.text();


                const metas =
                  pagina.match(
                    /<meta\b[^>]*>/gi
                  ) || [];


                for (
                  const meta of metas
                ) {

                  const property =
                    atributo(
                      meta,
                      "property"
                    );


                  const content =
                    atributo(
                      meta,
                      "content"
                    );


                  if (
                    (
                      property ===
                      "og:image" ||
                      property ===
                      "og:image:url"
                    ) &&
                    content
                  ) {

                    console.log(
                      "Imagen encontrada:",
                      content
                    );

                    return content;

                  }

                }


                console.log(
                  "No se encontró imagen."
                );

                return "";

              } catch (error) {

                console.log(
                  "Error obteniendo imagen:",
                  error.message
                );

                return "";

              }

            }


            // ======================================================
            // CREAR JSON FINAL
            // ======================================================

            const noticias = [];


            for (
              const item of seleccion
            ) {

              const imagen =
                await obtenerImagen(
                  item.link
                );


              noticias.push({
                titulo:
                  item.titulo,

                link:
                  item.link,

                fecha:
                  item.fecha,

                imagen:
                  imagen,

                tipo:
                  imagen
                    ? "imagen"
                    : ""
              });


              await new Promise(
                function (resolve) {
                  setTimeout(
                    resolve,
                    500
                  );
                }
              );

            }


            if (
              noticias.length === 0
            ) {

              throw new Error(
                "No se pudieron generar noticias."
              );

            }


            const resultado = {
              noticias:
                noticias
            };


            fs.writeFileSync(
              "noticias-1742.json",
              JSON.stringify(
                resultado,
                null,
                2
              ),
              "utf8"
            );


            console.log(
              "========================================"
            );

            console.log(
              "noticias-1742.json generado."
            );

            console.log(
              "Noticias:",
              noticias.length
            );

            console.log(
              "Con imagen:",
              noticias.filter(
                function (n) {
                  return !!n.imagen;
                }
              ).length
            );

            console.log(
              "========================================"
            );

          })().catch(function (error) {

            console.error(
              "ERROR:",
              error
            );

            process.exit(1);

          });

          NODE


      # ============================================================
      # 4. VALIDAR JSON
      # ============================================================

      - name: Validar noticias-1742.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo =
            "noticias-1742.json";


          if (
            !fs.existsSync(
              archivo
            )
          ) {

            throw new Error(
              "No existe noticias-1742.json"
            );

          }


          const data =
            JSON.parse(
              fs.readFileSync(
                archivo,
                "utf8"
              )
            );


          if (
            !data ||
            !Array.isArray(
              data.noticias
            ) ||
            data.noticias.length === 0
          ) {

            throw new Error(
              "noticias-1742.json es inválido o está vacío"
            );

          }


          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {

              throw new Error(
                "Hay una noticia sin título o enlace"
              );

            }

          }


          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "Noticias con imagen:",
            data.noticias.filter(
              function (n) {
                return !!n.imagen;
              }
            ).length
          );

          NODE


      # ============================================================
      # 5. GUARDAR EN GITHUB
      # ============================================================

      - name: Guardar noticias-1742.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-1742.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-1742"
            git push
          fi
