name: Actualizar Noticias El Periodico

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON
        run: |
          node <<'NODE'
          const https = require("https");
          const fs = require("fs");

          // 17 sept: elperiodico.com empezo a devolver HTTP 406 a las peticiones
          // que llegan directamente desde las IPs de GitHub Actions (bloqueo
          // anti-bot a nivel de origen, no un fallo de nuestra extraccion).
          // En vez de pelear con ese bloqueo, se pide el mismo RSS a traves de
          // rss2json.com (servicio gratuito que ya se usa como fallback en el
          // propio widget de este WID y en el de La Vanguardia Opinion, y que
          // no esta bloqueado) — mismo feed, misma cadencia horaria, sin tocar
          // nada en el NAS.
          const RSS_URL = "https://www.elperiodico.com/es/cds/rss/?id=board.xml";
          const RSS2JSON_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);

          function descargar(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: { "User-Agent": "Mozilla/5.0" }
              }, res => {
                let data = "";
                res.on("data", chunk => { data += chunk; });
                res.on("end", () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error("HTTP " + res.statusCode));
                    return;
                  }
                  resolve(data);
                });
              }).on("error", reject);
            });
          }

          function limpiarHtml(texto) {
            return String(texto || "")
              .replace(/<[^>]*>/g, "")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          async function main() {
            console.log("Descargando RSS de El Periodico via rss2json...");

            const raw = await descargar(RSS2JSON_URL);
            const data = JSON.parse(raw);

            if (data.status !== "ok" || !Array.isArray(data.items)) {
              throw new Error("rss2json no devolvio items validos: " + raw.slice(0, 500));
            }

            const noticias = [];
            for (const item of data.items) {
              if (noticias.length >= 6) break;

              const titulo = limpiarHtml(item.title);
              const link = String(item.link || "").split("#")[0].split("?")[0];
              if (!titulo || !link) continue;

              let imagen = "";
              let tipo = "";
              if (item.enclosure && item.enclosure.link) {
                imagen = item.enclosure.link;
                tipo = (item.enclosure.type && item.enclosure.type.indexOf("video") !== -1) ? "video" : "imagen";
              } else if (item.thumbnail) {
                imagen = item.thumbnail;
                tipo = "imagen";
              }

              noticias.push({ titulo: titulo, link: link, imagen: imagen, tipo: tipo });

              console.log(noticias.length + ". " + titulo);
              console.log("   Multimedia: " + (tipo || "ninguna"));
              console.log("   URL: " + (imagen || "VACIA"));
            }

            if (!noticias.length) {
              throw new Error("No se encontraron noticias validas.");
            }

            fs.writeFileSync("noticias-1777.json", JSON.stringify({ noticias: noticias }, null, 2));

            console.log("==========================================");
            console.log("noticias-1777.json generado correctamente.");
            console.log("Noticias: " + noticias.length);
            console.log("==========================================");
          }

          main().catch(error => {
            console.error("ERROR:", error);
            process.exit(1);
          });
          NODE

      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias de El Periodico"
          file_pattern: noticias-1777.json
