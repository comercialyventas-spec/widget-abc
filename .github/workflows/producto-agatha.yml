name: Actualizar producto-agatha (capa 2)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1,3,5"

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ============================================================
      # 2. DESCARGAR EL SITEMAP DE PRODUCTOS DE AGATHA RUIZ DE LA PRADA
      # ============================================================

      - name: Descargar sitemap de productos
        run: |
          curl -L --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "https://www.agatharuizdelaprada.com/sitemap_products_1.xml?from=9792151290123&to=10964422197515" \
            -o sitemap.xml

          echo "Sitemap descargado correctamente."
          wc -c sitemap.xml

      # ============================================================
      # 3. GENERAR producto-agatha-pN.json (paginado, 24 por página,
      #    mismo esquema que sitemap_producto_generico.php en el NAS:
      #    { productos:[{titulo,url,imagen}], pagina, totalPaginas, hayMas, generado })
      # ============================================================

      - name: Generar producto-agatha-pN.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const SLUG = "agatha";
          const POR_PAGINA = 24;

          const xml = fs.readFileSync("sitemap.xml", "utf8");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#x27;/gi, "'")
              .replace(/&#x2F;/gi, "/")
              .replace(/&#(\d+);/g, function (_, n) {
                return String.fromCharCode(Number(n));
              });
          }

          function extraerEtiqueta(bloque, etiqueta) {
            const expresion = new RegExp(
              "<" + etiqueta + "[^>]*>([\\s\\S]*?)<\\/" + etiqueta + ">",
              "i"
            );
            const encontrado = bloque.match(expresion);
            if (!encontrado) return "";
            return decodeHtml(encontrado[1].trim());
          }

          // ==============================================================
          // EXTRAER BLOQUES <url>...</url> QUE TENGAN <image:image>
          // (el bloque de la home no tiene image:image y se descarta)
          // ==============================================================

          const bloques = xml.match(/<url\b[^>]*>[\s\S]*?<\/url>/gi) || [];

          const productos = [];

          for (const bloque of bloques) {
            const bloqueImagen = bloque.match(/<image:image\b[^>]*>[\s\S]*?<\/image:image>/i);
            if (!bloqueImagen) continue;

            const loc = extraerEtiqueta(bloque, "loc");
            const titulo = extraerEtiqueta(bloqueImagen[0], "image:title");
            const imagen = extraerEtiqueta(bloqueImagen[0], "image:loc");

            if (!loc || !titulo) continue;

            productos.push({
              titulo: titulo,
              url: loc,
              imagen: imagen
            });
          }

          console.log("Productos encontrados en el sitemap:", productos.length);

          if (productos.length === 0) {
            throw new Error("No se encontraron productos con imagen en el sitemap.");
          }

          // ==============================================================
          // PAGINAR Y ESCRIBIR producto-agatha-pN.json
          // ==============================================================

          const totalPaginas = Math.ceil(productos.length / POR_PAGINA);
          const generado = new Date().toISOString();

          for (let pagina = 1; pagina <= totalPaginas; pagina++) {
            const inicio = (pagina - 1) * POR_PAGINA;
            const trozo = productos.slice(inicio, inicio + POR_PAGINA);

            const resultado = {
              productos: trozo,
              pagina: pagina,
              totalPaginas: totalPaginas,
              hayMas: pagina < totalPaginas,
              generado: generado
            };

            fs.writeFileSync(
              "producto-" + SLUG + "-p" + pagina + ".json",
              JSON.stringify(resultado, null, 2),
              "utf8"
            );
          }

          console.log("========================================");
          console.log("producto-" + SLUG + "-p1.json .. p" + totalPaginas + ".json generados.");
          console.log("Total productos:", productos.length);
          console.log("Total páginas:", totalPaginas);
          console.log("========================================");
          NODE

      # ============================================================
      # 4. VALIDAR JSON
      # ============================================================

      - name: Validar producto-agatha-pN.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const primero = "producto-agatha-p1.json";

          if (!fs.existsSync(primero)) {
            throw new Error("No existe producto-agatha-p1.json");
          }

          const data = JSON.parse(fs.readFileSync(primero, "utf8"));

          if (!data || !Array.isArray(data.productos) || data.productos.length === 0) {
            throw new Error("producto-agatha-p1.json es inválido o está vacío");
          }

          for (const p of data.productos) {
            if (!p.titulo || !p.url) {
              throw new Error("Hay un producto sin título o url");
            }
          }

          const total = data.totalPaginas;
          const ultimo = "producto-agatha-p" + total + ".json";

          if (!fs.existsSync(ultimo)) {
            throw new Error("Falta la última página: " + ultimo);
          }

          console.log("JSON válido.");
          console.log("Páginas generadas:", total);
          console.log("Productos en la página 1:", data.productos.length);
          NODE

      # ============================================================
      # 5. SINCRONIZAR CON LA RAMA REMOTA ANTES DE GUARDAR
      #    (evita el error non-fast-forward cuando varios workflows
      #    hacen push a la vez sobre main)
      # ============================================================

      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      # ============================================================
      # 6. GUARDAR EN GITHUB
      # ============================================================

      - name: Guardar producto-agatha-pN.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add producto-agatha-p*.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar producto-agatha (capa 2)"
            git push
          fi
