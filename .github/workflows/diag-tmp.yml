name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          MOTOR=/tmp/motor; mkdir -p $MOTOR/cache_productos; cp productos/generar_o_servir.php $MOTOR/
          php -m | grep -i curl || echo "sin ext curl"
          php -d display_errors=1 -d error_reporting=E_ALL -r '$_GET=["url"=>"https://www.365rider.com/3-running","pagina"=>"1","refrescar"=>"1"]; include "/tmp/motor/generar_o_servir.php";' | head -c 600; echo
          ls -la $MOTOR/cache_productos | head
          cat $MOTOR/cache_productos/_plataformas.json 2>/dev/null | head -c 300; echo
