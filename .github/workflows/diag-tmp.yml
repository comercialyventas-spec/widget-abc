name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          curl -s -L --max-time 25 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o /tmp/p.html https://www.365rider.com/3-running
          echo "RES exacto: $(grep -o 'class="thumbnail product-thumbnail' /tmp/p.html | wc -l)"
          python3 - <<'PY'
          import re
          h=open('/tmp/p.html',encoding='utf-8',errors='ignore').read()
          i=h.find('thumbnail product-thumbnail')
          print('RES ctx:', re.sub(r'\s+',' ',h[i-80:i+900]))
          PY
