name: prueba-puerta-unica

# Workflow TEMPORAL de prueba: comprueba que generar_o_servir_v2.php (la puerta unica)
# saca productos de varias tiendas de distinto tipo. No escribe nada en el repositorio.

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Probar tiendas
        run: |
          mkdir -p /tmp/motor/cache_productos
          cp productos/generar_o_servir_v2.php /tmp/motor/
          probar () {
            echo "=============================================="
            echo "URL: $1"
            rm -f /tmp/motor/cache_productos/producto-*.json
            timeout 300 php -d display_errors=1 -r '$_GET = ["url" => $argv[1], "pagina" => "1", "refrescar" => "1"]; include "/tmp/motor/generar_o_servir_v2.php";' -- "$1" > /tmp/salida.json 2>/tmp/errores.txt || echo "(php termino con error)"
            echo "--- primeros 500 caracteres de la respuesta:"
            head -c 500 /tmp/salida.json; echo
            echo "--- paginas generadas: $(ls /tmp/motor/cache_productos 2>/dev/null | grep -c json || echo 0)"
            echo "--- productos en la pagina 1: $(php -r '$j=json_decode(file_get_contents("/tmp/salida.json"),true); echo isset($j["productos"])?count($j["productos"]):0;')"
            echo "--- errores:"; head -c 300 /tmp/errores.txt; echo
            echo "--- plataforma detectada:"; cat /tmp/motor/cache_productos/_plataformas.json 2>/dev/null; echo
          }
          probar "https://www.loewe.com/eur/es/mujer/bolsos"
          probar "https://tierrasafari.com/tienda"
          probar "https://www.natori.com/sitemap.xml"
          probar "https://www.basycojerez.com/43-pijamas"
