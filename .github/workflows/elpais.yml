name: Actualizar Noticias El Pais

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON con imagenes
        run: |
          node - <<'NODE'
          const https = require("https");
          const fs = require("fs");

          const FEED = "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada";

          function descargar(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0"
                }
              }, (res) => {
                let data = "";

                res.on("data", chunk => data += chunk);

                res.on("end", () => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    descargar(res.headers.location).then(resolve).catch(reject);
                    return;
                  }

                  if (res.statusCode !== 200) {
                    reject(new Error("HTTP " + res.statusCode));
                    return;
                  }

                  resolve(data);
                });
              }).on("error", reject);
            });
          }

          function limpiarHtml(texto) {
            return texto
              .replace(/<!\[CDATA\[/g, "")
              .replace(/\]\]>/g, "")
              .replace(/<[^>]*>/g, "")
              .trim();
          }

          function extraerImagen(item) {
            const patrones = [
              /<media:content[^>]+url=["']([^"']+)["']/i,
              /<media:thumbnail[^>]+url=["']([^"']+)["']/i,
              /<enclosure[^>]+url=["']([^"']+)["']/i,
              /<image[^>]+url=["']([^"']+)["']/i,
              /<img[^>]+src=["']([^"']+)["']/i,
              /src=["'](https?:\/\/[^"']+)["']/i,
              /(https?:\/\/imagenes\.elpais\.com\/[^"' <]+)/i
            ];

            for (const patron of patrones) {
              const match = item.match(patron);

              if (match && match[1]) {
                let imagen = match[1]
                  .replace(/&amp;/g, "&")
                  .replace(/&quot;/g, '"')
                  .trim();

                if (/^https?:\/\//i.test(imagen)) {
                  return imagen;
                }
              }
            }

            return "";
          }

          descargar(FEED)
            .then(data => {
              const items = data.split(/<item[\s>]/i).slice(1);
              const noticias = [];

              items.forEach(item => {
                const titleMatch = item.match(
                  /<title[^>]*>([\s\S]*?)<\/title>/i
                );

                const linkMatch = item.match(
                  /<link[^>]*>([\s\S]*?)<\/link>/i
                );

                const title = titleMatch
                  ? limpiarHtml(titleMatch[1])
                  : "";

                const link = linkMatch
                  ? limpiarHtml(linkMatch[1])
                  : "";

                const imagen = extraerImagen(item);

                if (title && link) {
                  noticias.push({
                    titulo: title,
                    link: link,
                    imagen: imagen
                  });
                }
              });

              const resultado = {
                noticias: noticias.slice(0, 6)
              };

              fs.writeFileSync(
                "noticias-1351.json",
                JSON.stringify(resultado, null, 2)
              );

              console.log("Noticias encontradas:", resultado.noticias.length);

              resultado.noticias.forEach((n, i) => {
                console.log(
                  (i + 1) + ". " +
                  n.titulo +
                  " | IMAGEN: " +
                  (n.imagen || "NO ENCONTRADA")
                );
              });
            })
            .catch(err => {
              console.error("ERROR:", err);
              process.exit(1);
            });
          NODE

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias de El Pais"
          file_pattern: noticias-1351.json
