name: Actualizar Noticias El Pais

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON con imagenes
        run: |
          node -e '
          const https = require("https");

          https.get("https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada", (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                  const items = data.split("<item>").slice(1);
                  let noticias = [];

                  items.forEach(item => {
                      let titleMatch = item.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>|<title>(.*?)<\/title>/);
                      let linkMatch = item.match(/<link>(.*?)<\/link>/);

                      let title = titleMatch ? (titleMatch[1] || titleMatch[2]) : "";
                      let link = linkMatch ? linkMatch[1].trim() : "";

                      let imgMatch =
                          item.match(/<media:content[^>]+url="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i) ||
                          item.match(/<enclosure[^>]+url="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i) ||
                          item.match(/src="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i);

                      let imagen = imgMatch ? imgMatch[1] : "";

                      if (title && link) {
                          noticias.push({
                              titulo: title.replace(/<[^>]*>/g, "").trim(),
                              link: link,
                              imagen: imagen
                          });
                      }
                  });

                  require("fs").writeFileSync(
                      "noticias-1351.json",
                      JSON.stringify({ noticias: noticias.slice(0, 6) }, null, 2)
                  );

                  console.log("JSON de El Pais actualizado.");
              });
          }).on("error", (err) => {
              console.error(err);
              process.exit(1);
          });
          '

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias de El Pais"
          file_pattern: noticias-1351.json
