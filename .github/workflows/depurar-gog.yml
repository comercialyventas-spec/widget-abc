name: depurar-gog
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -L --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' -H 'Accept-Language: es-ES,es;q=0.9' -w '\nHTTP:%{http_code}' https://www.gog.com/es/games -o /tmp/g.html -D /tmp/h.txt || true
          python3 - <<'PY'
          import re
          h=open('/tmp/g.html',encoding='utf-8',errors='replace').read()
          i=h.find('"products":[')
          print('::notice::len=%d idx=%d storeLink=%d finalMoney=%d esc_q=%d' % (len(h),i,h.count('"storeLink"'),h.count('"finalMoney"'),h.count('&q;')))
          print('::notice::'+re.sub(r'https?://\S+','U',h[i:i+700]).replace('\n',' ') if i>=0 else '::notice::sin products')
          m=re.search(r'"title":"[^"]*"',h[i:]) if i>=0 else None
          print('::notice::'+(m.group(0) if m else 'sin title'))
          PY
