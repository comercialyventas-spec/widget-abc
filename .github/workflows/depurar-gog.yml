name: depurar-gog
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/dbg.php <<'PHP'
          <?php
          $src = file_get_contents('productos/generar_o_servir.php');
          foreach (['descargarUrl', 'precioDeNumero', 'extraerGog'] as $f) {
              $p = strpos($src, "function $f(");
              $depth = 0; $i = strpos($src, '{', $p);
              for ($k = $i; $k < strlen($src); $k++) { if ($src[$k] === '{') $depth++; elseif ($src[$k] === '}') { $depth--; if ($depth === 0) break; } }
              eval(substr($src, $p, $k - $p + 1));
          }
          $h = descargarUrl('https://www.gog.com/es/games');
          echo '::notice::html=' . (is_string($h) ? strlen($h) : 'null') . "\n";
          $r = extraerGog('https://www.gog.com/es/games', 48);
          echo '::notice::productos=' . count($r) . "\n";
          if ($r) echo '::notice::' . json_encode($r[0], JSON_UNESCAPED_UNICODE) . "\n";
          else if (is_string($h)) { $q=strpos($h,'"products":[')+11; $n=strlen($h); $pr=0;$ec=false;$es=false;$fin=-1; for($i=$q;$i<$n;$i++){$c=$h[$i]; if($ec){ if($es){$es=false;} elseif($c==='\\'){$es=true;} elseif($c==='"'){$ec=false;} continue;} if($c==='"'){$ec=true;continue;} if($c==='['){$pr++;} elseif($c===']'){$pr--; if($pr===0){$fin=$i;break;}}} echo '::notice::fin='.$fin."\n"; if($fin>0){$l=json_decode(substr($h,$q,$fin-$q+1),true); echo '::notice::dec='.(is_array($l)?count($l):'null').' '.json_last_error_msg()."\n"; if(is_array($l)&&$l){ echo '::notice::keys='.implode(',',array_keys($l[0]))."\n"; echo '::notice::price='.json_encode($l[0]['price']??null)."\n"; }}  $i = strpos($h, '"products":['); echo '::notice::idx=' . var_export($i, true) . ' jsonerr=' . json_last_error_msg() . "\n"; }
          PHP
          php /tmp/dbg.php
