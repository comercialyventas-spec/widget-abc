name: depurar-gog
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -L --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' -w 'HTTP:%{http_code}' 'https://catalog.gog.com/v1/catalog?limit=48&order=desc:trending&countryCode=ES&locale=es-ES&currencyCode=EUR&productType=in:game,pack,dlc' -o /tmp/c.json > /tmp/code.txt || true
          python3 - <<'PY'
          import json
          code=open('/tmp/code.txt').read()
          print('::notice::'+code)
          try:
              d=json.load(open('/tmp/c.json'))
              p=d.get('products',[])
              print('::notice::n=%d keys=%s' % (len(p), ','.join(p[0].keys()) if p else ''))
              if p: print('::notice::'+json.dumps({k:p[0].get(k) for k in ('title','price','storeLink')},ensure_ascii=False)[:500])
          except Exception as e:
              print('::notice::err '+str(e)[:200])
          PY
