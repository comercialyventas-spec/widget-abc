name: Actualizar noticias-710
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar RSS de ElPlural
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            "https://www.elplural.com/uploads/feeds/feed_elplural_es.xml" \
            -o feed.xml

      - name: Generar noticias-1778.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const xml = fs.readFileSync("feed.xml", "utf8");

          function decode(text) {
            return String(text || "")
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, "$1")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              );
          }

          function limpiar(texto) {
            return decode(String(texto || ""))
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function escaparJson(texto) {
            return String(texto || "").trim();
          }

          function extraerTag(item, tag) {
            const re = new RegExp(
              "<" + tag + "\\b[^>]*>([\\s\\S]*?)</" + tag + ">",
              "i"
            );

            const m = item.match(re);

            return m ? m[1].trim() : "";
          }

          function extraerLink(item) {
            let m = item.match(
              /<link\b[^>]*>([\s\S]*?)<\/link>/i
            );

            if (m) {
              const link = limpiar(m[1]);
              if (link) return link;
            }

            m = item.match(
              /<link\b[^>]*href=["']([^"']+)["']/i
            );

            return m ? decode(m[1]).trim() : "";
          }

          function absoluta(url) {
            url = decode(url).trim();

            if (!url) return "";

            try {
              return new URL(
                url,
                "https://www.elplural.com/"
              ).href;
            } catch {
              return "";
            }
          }

          function esImagen(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            return (
              /^https?:\/\//i.test(url) &&
              /\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)
            );
          }

          function extraerImagen(item) {

            const candidatas = [];

            /*
             * media:content
             */
            let matches = item.match(
              /<media:content\b[^>]*(?:url|href)=["']([^"']+)["'][^>]*>/gi
            ) || [];

            for (const bloque of matches) {
              const m = bloque.match(
                /(?:url|href)=["']([^"']+)["']/i
              );

              if (m) candidatas.push(m[1]);
            }

            /*
             * media:thumbnail
             */
            matches = item.match(
              /<media:thumbnail\b[^>]*(?:url|href)=["']([^"']+)["'][^>]*>/gi
            ) || [];

            for (const bloque of matches) {
              const m = bloque.match(
                /(?:url|href)=["']([^"']+)["']/i
              );

              if (m) candidatas.push(m[1]);
            }

            /*
             * enclosure
             */
            matches = item.match(
              /<enclosure\b[^>]*(?:url|href)=["']([^"']+)["'][^>]*>/gi
            ) || [];

            for (const bloque of matches) {
              const m = bloque.match(
                /(?:url|href)=["']([^"']+)["']/i
              );

              if (m) candidatas.push(m[1]);
            }

            /*
             * description / content:encoded
             */
            const description =
              extraerTag(item, "description");

            const encoded =
              extraerTag(item, "content:encoded");

            const contenido =
              description + " " + encoded;

            const htmlImages =
              contenido.match(
                /(?:src|data-src|data-original|data-image)=["']([^"']+)["']/gi
              ) || [];

            for (const bloque of htmlImages) {
              const m = bloque.match(
                /=["']([^"']+)["']/i
              );

              if (m) candidatas.push(m[1]);
            }

            /*
             * URLs directas dentro del contenido.
             */
            const urls =
              contenido.match(
                /https?:\/\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/gi
              ) || [];

            candidatas.push(...urls);

            /*
             * Normalizar y filtrar.
             */
            const validas = [];

            for (let url of candidatas) {

              url = absoluta(url);

              if (!esImagen(url)) continue;

              const u = url.toLowerCase();

              if (
                u.includes("pixel") ||
                u.includes("tracking") ||
                u.includes("tracker") ||
                u.includes("spacer") ||
                u.includes("transparent") ||
                u.includes("favicon") ||
                u.includes("logo") ||
                u.includes("sprite") ||
                u.includes("/avatar")
              ) {
                continue;
              }

              validas.push(url);
            }

            const unicas =
              [...new Set(validas)];

            /*
             * Preferimos imágenes grandes.
             */
            unicas.sort((a, b) => {

              function puntuacion(url) {

                const u = url.toLowerCase();

                let puntos = 0;

                if (u.includes("1200")) puntos += 50;
                if (u.includes("1024")) puntos += 45;
                if (u.includes("800")) puntos += 40;
                if (u.includes("750")) puntos += 35;
                if (u.includes("635")) puntos += 30;
                if (u.includes("540")) puntos += 25;
                if (u.includes("400")) puntos += 10;

                return puntos;
              }

              return puntuacion(b) - puntuacion(a);
            });

            return unicas[0] || "";
          }

          /*
           * ==========================================
           * EXTRAER ITEMS RSS
           * ==========================================
           */

          const bloques =
            xml.match(
              /<item\b[\s\S]*?<\/item>/gi
            ) || [];

          if (!bloques.length) {
            throw new Error(
              "El RSS no contiene elementos <item>."
            );
          }

          const noticias = [];
          const vistos = new Set();

          for (const item of bloques) {

            if (noticias.length >= 6) break;

            const titulo =
              limpiar(
                extraerTag(item, "title")
              );

            const link =
              absoluta(
                extraerLink(item)
              );

            if (!titulo || !link) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            if (
              !/^https?:\/\/(?:www\.)?elplural\.com\//i.test(link)
            ) {
              continue;
            }

            const imagen =
              extraerImagen(item);

            vistos.add(link);

            noticias.push({
              titulo: escaparJson(titulo),
              link: link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          if (!noticias.length) {
            throw new Error(
              "No se encontraron noticias válidas en el RSS de ElPlural."
            );
          }

          /*
           * ==========================================
           * GUARDAR JSON
           * ==========================================
           */

          const resultado = {
            noticias
          };

          fs.writeFileSync(
            "noticias-1778.json",
            JSON.stringify(resultado, null, 2) + "\n",
            "utf8"
          );

          console.log(
            `Generadas ${noticias.length} noticias.`
          );

          for (const noticia of noticias) {
            console.log("");
            console.log("TÍTULO:", noticia.titulo);
            console.log("LINK:", noticia.link);
            console.log(
              "IMAGEN:",
              noticia.imagen || "NINGUNA"
            );
          }

          console.log("");
          console.log(
            "noticias-1778.json generado correctamente."
          );
          NODE

      - name: Validar noticias-1778.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-1778.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-1778.json está vacío."
            );
          }

          const vistos = new Set();

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (vistos.has(noticia.link)) {
              throw new Error(
                "Artículo duplicado: " +
                noticia.link
              );
            }

            vistos.add(noticia.link);

            if (
              !/^https?:\/\/(?:www\.)?elplural\.com\//i.test(
                noticia.link
              )
            ) {
              throw new Error(
                "Enlace que no pertenece a ElPlural: " +
                noticia.link
              );
            }

            if (noticia.imagen) {

              if (
                !/^https?:\/\//i.test(
                  noticia.imagen
                )
              ) {
                throw new Error(
                  "Imagen inválida: " +
                  noticia.imagen
                );
              }

              if (
                !/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(
                  noticia.imagen
                )
              ) {
                throw new Error(
                  "Formato de imagen no válido: " +
                  noticia.imagen
                );
              }
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() ===
              "comentarios"
            ) {
              throw new Error(
                "Se encontró 'comentarios' como noticia."
              );
            }
          }

          console.log(
            `JSON válido: ${data.noticias.length} noticias.`
          );
          NODE

      - name: Guardar noticias-1778.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-1778.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-1778"
            git push
          fi
