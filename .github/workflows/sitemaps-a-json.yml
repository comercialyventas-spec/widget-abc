name: Sitemaps a JSON (datos/)

# Lee los sitemaps de datos/sitemaps_lista.txt (tiendas y categorias de Cash Fresh...)
# y guarda datos/<salida>.json para que los posts no usen Apps Script.
on:
  schedule:
    - cron: '50 4 * * *'
  push:
    branches: [main]
    paths: ['datos/sitemaps_lista.txt', 'datos/sitemaps_a_json.py']
  workflow_dispatch:

permissions:
  contents: write

# Grupo propio: en widget-abc-git-write (compartido con las noticias frecuentes) GitHub cancelaba la ejecución pendiente
# de este workflow poco frecuente. El choque de pushes lo resuelven el paso de sincronizar y los reintentos.
concurrency:
  group: sitemaps-a-json
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar
        run: |
          python3 datos/sitemaps_a_json.py datos/sitemaps_lista.txt | tee /tmp/res.txt
          while IFS= read -r l; do echo "::notice::$l"; done < /tmp/res.txt
      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: sitemaps a JSON"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          for intento in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          echo "::error title=No se pudo guardar sitemaps::El push a GitHub fallo 5 veces seguidas."
          exit 1
