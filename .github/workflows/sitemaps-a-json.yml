name: Sitemaps a JSON (datos/)

# Lee los sitemaps de datos/sitemaps_lista.txt (tiendas y categorias de Cash Fresh...)
# y guarda datos/<salida>.json para que los posts no usen Apps Script.
on:
  schedule:
    - cron: '50 4 * * *'
  push:
    branches: [main]
    paths: ['datos/sitemaps_lista.txt', 'datos/sitemaps_a_json.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar
        run: |
          python3 datos/sitemaps_a_json.py datos/sitemaps_lista.txt | tee /tmp/res.txt
          while IFS= read -r l; do echo "::notice::$l"; done < /tmp/res.txt
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: sitemaps a JSON"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
