name: Actualizar Noticias eldiario Tecnologia

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON
        run: |
          node <<'NODE'
          const https = require("https");
          const fs = require("fs");

          const FEED = "https://www.eldiario.es/tecnologia/";
          const ARCHIVO = "noticias-710.json";

          function descargar(url) {
            return new Promise((resolve, reject) => {

              https.get(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0"
                }
              }, res => {

                let data = "";

                res.on("data", chunk => {
                  data += chunk;
                });

                res.on("end", () => {

                  if (res.statusCode >= 400) {
                    reject(new Error("HTTP " + res.statusCode));
                    return;
                  }

                  resolve(data);
                });

              }).on("error", reject);
            });
          }

          function limpiar(texto) {

            return String(texto || "")
              .replace(/<!\[CDATA\[/g, "")
              .replace(/\]\]>/g, "")
              .replace(/<[^>]*>/g, "")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .trim();
          }

          function extraer(tag, texto) {

            const inicio = texto.indexOf("<" + tag);

            if (inicio === -1) {
              return "";
            }

            const mayor = texto.indexOf(">", inicio);

            if (mayor === -1) {
              return "";
            }

            const fin = texto.indexOf("</" + tag + ">", mayor);

            if (fin === -1) {
              return "";
            }

            return texto
              .substring(mayor + 1, fin)
              .trim();
          }

          function extraerAtributo(tag, atributo, texto) {

            const inicio = texto.indexOf("<" + tag);

            if (inicio === -1) {
              return "";
            }

            const fin = texto.indexOf(">", inicio);

            if (fin === -1) {
              return "";
            }

            const etiqueta = texto.substring(inicio, fin + 1);

            const patron =
              atributo + '="';

            const pos = etiqueta.indexOf(patron);

            if (pos === -1) {
              return "";
            }

            const comienzo = pos + patron.length;

            const cierre = etiqueta.indexOf('"', comienzo);

            if (cierre === -1) {
              return "";
            }

            return etiqueta.substring(comienzo, cierre);
          }

          function extraerMedia(contenido, item) {

            /*
             * 1. Buscar vídeo MP4/WebM/OGG
             */

            const video =
              contenido.match(
                /(?:src|href)=["'](https?:\/\/[^"']+\.(?:mp4|webm|ogg)(?:\?[^"']*)?)["']/i
              );

            if (video) {
              return {
                url: video[1],
                tipo: "video"
              };
            }

            /*
             * 2. Buscar imagen dentro del contenido
             */

            const imagen =
              contenido.match(
                /(?:src|href)=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp)(?:\?[^"']*)?)["']/i
              );

            if (imagen) {
              return {
                url: imagen[1],
                tipo: "imagen"
              };
            }

            /*
             * 3. media:content
             */

            const mediaUrl =
              extraerAtributo(
                "media:content",
                "url",
                item
              );

            if (mediaUrl) {

              if (
                /\.(mp4|webm|ogg)(\?|$)/i.test(
                  mediaUrl
                )
              ) {
                return {
                  url: mediaUrl,
                  tipo: "video"
                };
              }

              return {
                url: mediaUrl,
                tipo: "imagen"
              };
            }

            /*
             * 4. media:thumbnail
             */

            const thumbnail =
              extraerAtributo(
                "media:thumbnail",
                "url",
                item
              );

            if (thumbnail) {
              return {
                url: thumbnail,
                tipo: "imagen"
              };
            }

            /*
             * 5. enclosure
             */

            const enclosure =
              extraerAtributo(
                "enclosure",
                "url",
                item
              );

            if (enclosure) {

              if (
                /\.(mp4|webm|ogg)(\?|$)/i.test(
                  enclosure
                )
              ) {
                return {
                  url: enclosure,
                  tipo: "video"
                };
              }

              return {
                url: enclosure,
                tipo: "imagen"
              };
            }

            return {
              url: "",
              tipo: ""
            };
          }

          async function main() {

            console.log(
              "Descargando eldiario.es..."
            );

            const xml =
              await descargar(FEED);

            console.log(
              "Contenido recibido:",
              xml.length,
              "caracteres"
            );

            const items =
              xml
                .split(/<item[\s>]/i)
                .slice(1);

            console.log(
              "Items encontrados:",
              items.length
            );

            const noticias = [];

            for (const bloque of items) {

              const item =
                "<item " + bloque;

              let titulo =
                limpiar(
                  extraer(
                    "title",
                    item
                  )
                );

              let link =
                limpiar(
                  extraer(
                    "link",
                    item
                  )
                );

              if (!link) {
                link =
                  limpiar(
                    extraer(
                      "guid",
                      item
                    )
                  );
              }

              const description =
                extraer(
                  "description",
                  item
                );

              const content =
                extraer(
                  "content:encoded",
                  item
                );

              const contenido =
                content ||
                description ||
                "";

              const media =
                extraerMedia(
                  contenido,
                  item
                );

              if (titulo && link) {

                noticias.push({
                  titulo: titulo,
                  link: link,
                  imagen: media.url,
                  tipo: media.tipo
                });
              }

              if (noticias.length >= 6) {
                break;
              }
            }

            if (!noticias.length) {
              throw new Error(
                "No se encontraron noticias válidas"
              );
            }

            const salida = {
              noticias: noticias
            };

            fs.writeFileSync(
              ARCHIVO,
              JSON.stringify(
                salida,
                null,
                2
              )
            );

            console.log(
              "JSON generado correctamente."
            );

            console.log(
              JSON.stringify(
                salida,
                null,
                2
              )
            );
          }

          main().catch(error => {

            console.error(
              "ERROR:",
              error.message
            );

            process.exit(1);
          });

          NODE

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias eldiario tecnologia"
          file_pattern: noticias-710.json
