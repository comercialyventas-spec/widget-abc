name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==================================================
      # 2. DESCARGAR ELDIARIO.ES TECNOLOGÍA
      # ==================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            -A "Mozilla/5.0" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html


      # ==================================================
      # 3. GENERAR noticias-710.json
      # ==================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&#x27;/gi, "'")
              .replace(/&#x2F;/gi, "/")
              .replace(/\s+/g, " ")
              .trim();
          }

          function extraerImagen(bloque) {

            let m = bloque.match(
              /<img[^>]+src=["']([^"']+)["']/i
            );

            if (m) {
              return m[1];
            }

            m = bloque.match(
              /<img[^>]+data-src=["']([^"']+)["']/i
            );

            if (m) {
              return m[1];
            }

            m = bloque.match(
              /<img[^>]+data-lazy-src=["']([^"']+)["']/i
            );

            if (m) {
              return m[1];
            }

            m = bloque.match(
              /<source[^>]+src=["']([^"']+)["']/i
            );

            if (m) {
              return m[1];
            }

            return "";
          }

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a\b[^>]*href=["']([^"']*\/tecnologia\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let match;

          while ((match = patron.exec(html)) !== null) {

            if (noticias.length >= 6) {
              break;
            }

            let link = match[1];

            if (link.startsWith("/")) {
              link =
                "https://www.eldiario.es" +
                link;
            }

            if (
              !link.startsWith(
                "https://www.eldiario.es/tecnologia/"
              )
            ) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            const contenido = match[2];

            const titulo = limpiar(
              contenido
                .replace(
                  /<svg[\s\S]*?<\/svg>/gi,
                  ""
                )
                .replace(
                  /<img[\s\S]*?>/gi,
                  ""
                )
                .replace(
                  /<picture[\s\S]*?<\/picture>/gi,
                  ""
                )
                .replace(
                  /<source[\s\S]*?>/gi,
                  ""
                )
            );

            if (
              !titulo ||
              titulo.length < 20
            ) {
              continue;
            }

            const imagen =
              extraerImagen(contenido);

            vistos.add(link);

            noticias.push({
              titulo: titulo,
              link: link,
              imagen: imagen,
              tipo: imagen
                ? "imagen"
                : ""
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron noticias de tecnología"
            );
          }

          const resultado = {
            noticias: noticias
          };

          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log(
            "Generado noticias-710.json con",
            noticias.length,
            "noticias."
          );

          console.log(
            JSON.stringify(
              resultado,
              null,
              2
            )
          );

          NODE


      # ==================================================
      # 4. VALIDAR noticias-710.json
      # ==================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-710.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-710.json está vacío o es inválido"
            );
          }

          for (
            const noticia
            of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {
              throw new Error(
                "Hay una noticia sin título o enlace"
              );
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Número de noticias:",
            data.noticias.length
          );

          NODE


      # ==================================================
      # 5. GUARDAR noticias-710.json
      # ==================================================

      - name: Guardar noticias-710.json
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then

            echo "No hay cambios nuevos."

          else

            git commit \
              -m "Actualizar noticias-710"

            git push

          fi
