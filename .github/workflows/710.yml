name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # DESCARGAR PÁGINA DE TECNOLOGÍA
      # ==================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            --compressed \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

          echo "Página descargada."
          wc -c pagina.html


      # ==================================================
      # GENERAR JSON
      # ==================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          // --------------------------------------------------
          // UTILIDADES
          // --------------------------------------------------

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<svg[\s\S]*?<\/svg>/gi, " ")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#x27;/gi, "'")
              .replace(/&#x2F;/gi, "/")
              .replace(/&#(\d+);/gi, function(_, n) {
                return String.fromCharCode(Number(n));
              })
              .replace(/\s+/g, " ")
              .trim();
          }

          function normalizarUrl(url) {
            if (!url) return "";

            url = url.trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.eldiario.es" + url;
            }

            return url;
          }

          function esNoticiaTecnologia(url) {
            return /^https:\/\/www\.eldiario\.es\/tecnologia\/[^?#]+/i.test(url);
          }

          function obtenerAtributo(tag, atributo) {
            const re = new RegExp(
              atributo + '\\s*=\\s*["\\']([^"\\']+)["\\']',
              "i"
            );

            const m = tag.match(re);

            return m ? m[1] : "";
          }

          // --------------------------------------------------
          // EXTRAER IMAGEN DE UN BLOQUE
          // --------------------------------------------------

          function extraerImagen(bloque) {

            // 1. src
            let m = bloque.match(
              /<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              const url = normalizarUrl(m[1]);

              if (url && !url.startsWith("data:")) {
                return url;
              }
            }

            // 2. data-src
            m = bloque.match(
              /<img\b[^>]*\bdata-src\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              const url = normalizarUrl(m[1]);

              if (url && !url.startsWith("data:")) {
                return url;
              }
            }

            // 3. srcset
            m = bloque.match(
              /<img\b[^>]*\bsrcset\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              const candidatos = m[1]
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);

              if (candidatos.length) {
                const ultimo = candidatos[candidatos.length - 1]
                  .split(/\s+/)[0];

                const url = normalizarUrl(ultimo);

                if (url && !url.startsWith("data:")) {
                  return url;
                }
              }
            }

            // 4. data-srcset
            m = bloque.match(
              /<img\b[^>]*\bdata-srcset\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              const candidatos = m[1]
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);

              if (candidatos.length) {
                const ultimo = candidatos[candidatos.length - 1]
                  .split(/\s+/)[0];

                const url = normalizarUrl(ultimo);

                if (url && !url.startsWith("data:")) {
                  return url;
                }
              }
            }

            // 5. picture/source
            m = bloque.match(
              /<source\b[^>]*\bsrcset\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              const candidatos = m[1]
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);

              if (candidatos.length) {
                const ultimo = candidatos[candidatos.length - 1]
                  .split(/\s+/)[0];

                const url = normalizarUrl(ultimo);

                if (url && !url.startsWith("data:")) {
                  return url;
                }
              }
            }

            // 6. Open Graph dentro del bloque
            m = bloque.match(
              /<meta\b[^>]*property\s*=\s*["']og:image["'][^>]*content\s*=\s*["']([^"']+)["']/i
            );

            if (m) {
              return normalizarUrl(m[1]);
            }

            return "";
          }

          // --------------------------------------------------
          // OBTENER TITULO DE UN ENLACE
          // --------------------------------------------------

          function obtenerTituloDesdeEnlace(enlaceCompleto) {

            const contenido = enlaceCompleto
              .replace(/<img\b[^>]*>/gi, " ")
              .replace(/<picture[\s\S]*?<\/picture>/gi, " ")
              .replace(/<svg[\s\S]*?<\/svg>/gi, " ");

            const titulo = limpiar(contenido);

            return titulo;
          }

          // --------------------------------------------------
          // BUSCAR BLOQUE PADRE DE UNA NOTICIA
          // --------------------------------------------------

          function buscarBloqueNoticia(posicionEnlace) {

            /*
             * Buscamos hacia atrás distintos contenedores habituales
             * utilizados por eldiario.es.
             *
             * No cogemos una imagen global de la página.
             * La imagen debe encontrarse dentro del bloque de la noticia.
             */

            const antes = html.slice(
              Math.max(0, posicionEnlace - 15000),
              posicionEnlace
            );

            const patrones = [
              /<article\b[^>]*>/gi,
              /<div\b[^>]*(?:class|data-testid|data-test)[^>]*>/gi,
              /<li\b[^>]*>/gi
            ];

            let mejorInicio = -1;

            for (const patron of patrones) {

              let match;

              while ((match = patron.exec(antes)) !== null) {
                mejorInicio =
                  Math.max(
                    mejorInicio,
                    Math.max(
                      0,
                      posicionEnlace - 15000
                    ) + match.index
                  );
              }
            }

            if (mejorInicio < 0) {
              return "";
            }

            const desde =
              html.slice(mejorInicio, posicionEnlace);

            /*
             * Nos quedamos con un máximo razonable para no saltar
             * a otra noticia.
             */

            return desde.slice(-12000);
          }

          // --------------------------------------------------
          // EXTRAER ENLACES
          // --------------------------------------------------

          const enlaces = [];

          const patronEnlace =
            /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>[\s\S]*?<\/a>/gi;

          let match;

          while ((match = patronEnlace.exec(html)) !== null) {

            let link =
              normalizarUrl(match[1]);

            if (!esNoticiaTecnologia(link)) {
              continue;
            }

            const bloqueEnlace =
              match[0];

            const titulo =
              obtenerTituloDesdeEnlace(
                bloqueEnlace
              );

            if (!titulo || titulo.length < 20) {
              continue;
            }

            enlaces.push({
              link: link,
              titulo: titulo,
              posicion: match.index,
              bloqueEnlace: bloqueEnlace
            });
          }

          console.log(
            "Enlaces de tecnología encontrados:",
            enlaces.length
          );

          // --------------------------------------------------
          // CONSTRUIR NOTICIAS
          // --------------------------------------------------

          const noticias = [];
          const vistos = new Set();

          for (const entrada of enlaces) {

            if (noticias.length >= 6) {
              break;
            }

            if (vistos.has(entrada.link)) {
              continue;
            }

            /*
             * Primero buscamos la imagen dentro del propio enlace.
             */
            let imagen =
              extraerImagen(
                entrada.bloqueEnlace
              );

            /*
             * Si no está dentro del enlace,
             * buscamos en su bloque de noticia.
             */
            if (!imagen) {

              const bloque =
                buscarBloqueNoticia(
                  entrada.posicion
                );

              if (bloque) {
                imagen =
                  extraerImagen(
                    bloque
                  );
              }
            }

            /*
             * Solo aceptamos imágenes reales.
             */
            if (
              imagen &&
              !/^https?:\/\//i.test(imagen)
            ) {
              imagen = "";
            }

            vistos.add(
              entrada.link
            );

            noticias.push({
              titulo: entrada.titulo,
              link: entrada.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          // --------------------------------------------------
          // COMPROBACIÓN
          // --------------------------------------------------

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron noticias de tecnología."
            );
          }

          // --------------------------------------------------
          // RESULTADO
          // --------------------------------------------------

          const resultado = {
            noticias: noticias
          };

          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "=========================================="
          );
          console.log(
            "noticias-710.json generado correctamente"
          );
          console.log(
            "Noticias:",
            noticias.length
          );
          console.log(
            "=========================================="
          );
          console.log("");

          noticias.forEach(function(noticia, i) {

            console.log(
              (i + 1) +
              ". " +
              noticia.titulo
            );

            console.log(
              "   LINK:",
              noticia.link
            );

            console.log(
              "   IMAGEN:",
              noticia.imagen || "SIN IMAGEN"
            );

            console.log("");
          });

          NODE


      # ==================================================
      # VALIDAR JSON
      # ==================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-710.json",
              "utf8"
            )
          );

          if (
            !data ||
            !Array.isArray(data.noticias)
          ) {
            throw new Error(
              "El JSON no contiene el array noticias."
            );
          }

          if (
            data.noticias.length === 0
          ) {
            throw new Error(
              "El JSON está vacío."
            );
          }

          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {
              throw new Error(
                "Existe una noticia sin título o enlace."
              );
            }

            if (
              !/^https:\/\/www\.eldiario\.es\/tecnologia\//i.test(
                noticia.link
              )
            ) {
              throw new Error(
                "Enlace fuera de tecnología: " +
                noticia.link
              );
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Número de noticias:",
            data.noticias.length
          );

          console.log(
            JSON.stringify(
              data,
              null,
              2
            )
          );
          NODE


      # ==================================================
      # GUARDAR EN GITHUB
      # ==================================================

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
