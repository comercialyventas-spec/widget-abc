name: Actualizar noticias-710

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
 
    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout del repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. DESCARGAR LA SECCIÓN TECNOLOGÍA
      # ============================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

          echo "Página descargada correctamente."
          wc -c pagina.html


      # ============================================================
      # 3. GENERAR noticias-710.json
      # ============================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          (async function () {

            const html =
              fs.readFileSync(
                "pagina.html",
                "utf8"
              );


            // ======================================================
            // FUNCIONES
            // ======================================================

            function decodeHtml(text) {

              return String(text || "")
                .replace(/&amp;/gi, "&")
                .replace(/&quot;/gi, '"')
                .replace(/&#39;/gi, "'")
                .replace(/&apos;/gi, "'")
                .replace(/&lt;/gi, "<")
                .replace(/&gt;/gi, ">")
                .replace(/&#x27;/gi, "'")
                .replace(/&#x2F;/gi, "/")
                .replace(/&#(\d+);/g, function (_, n) {
                  return String.fromCharCode(
                    Number(n)
                  );
                });

            }


            function limpiar(texto) {

              return decodeHtml(
                String(texto || "")
                  .replace(
                    /<script[\s\S]*?<\/script>/gi,
                    " "
                  )
                  .replace(
                    /<style[\s\S]*?<\/style>/gi,
                    " "
                  )
                  .replace(
                    /<svg[\s\S]*?<\/svg>/gi,
                    " "
                  )
                  .replace(
                    /<[^>]+>/g,
                    " "
                  )
              )
                .replace(/\s+/g, " ")
                .trim();

            }


            function urlAbsoluta(url) {

              if (!url) {
                return "";
              }

              url =
                decodeHtml(
                  url.trim()
                );

              if (
                url.startsWith("//")
              ) {
                return "https:" + url;
              }

              if (
                url.startsWith("/")
              ) {
                return (
                  "https://www.eldiario.es" +
                  url
                );
              }

              return url;

            }


            function atributo(
              bloque,
              nombre
            ) {

              const expresion =
                new RegExp(
                  nombre +
                  "\\s*=\\s*(['\"])(.*?)\\1",
                  "i"
                );

              const encontrado =
                bloque.match(
                  expresion
                );

              if (!encontrado) {
                return "";
              }

              return decodeHtml(
                encontrado[2]
              );

            }


            // ======================================================
            // BUSCAR ENLACES DE ARTÍCULOS
            // ======================================================

            const enlaces =
              html.match(
                /<a\b[^>]*href\s*=\s*(['"])(.*?)\1[^>]*>[\s\S]*?<\/a>/gi
              ) || [];


            const candidatos = [];

            for (
              const bloque of enlaces
            ) {

              const href =
                atributo(
                  bloque,
                  "href"
                );

              if (!href) {
                continue;
              }


              let link =
                urlAbsoluta(
                  href
                );


              link =
                link
                  .split("#")[0]
                  .split("?")[0];


              // Solo artículos de tecnología
              if (
                !link.startsWith(
                  "https://www.eldiario.es/tecnologia/"
                )
              ) {
                continue;
              }


              // No coger la propia portada
              if (
                link ===
                "https://www.eldiario.es/tecnologia/"
              ) {
                continue;
              }


              if (
                link ===
                "https://www.eldiario.es/tecnologia"
              ) {
                continue;
              }


              let titulo =
                limpiar(
                  bloque
                );


              if (!titulo) {
                continue;
              }


              if (
                titulo.length < 20
              ) {
                continue;
              }


              if (
                titulo.length > 300
              ) {
                continue;
              }


              candidatos.push({
                titulo: titulo,
                link: link
              });

            }


            // ======================================================
            // ELIMINAR DUPLICADOS
            // ======================================================

            const vistos =
              new Set();

            const articulos = [];


            for (
              const candidato of candidatos
            ) {

              if (
                vistos.has(
                  candidato.link
                )
              ) {
                continue;
              }

              vistos.add(
                candidato.link
              );

              articulos.push(
                candidato
              );

            }


            // ======================================================
            // TOMAR LOS PRIMEROS 6
            // ======================================================

            const seleccion =
              articulos.slice(
                0,
                6
              );


            if (
              seleccion.length === 0
            ) {

              throw new Error(
                "No se encontraron artículos de tecnología."
              );

            }


            console.log(
              "Artículos encontrados:",
              seleccion.length
            );


            // ======================================================
            // OBTENER IMAGEN DE CADA ARTÍCULO
            //
            // IMPORTANTE:
            // Cada noticia se descarga individualmente.
            // Se busca primero og:image.
            // ======================================================

            async function obtenerImagen(
              url
            ) {

              try {

                console.log(
                  "Buscando imagen:",
                  url
                );


                const respuesta =
                  await fetch(
                    url,
                    {
                      headers: {
                        "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36",
                        "Accept":
                          "text/html,application/xhtml+xml"
                      }
                    }
                  );


                if (
                  !respuesta.ok
                ) {

                  console.log(
                    "No se pudo descargar:",
                    respuesta.status
                  );

                  return "";

                }


                const pagina =
                  await respuesta.text();


                // --------------------------------------------------
                // og:image
                // --------------------------------------------------

                const metas =
                  pagina.match(
                    /<meta\b[^>]*>/gi
                  ) || [];


                for (
                  const meta of metas
                ) {

                  const property =
                    atributo(
                      meta,
                      "property"
                    );


                  const name =
                    atributo(
                      meta,
                      "name"
                    );


                  const content =
                    atributo(
                      meta,
                      "content"
                    );


                  if (
                    (
                      property ===
                      "og:image" ||
                      property ===
                      "og:image:url" ||
                      name ===
                      "og:image"
                    ) &&
                    content
                  ) {

                    const imagen =
                      urlAbsoluta(
                        content
                      );

                    console.log(
                      "Imagen encontrada:",
                      imagen
                    );

                    return imagen;

                  }

                }


                // --------------------------------------------------
                // Segundo intento:
                // twitter:image
                // --------------------------------------------------

                for (
                  const meta of metas
                ) {

                  const name =
                    atributo(
                      meta,
                      "name"
                    );


                  const property =
                    atributo(
                      meta,
                      "property"
                    );


                  const content =
                    atributo(
                      meta,
                      "content"
                    );


                  if (
                    (
                      name ===
                      "twitter:image" ||
                      property ===
                      "twitter:image"
                    ) &&
                    content
                  ) {

                    const imagen =
                      urlAbsoluta(
                        content
                      );

                    console.log(
                      "Imagen Twitter encontrada:",
                      imagen
                    );

                    return imagen;

                  }

                }


                // --------------------------------------------------
                // Tercer intento:
                // imagen dentro del HTML del artículo
                // --------------------------------------------------

                const imagenes =
                  pagina.match(
                    /<img\b[^>]*>/gi
                  ) || [];


                for (
                  const img of imagenes
                ) {

                  let src =
                    atributo(
                      img,
                      "src"
                    );


                  if (!src) {

                    src =
                      atributo(
                        img,
                        "data-src"
                      );

                  }


                  if (!src) {

                    src =
                      atributo(
                        img,
                        "data-lazy-src"
                      );

                  }


                  if (!src) {
                    continue;
                  }


                  src =
                    urlAbsoluta(
                      src
                    );


                  if (
                    src.startsWith(
                      "https://static.eldiario.es/"
                    )
                  ) {

                    console.log(
                      "Imagen encontrada en contenido:",
                      src
                    );

                    return src;

                  }

                }


                console.log(
                  "No se encontró imagen."
                );

                return "";

              } catch (error) {

                console.log(
                  "Error obteniendo imagen:",
                  error.message
                );

                return "";

              }

            }


            // ======================================================
            // CREAR JSON FINAL
            // ======================================================

            const noticias = [];


            for (
              const articulo of seleccion
            ) {

              const imagen =
                await obtenerImagen(
                  articulo.link
                );


              noticias.push({
                titulo:
                  articulo.titulo,

                link:
                  articulo.link,

                imagen:
                  imagen,

                tipo:
                  imagen
                    ? "imagen"
                    : ""
              });


              // Pequeña pausa para no bombardear la web
              await new Promise(
                function (resolve) {
                  setTimeout(
                    resolve,
                    500
                  );
                }
              );

            }


            // ======================================================
            // COMPROBACIÓN FINAL
            // ======================================================

            if (
              noticias.length === 0
            ) {

              throw new Error(
                "No se pudieron generar noticias."
              );

            }


            const resultado = {
              noticias:
                noticias
            };


            fs.writeFileSync(
              "noticias-710.json",
              JSON.stringify(
                resultado,
                null,
                2
              ),
              "utf8"
            );


            console.log(
              "========================================"
            );

            console.log(
              "noticias-710.json generado."
            );

            console.log(
              "Noticias:",
              noticias.length
            );

            console.log(
              "Con imagen:",
              noticias.filter(
                function (n) {
                  return !!n.imagen;
                }
              ).length
            );

            console.log(
              "========================================"
            );

            console.log(
              JSON.stringify(
                resultado,
                null,
                2
              )
            );

          })().catch(function (error) {

            console.error(
              "ERROR:",
              error
            );

            process.exit(1);

          });

          NODE


      # ============================================================
      # 4. VALIDAR JSON
      # ============================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo =
            "noticias-710.json";


          if (
            !fs.existsSync(
              archivo
            )
          ) {

            throw new Error(
              "No existe noticias-710.json"
            );

          }


          const data =
            JSON.parse(
              fs.readFileSync(
                archivo,
                "utf8"
              )
            );


          if (
            !data ||
            !Array.isArray(
              data.noticias
            ) ||
            data.noticias.length === 0
          ) {

            throw new Error(
              "noticias-710.json es inválido o está vacío"
            );

          }


          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {

              throw new Error(
                "Hay una noticia sin título o enlace"
              );

            }

          }


          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "Noticias con imagen:",
            data.noticias.filter(
              function (n) {
                return !!n.imagen;
              }
            ).length
          );

          NODE


      # ============================================================
      # 5. GUARDAR EN GITHUB
      # ============================================================

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
