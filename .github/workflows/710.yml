name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout del repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. DESCARGAR EL DIARIO.ES
      # ============================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html


      # ============================================================
      # 3. GENERAR noticias-710.json
      # ============================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#x27;/gi, "'")
              .replace(/&#x2F;/gi, "/")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              );
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]+>/g, " ")
            )
              .replace(/\s+/g, " ")
              .trim();
          }

          function urlAbsoluta(url) {
            if (!url) return "";

            url = decodeHtml(url.trim());

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.eldiario.es" + url;
            }

            return url;
          }

          function buscarAtributo(bloque, atributo) {
            const patron = new RegExp(
              atributo + "\\s*=\\s*(['\"])(.*?)\\1",
              "i"
            );

            const resultado = bloque.match(patron);

            return resultado
              ? decodeHtml(resultado[2])
              : "";
          }

          function extraerImagen(bloque) {

            const atributos = [
              "src",
              "data-src",
              "data-lazy-src",
              "data-original",
              "srcset",
              "data-srcset"
            ];

            for (const atributo of atributos) {

              const valor = buscarAtributo(
                bloque,
                atributo
              );

              if (!valor) continue;

              if (
                atributo === "srcset" ||
                atributo === "data-srcset"
              ) {
                const primera =
                  valor
                    .split(",")[0]
                    .trim()
                    .split(/\s+/)[0];

                if (primera) {
                  return urlAbsoluta(primera);
                }
              }

              return urlAbsoluta(valor);
            }

            return "";
          }

          // ========================================================
          // JSON-LD
          // ========================================================

          const jsonLd = [];

          const scripts =
            html.match(
              /<script[^>]+type=["']application\/ld\+json["'][^>]*>[\s\S]*?<\/script>/gi
            ) || [];

          for (const script of scripts) {

            const contenido =
              script
                .replace(/^<script[^>]*>/i, "")
                .replace(/<\/script>$/i, "")
                .trim();

            try {
              const datos = JSON.parse(contenido);

              if (Array.isArray(datos)) {
                jsonLd.push(...datos);
              } else {
                jsonLd.push(datos);
              }

            } catch (e) {
              // Ignorar JSON-LD inválido
            }
          }

          const imagenesPorUrl = new Map();

          function registrarJsonLd(obj) {

            if (!obj || typeof obj !== "object") {
              return;
            }

            let url = "";

            if (typeof obj.url === "string") {
              url = obj.url;
            }

            if (
              obj.mainEntityOfPage &&
              typeof obj.mainEntityOfPage === "object" &&
              typeof obj.mainEntityOfPage["@id"] === "string"
            ) {
              url = obj.mainEntityOfPage["@id"];
            }

            let imagen = "";

            if (typeof obj.image === "string") {
              imagen = obj.image;
            }

            if (Array.isArray(obj.image) && obj.image.length) {

              const primera = obj.image[0];

              if (typeof primera === "string") {
                imagen = primera;
              } else if (
                primera &&
                typeof primera.url === "string"
              ) {
                imagen = primera.url;
              }
            }

            if (
              obj.image &&
              typeof obj.image === "object" &&
              typeof obj.image.url === "string"
            ) {
              imagen = obj.image.url;
            }

            if (url && imagen) {

              const urlFinal =
                urlAbsoluta(url).split("#")[0];

              imagenesPorUrl.set(
                urlFinal,
                urlAbsoluta(imagen)
              );
            }

            if (Array.isArray(obj["@graph"])) {
              for (const elemento of obj["@graph"]) {
                registrarJsonLd(elemento);
              }
            }
          }

          for (const obj of jsonLd) {
            registrarJsonLd(obj);
          }


          // ========================================================
          // ENLACES DE TECNOLOGÍA
          // ========================================================

          const enlaces =
            html.match(
              /<a\b[^>]*href\s*=\s*(['"])(.*?)\1[^>]*>[\s\S]*?<\/a>/gi
            ) || [];

          const candidatos = [];

          for (const bloque of enlaces) {

            const href =
              buscarAtributo(bloque, "href");

            if (!href) continue;

            const link =
              urlAbsoluta(href)
                .split("#")[0];

            if (
              !link.startsWith(
                "https://www.eldiario.es/tecnologia/"
              )
            ) {
              continue;
            }

            if (
              link.endsWith("/tecnologia/") ||
              link.endsWith("/tecnologia")
            ) {
              continue;
            }

            let titulo = limpiar(bloque);

            if (!titulo) continue;

            if (titulo.length < 20) continue;

            if (titulo.length > 300) continue;

            candidatos.push({
              titulo,
              link,
              bloque
            });
          }


          // ========================================================
          // ELIMINAR DUPLICADOS
          // ========================================================

          const unicos = [];
          const vistos = new Set();

          for (const candidato of candidatos) {

            if (vistos.has(candidato.link)) {
              continue;
            }

            vistos.add(candidato.link);
            unicos.push(candidato);
          }


          // ========================================================
          // CREAR NOTICIAS
          // ========================================================

          const noticias = [];

          for (const candidato of unicos) {

            if (noticias.length >= 6) {
              break;
            }

            let imagen =
              imagenesPorUrl.get(
                candidato.link
              ) || "";

            if (!imagen) {
              imagen =
                extraerImagen(
                  candidato.bloque
                );
            }

            noticias.push({
              titulo: candidato.titulo,
              link: candidato.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }


          // ========================================================
          // VALIDAR
          // ========================================================

          if (noticias.length === 0) {

            console.error(
              "No se encontraron artículos de tecnología."
            );

            console.error(
              "Tamaño de página:",
              html.length
            );

            console.error(
              "Enlaces encontrados:",
              enlaces.length
            );

            throw new Error(
              "No se encontraron artículos de tecnología."
            );
          }


          // ========================================================
          // GUARDAR JSON
          // ========================================================

          const resultado = {
            noticias
          };

          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log(
            "noticias-710.json generado correctamente."
          );

          console.log(
            "Noticias:",
            noticias.length
          );

          console.log(
            "Noticias con imagen:",
            noticias.filter(
              n => n.imagen
            ).length
          );

          console.log(
            JSON.stringify(
              resultado,
              null,
              2
            )
          );
          NODE


      # ============================================================
      # 4. VALIDAR JSON
      # ============================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo = "noticias-710.json";

          if (!fs.existsSync(archivo)) {
            throw new Error(
              "No existe noticias-710.json"
            );
          }

          const data =
            JSON.parse(
              fs.readFileSync(
                archivo,
                "utf8"
              )
            );

          if (
            !data ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-710.json es inválido o está vacío"
            );
          }

          for (const noticia of data.noticias) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {
              throw new Error(
                "Hay una noticia sin título o enlace"
              );
            }
          }

          console.log("JSON válido.");
          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "Con imagen:",
            data.noticias.filter(
              n => n.imagen
            ).length
          );
          NODE


      # ============================================================
      # 5. GUARDAR EL JSON EN GITHUB
      # ============================================================

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
