name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # ==========================================================
      # 2. DESCARGAR LA SECCIÓN TECNOLOGÍA
      # ==========================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

      # ==========================================================
      # 3. GENERAR noticias-710.json
      # ==========================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          (async function () {

            const html = fs.readFileSync("pagina.html", "utf8");

            function limpiar(texto) {
              return String(texto || "")
                .replace(/<[^>]*>/g, " ")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'")
                .replace(/&apos;/g, "'")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/&#x27;/gi, "'")
                .replace(/&#x2F;/gi, "/")
                .replace(/\s+/g, " ")
                .trim();
            }

            function normalizarUrl(url) {
              if (!url) return "";

              url = url.trim();

              if (url.startsWith("//")) {
                return "https:" + url;
              }

              if (url.startsWith("/")) {
                return "https://www.eldiario.es" + url;
              }

              return url;
            }

            function extraerImagen(texto) {

              let m = texto.match(
                /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i
              );

              if (m) {
                return normalizarUrl(m[1]);
              }

              m = texto.match(
                /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i
              );

              if (m) {
                return normalizarUrl(m[1]);
              }

              m = texto.match(
                /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i
              );

              if (m) {
                return normalizarUrl(m[1]);
              }

              m = texto.match(
                /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i
              );

              if (m) {
                return normalizarUrl(m[1]);
              }

              return "";
            }

            function extraerTitulo(bloque) {

              let m = bloque.match(
                /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i
              );

              if (m) {
                const titulo = limpiar(m[1]);

                if (titulo.length >= 20) {
                  return titulo;
                }
              }

              m = bloque.match(
                /<span[^>]*>([\s\S]*?)<\/span>/i
              );

              if (m) {
                const titulo = limpiar(m[1]);

                if (titulo.length >= 20) {
                  return titulo;
                }
              }

              m = bloque.match(
                /<a\b[^>]*>([\s\S]*?)<\/a>/i
              );

              if (m) {
                return limpiar(m[1]);
              }

              return "";
            }

            // ======================================================
            // BUSCAR ENLACES DE ARTÍCULOS
            // ======================================================

            const encontrados = [];
            const vistos = new Set();

            const patron =
              /<a\b[^>]*href=["']([^"']*\/tecnologia\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;

            let match;

            while (
              (match = patron.exec(html)) !== null &&
              encontrados.length < 6
            ) {

              let link = normalizarUrl(match[1]);

              if (
                !link.startsWith(
                  "https://www.eldiario.es/tecnologia/"
                )
              ) {
                continue;
              }

              if (
                link === "https://www.eldiario.es/tecnologia/"
              ) {
                continue;
              }

              if (link.includes("#")) {
                continue;
              }

              if (vistos.has(link)) {
                continue;
              }

              const bloque = match[2];

              const titulo = extraerTitulo(bloque);

              if (!titulo || titulo.length < 20) {
                continue;
              }

              vistos.add(link);

              encontrados.push({
                titulo: titulo,
                link: link
              });
            }

            if (encontrados.length === 0) {
              throw new Error(
                "No se encontraron artículos de tecnología."
              );
            }

            console.log(
              "Artículos encontrados:",
              encontrados.length
            );

            // ======================================================
            // ENTRAR EN CADA ARTÍCULO
            // ======================================================

            const noticias = [];

            for (const noticia of encontrados) {

              let imagen = "";

              try {

                console.log(
                  "Obteniendo imagen para:",
                  noticia.titulo
                );

                const respuesta = await fetch(
                  noticia.link,
                  {
                    headers: {
                      "User-Agent":
                        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
                      "Accept":
                        "text/html,application/xhtml+xml"
                    }
                  }
                );

                if (respuesta.ok) {

                  const articulo =
                    await respuesta.text();

                  imagen =
                    extraerImagen(articulo);

                } else {

                  console.log(
                    "HTTP",
                    respuesta.status,
                    "para",
                    noticia.link
                  );
                }

              } catch (error) {

                console.log(
                  "Error obteniendo artículo:",
                  error.message
                );
              }

              noticias.push({
                titulo: noticia.titulo,
                link: noticia.link,
                imagen: imagen,
                tipo: imagen ? "imagen" : ""
              });

              console.log(
                "Imagen:",
                imagen || "NO ENCONTRADA"
              );
            }

            // ======================================================
            // CREAR JSON
            // ======================================================

            const resultado = {
              noticias: noticias
            };

            fs.writeFileSync(
              "noticias-710.json",
              JSON.stringify(
                resultado,
                null,
                2
              ),
              "utf8"
            );

            console.log("");
            console.log(
              "=========================================="
            );
            console.log(
              "noticias-710.json generado correctamente"
            );
            console.log(
              "Noticias:",
              noticias.length
            );
            console.log(
              "=========================================="
            );

            console.log(
              JSON.stringify(
                resultado,
                null,
                2
              )
            );

          })().catch(function (error) {

            console.error(
              "ERROR:",
              error
            );

            process.exit(1);

          });

          NODE

      # ==========================================================
      # 4. VALIDAR EL JSON
      # ==========================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo = "noticias-710.json";

          if (!fs.existsSync(archivo)) {
            throw new Error(
              "No existe noticias-710.json"
            );
          }

          const data = JSON.parse(
            fs.readFileSync(
              archivo,
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias)
          ) {
            throw new Error(
              "El JSON no contiene el array noticias."
            );
          }

          if (data.noticias.length === 0) {
            throw new Error(
              "El JSON está vacío."
            );
          }

          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {
              throw new Error(
                "Hay una noticia sin título o enlace."
              );
            }

          }

          console.log(
            "=========================================="
          );

          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "=========================================="
          );

          NODE

      # ==========================================================
      # 5. GUARDAR EL JSON EN GITHUB
      # ==========================================================

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
