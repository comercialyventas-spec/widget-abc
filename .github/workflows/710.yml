name: Actualizar Noticias eldiario Tecnologia

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON
        run: |
          node <<'NODE'
          const https = require("https");
          const fs = require("fs");

          const FEED = "https://www.eldiario.es/tecnologia/";
          const ARCHIVO = "noticias-710.json";

          function descargar(url) {
            return new Promise((resolve, reject) => {

              https.get(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0"
                }
              }, res => {

                let data = "";

                res.on("data", chunk => data += chunk);

                res.on("end", () => {

                  if (res.statusCode >= 400) {
                    reject(new Error("HTTP " + res.statusCode));
                    return;
                  }

                  resolve(data);
                });

              }).on("error", reject);
            });
          }

          function limpiar(texto) {

            return String(texto || "")
              .replace(/<!\[CDATA\[/g, "")
              .replace(/\]\]>/g, "")
              .replace(/<[^>]*>/g, "")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .trim();
          }

          function extraer(tag, texto) {

            const re = new RegExp(
              "<" + tag + "[^>]*>([\\\\s\\\\S]*?)</" + tag + ">",
              "i"
            );

            const m = texto.match(re);

            return m ? m[1].trim() : "";
          }

          function extraerAtributo(tag, atributo, texto) {

            const re = new RegExp(
              "<" + tag + "[^>]*" +
              atributo +
              '=["\\']([^"\\']+)["\\']',
              "i"
            );

            const m = texto.match(re);

            return m ? m[1].trim() : "";
          }

          function extraerMedia(contenido, item) {

            /*
             * 1. Vídeo
             */

            let video =
              contenido.match(
                /(?:src|href)=["'](https?:\/\/[^"']+\.(?:mp4|webm|ogg)(?:\?[^"']*)?)["']/i
              );

            if (video) {
              return {
                url: video[1],
                tipo: "video"
              };
            }

            /*
             * 2. Imagen dentro del contenido
             */

            let imagen =
              contenido.match(
                /(?:src|href)=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp)(?:\?[^"']*)?)["']/i
              );

            if (imagen) {
              return {
                url: imagen[1],
                tipo: "imagen"
              };
            }

            /*
             * 3. media:content
             */

            let media =
              item.match(
                /<media:content[^>]+url=["']([^"']+)["'][^>]*>/i
              );

            if (media) {

              const url = media[1];

              const tipo =
                /\.(mp4|webm|ogg)(\?|$)/i.test(url)
                  ? "video"
                  : "imagen";

              return {
                url: url,
                tipo: tipo
              };
            }

            /*
             * 4. enclosure
             */

            let enclosure =
              item.match(
                /<enclosure[^>]+url=["']([^"']+)["'][^>]*>/i
              );

            if (enclosure) {

              const url = enclosure[1];

              const tipo =
                /\.(mp4|webm|ogg)(\?|$)/i.test(url)
                  ? "video"
                  : "imagen";

              return {
                url: url,
                tipo: tipo
              };
            }

            /*
             * 5. thumbnail de media
             */

            let thumbnail =
              item.match(
                /<media:thumbnail[^>]+url=["']([^"']+)["'][^>]*>/i
              );

            if (thumbnail) {

              return {
                url: thumbnail[1],
                tipo: "imagen"
              };
            }

            return {
              url: "",
              tipo: ""
            };
          }

          async function main() {

            console.log("Descargando eldiario.es...");

            const xml = await descargar(FEED);

            const items =
              xml
                .split(/<item[\s>]/i)
                .slice(1);

            const noticias = [];

            for (const bloque of items) {

              const item = "<item " + bloque;

              let titulo =
                limpiar(extraer("title", item));

              let link =
                limpiar(extraer("link", item));

              /*
               * Si <link> no funciona, probar guid.
               */

              if (!link) {
                link =
                  limpiar(extraer("guid", item));
              }

              const description =
                extraer("description", item);

              const content =
                extraer("content:encoded", item);

              const contenido =
                content ||
                description ||
                "";

              const media =
                extraerMedia(contenido, item);

              if (titulo && link) {

                noticias.push({
                  titulo: titulo,
                  link: link,
                  imagen: media.url,
                  tipo: media.tipo
                });
              }

              if (noticias.length >= 6) {
                break;
              }
            }

            if (!noticias.length) {
              throw new Error(
                "No se encontraron noticias"
              );
            }

            fs.writeFileSync(
              ARCHIVO,
              JSON.stringify(
                {
                  noticias: noticias
                },
                null,
                2
              )
            );

            console.log(
              "JSON generado correctamente:"
            );

            console.log(
              JSON.stringify(
                {
                  noticias: noticias
                },
                null,
                2
              )
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });

          NODE

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias eldiario tecnologia"
          file_pattern: noticias-710.json
