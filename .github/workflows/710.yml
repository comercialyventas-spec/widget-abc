name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # ==========================================================
      # 2. DESCARGAR LA PORTADA DE TECNOLOGÍA
      # ==========================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

      # ==========================================================
      # 3. CREAR noticias-710.json
      # ==========================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&#x27;/gi, "'")
              .replace(/&#x2F;/gi, "/")
              .replace(/\s+/g, " ")
              .trim();
          }

          function normalizarUrl(url) {
            if (!url) return "";

            url = url.trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.eldiario.es" + url;
            }

            return url;
          }

          function extraerAtributo(tag, nombre) {
            const patron = new RegExp(
              nombre + "\\s*=\\s*[\"']([^\"']+)[\"']",
              "i"
            );

            const resultado = tag.match(patron);

            return resultado ? resultado[1] : "";
          }

          function extraerTitulo(bloque) {
            let resultado = bloque.match(
              /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i
            );

            if (resultado) {
              const titulo = limpiar(resultado[1]);

              if (titulo.length >= 20) {
                return titulo;
              }
            }

            resultado = bloque.match(
              /<a\b[^>]*>([\s\S]*?)<\/a>/i
            );

            if (resultado) {
              return limpiar(resultado[1]);
            }

            return "";
          }

          function buscarImagenEnPagina(texto) {

            let resultado = texto.match(
              /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
            );

            if (resultado) {
              return normalizarUrl(resultado[1]);
            }

            resultado = texto.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["'][^>]*>/i
            );

            if (resultado) {
              return normalizarUrl(resultado[1]);
            }

            resultado = texto.match(
              /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
            );

            if (resultado) {
              return normalizarUrl(resultado[1]);
            }

            resultado = texto.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["'][^>]*>/i
            );

            if (resultado) {
              return normalizarUrl(resultado[1]);
            }

            return "";
          }

          // ======================================================
          // OBTENER ENLACES DE NOTICIAS
          // ======================================================

          const enlaces = [];
          const vistos = new Set();

          const patronEnlace =
            /<a\b[^>]*href=["']([^"']*\/tecnologia\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let coincidencia;

          while (
            (coincidencia = patronEnlace.exec(html)) !== null
          ) {

            let link = normalizarUrl(coincidencia[1]);

            if (
              !link.startsWith(
                "https://www.eldiario.es/tecnologia/"
              )
            ) {
              continue;
            }

            // Evitar enlaces que no son artículos
            if (
              link === "https://www.eldiario.es/tecnologia/" ||
              link.includes("#")
            ) {
              continue;
            }

            const bloque = coincidencia[0];

            const titulo = extraerTitulo(bloque);

            if (!titulo || titulo.length < 20) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            vistos.add(link);

            enlaces.push({
              titulo: titulo,
              link: link
            });

            if (enlaces.length >= 6) {
              break;
            }
          }

          if (enlaces.length === 0) {
            throw new Error(
              "No se encontraron noticias de tecnología"
            );
          }

          console.log(
            "Noticias encontradas:",
            enlaces.length
          );

          // ======================================================
          // ENTRAR EN CADA NOTICIA PARA OBTENER SU IMAGEN REAL
          // ======================================================

          async function obtenerImagen(noticia) {

            try {

              console.log(
                "Buscando imagen:",
                noticia.titulo
              );

              const respuesta = await fetch(
                noticia.link,
                {
                  headers: {
                    "User-Agent":
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
                    "Accept":
                      "text/html,application/xhtml+xml"
                  }
                }
              );

              if (!respuesta.ok) {
                console.log(
                  "No se pudo descargar:",
                  respuesta.status
                );

                return "";
              }

              const pagina =
                await respuesta.text();

              return buscarImagenEnPagina(pagina);

            } catch (error) {

              console.log(
                "Error obteniendo imagen:",
                error.message
              );

              return "";
            }
          }

          // ======================================================
          // PROCESAR UNA A UNA
          // ======================================================

          const noticias = [];

          for (const noticia of enlaces) {

            const imagen =
              await obtenerImagen(noticia);

            noticias.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          // ======================================================
          // GUARDAR JSON
          // ======================================================

          const resultado = {
            noticias: noticias
          };

          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log(
            "----------------------------------------"
          );

          console.log(
            "noticias-710.json generado correctamente"
          );

          console.log(
            "Número de noticias:",
            noticias.length
          );

          console.log(
            JSON.stringify(
              resultado,
              null,
              2
            )
          );

          NODE

      # ==========================================================
      # 4. VALIDAR JSON
      # ==========================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo = "noticias-710.json";

          if (!fs.existsSync(archivo)) {
            throw new Error(
              "No existe noticias-710.json"
            );
          }

          const data = JSON.parse(
            fs.readFileSync(
              archivo,
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias)
          ) {
            throw new Error(
              "El JSON no contiene el array noticias"
            );
          }

          if (data.noticias.length === 0) {
            throw new Error(
              "El JSON está vacío"
            );
          }

          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {
              throw new Error(
                "Hay una noticia sin título o enlace"
              );
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );
          NODE

      # ==========================================================
      # 5. GUARDAR EN GITHUB
      # ==========================================================

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
