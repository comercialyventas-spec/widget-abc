name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==================================================
      # 2. DESCARGAR ELDIARIO.ES TECNOLOGÍA
      # ==================================================

      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            -A "Mozilla/5.0" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html


      # ==================================================
      # 3. GENERAR noticias-710.json
      # ==================================================

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");


          // ==================================================
          // LIMPIAR TEXTO
          // ==================================================

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&#x27;/gi, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&#x2F;/gi, "/")
              .replace(/\s+/g, " ")
              .trim();
          }


          // ==================================================
          // LIMPIAR URL
          // ==================================================

          function limpiarUrl(url) {

            if (!url) {
              return "";
            }

            url = url.trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.eldiario.es" + url;
            }

            return url;
          }


          // ==================================================
          // EXTRAER URL DE IMAGEN
          // ==================================================

          function extraerImagen(bloque) {

            const patrones = [

              /<img[^>]+src=["']([^"']+)["']/i,

              /<img[^>]+data-src=["']([^"']+)["']/i,

              /<img[^>]+data-lazy-src=["']([^"']+)["']/i,

              /<img[^>]+data-original=["']([^"']+)["']/i,

              /<source[^>]+src=["']([^"']+)["']/i,

              /<source[^>]+srcset=["']([^"']+)["']/i,

              /<img[^>]+srcset=["']([^"']+)["']/i

            ];


            for (const patron of patrones) {

              const m = bloque.match(patron);

              if (m && m[1]) {

                let url = m[1].trim();

                // Si es srcset, quedarse con la primera URL
                if (url.includes(",")) {
                  url = url.split(",")[0].trim();
                }

                // Quitar descriptor de tamaño
                url = url.replace(/\s+\d+w$/i, "").trim();

                url = limpiarUrl(url);

                if (
                  url.startsWith("http://") ||
                  url.startsWith("https://")
                ) {
                  return url;
                }
              }
            }


            return "";
          }


          // ==================================================
          // EXTRAER VÍDEO
          // ==================================================

          function extraerVideo(bloque) {

            const patrones = [

              /<video[^>]+src=["']([^"']+)["']/i,

              /<source[^>]+src=["']([^"']+\.mp4[^"']*)["']/i,

              /<source[^>]+src=["']([^"']+\.webm[^"']*)["']/i

            ];


            for (const patron of patrones) {

              const m = bloque.match(patron);

              if (m && m[1]) {

                const url = limpiarUrl(m[1]);

                if (
                  url.startsWith("http://") ||
                  url.startsWith("https://")
                ) {
                  return url;
                }
              }
            }


            return "";
          }


          // ==================================================
          // BUSCAR MULTIMEDIA CERCA DEL ENLACE
          // ==================================================

          function buscarMultimedia(html, posicion) {

            // Buscamos alrededor del enlace.
            // Esto permite encontrar imágenes que estén
            // fuera del propio <a>.

            const radio = 5000;

            const inicio =
              Math.max(0, posicion - radio);

            const fin =
              Math.min(
                html.length,
                posicion + radio
              );

            const bloque =
              html.substring(inicio, fin);


            const video =
              extraerVideo(bloque);

            if (video) {
              return {
                url: video,
                tipo: "video"
              };
            }


            const imagen =
              extraerImagen(bloque);

            if (imagen) {
              return {
                url: imagen,
                tipo: "imagen"
              };
            }


            return {
              url: "",
              tipo: ""
            };
          }


          // ==================================================
          // EXTRAER ENLACES DE TECNOLOGÍA
          // ==================================================

          const noticias = [];

          const vistos = new Set();


          const patron =
            /<a\b[^>]*href=["']([^"']*\/tecnologia\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;


          let match;


          while ((match = patron.exec(html)) !== null) {

            if (noticias.length >= 6) {
              break;
            }


            let link =
              limpiarUrl(match[1]);


            if (
              !link.startsWith(
                "https://www.eldiario.es/tecnologia/"
              )
            ) {
              continue;
            }


            if (vistos.has(link)) {
              continue;
            }


            const contenido =
              match[2];


            // ==================================================
            // TÍTULO
            // ==================================================

            const titulo =
              limpiar(
                contenido
                  .replace(
                    /<svg[\s\S]*?<\/svg>/gi,
                    ""
                  )
                  .replace(
                    /<img[\s\S]*?>/gi,
                    ""
                  )
                  .replace(
                    /<picture[\s\S]*?<\/picture>/gi,
                    ""
                  )
                  .replace(
                    /<source[\s\S]*?>/gi,
                    ""
                  )
              );


            if (
              !titulo ||
              titulo.length < 20
            ) {
              continue;
            }


            // ==================================================
            // BUSCAR MULTIMEDIA
            // ==================================================

            const multimedia =
              buscarMultimedia(
                html,
                match.index
              );


            vistos.add(link);


            noticias.push({

              titulo: titulo,

              link: link,

              imagen: multimedia.url,

              tipo: multimedia.tipo

            });


            console.log(
              "Noticia:",
              titulo
            );

            console.log(
              "Imagen:",
              multimedia.url || "(ninguna)"
            );

            console.log(
              "Tipo:",
              multimedia.tipo || "(ninguno)"
            );
          }


          // ==================================================
          // COMPROBAR NOTICIAS
          // ==================================================

          if (noticias.length === 0) {

            throw new Error(
              "No se encontraron noticias de tecnología"
            );

          }


          // ==================================================
          // CREAR JSON
          // ==================================================

          const resultado = {
            noticias: noticias
          };


          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );


          console.log("");
          console.log(
            "=========================================="
          );
          console.log(
            "noticias-710.json generado correctamente"
          );
          console.log(
            "Noticias:",
            noticias.length
          );
          console.log(
            "=========================================="
          );

          NODE


      # ==================================================
      # 4. VALIDAR JSON
      # ==================================================

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-710.json",
                "utf8"
              )
            );


          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {

            throw new Error(
              "noticias-710.json está vacío o es inválido"
            );

          }


          for (
            const noticia
            of data.noticias
          ) {

            if (
              !noticia.titulo ||
              !noticia.link
            ) {

              throw new Error(
                "Hay una noticia sin título o enlace"
              );

            }

          }


          console.log(
            "JSON válido."
          );


          console.log(
            "Número de noticias:",
            data.noticias.length
          );


          console.log(
            "Multimedia encontrada:"
          );


          for (
            const noticia
            of data.noticias
          ) {

            console.log(
              "-",
              noticia.titulo
            );

            console.log(
              "  tipo:",
              noticia.tipo || "(ninguno)"
            );

            console.log(
              "  imagen:",
              noticia.imagen || "(ninguna)"
            );

          }

          NODE


      # ==================================================
      # 5. GUARDAR JSON EN GITHUB
      # ==================================================

      - name: Guardar noticias-710.json
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add noticias-710.json


          if git diff --cached --quiet; then

            echo "No hay cambios nuevos."

          else

            git commit \
              -m "Actualizar noticias-710"

            git push

          fi
