name: Actualizar noticias-710

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar página de tecnología
        run: |
          curl -L --fail \
            -A "Mozilla/5.0" \
            "https://www.eldiario.es/tecnologia/" \
            -o pagina.html

      - name: Generar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          function extraerImagen(bloque) {
            let m = bloque.match(
              /<img[^>]+src=["']([^"']+)["']/i
            );

            if (m) return m[1];

            m = bloque.match(
              /<img[^>]+data-src=["']([^"']+)["']/i
            );

            if (m) return m[1];

            m = bloque.match(
              /<source[^>]+src=["']([^"']+)["']/i
            );

            if (m) return m[1];

            return "";
          }

          const noticias = [];
          const vistos = new Set();

          const enlaces = html.match(
            /<a\b[^>]*href=["'][^"']*\/tecnologia\/[^"']*["'][^>]*>[\s\S]*?<\/a>/gi
          ) || [];

          for (const bloque of enlaces) {

            if (noticias.length >= 6) break;

            const hrefMatch = bloque.match(
              /href=["']([^"']+)["']/i
            );

            if (!hrefMatch) continue;

            let link = hrefMatch[1];

            if (link.startsWith("/")) {
              link = "https://www.eldiario.es" + link;
            }

            if (!link.startsWith("https://www.eldiario.es/tecnologia/")) {
              continue;
            }

            const titulo = limpiar(
              bloque
                .replace(/<img[^>]*>/gi, "")
                .replace(/<svg[\s\S]*?<\/svg>/gi, "")
            );

            if (!titulo || titulo.length < 20) continue;

            if (vistos.has(link)) continue;

            vistos.add(link);

            const imagen = extraerImagen(bloque);

            noticias.push({
              titulo: titulo,
              link: link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron noticias de tecnología"
            );
          }

          const resultado = {
            noticias: noticias
          };

          fs.writeFileSync(
            "noticias-710.json",
            JSON.stringify(resultado, null, 2),
            "utf8"
          );

          console.log(
            "Generado noticias-710.json con",
            noticias.length,
            "noticias"
          );
          NODE

      - name: Validar noticias-710.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("noticias-710.json", "utf8")
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error("noticias-710.json está vacío o es inválido");
          }

          for (const noticia of data.noticias) {
            if (!noticia.titulo || !noticia.link) {
              throw new Error("Hay una noticia sin título o enlace");
            }
          }

          console.log("JSON válido.");
          console.log(
            JSON.stringify(data, null, 2)
          );
          NODE

      - name: Guardar noticias-710.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-710.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-710"
            git push
          fi
