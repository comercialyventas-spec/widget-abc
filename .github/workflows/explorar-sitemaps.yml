name: Explorar sitemaps de tiendas (solo lectura)

# Se lanza cuando Claude sube migracion/explorar_tiendas.txt. Deja el informe en migracion/explorar_informe.txt
on:
  push:
    branches: [main]
    paths: ['migracion/explorar_tiendas.txt']

permissions:
  contents: write

# Grupo propio: en el grupo compartido widget-abc-git-write solo cabía 1 run en marcha + 1 en espera para todos los
# workflows, y GitHub cancelaba los que esperaban. El choque de pushes lo resuelven el paso de sincronizar y los reintentos.
concurrency:
  group: explorar-sitemaps
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Explorar
        run: python3 migracion/explorar_sitemaps.py migracion/explorar_tiendas.txt > migracion/explorar_informe.txt 2>&1 || true
      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      - name: Guardar informe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/explorar_informe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Informe de exploración de sitemaps"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          for intento in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          echo "::error title=No se pudo guardar explorar-sitemaps::El push a GitHub fallo 5 veces seguidas."
          exit 1
