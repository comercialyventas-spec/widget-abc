name: Copiar gadgets (copia de seguridad)

# Se lanza cuando Claude sube migracion/copiar_gadgets_orden.txt. Lee la portada del blog
# y guarda el contenido de los gadgets indicados en migracion/gadgets_backup/ (no pisa copias).
on:
  push:
    branches: [main]
    paths: ['migracion/copiar_gadgets_orden.txt']
  workflow_dispatch:

permissions:
  contents: write

# Grupo propio: en el grupo compartido widget-abc-git-write solo cabía 1 run en marcha + 1 en espera para todos los
# workflows, y GitHub cancelaba los que esperaban. El choque de pushes lo resuelven el paso de sincronizar y los reintentos.
concurrency:
  group: copiar-gadgets
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copiar
        run: node migracion/copiar_gadgets.js migracion/copiar_gadgets_orden.txt
      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migracion/gadgets_backup
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Copia de seguridad de gadgets"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          for intento in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          echo "::error title=No se pudo guardar copiar-gadgets::El push a GitHub fallo 5 veces seguidas."
          exit 1
