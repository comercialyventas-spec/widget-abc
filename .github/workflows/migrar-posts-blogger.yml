name: Migrar posts Blogger

# Solo se lanza a mano. Modo "simular" no cambia nada.
on:
  workflow_dispatch:
    inputs:
      lista:
        description: 'Lista de posts'
        default: 'migracion/grupoA.json'
        required: true
      modo:
        description: 'simular (no cambia nada) / aplicar / restaurar'
        type: choice
        options: [simular, aplicar, restaurar]
        default: simular

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrar
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: node migracion/migrar_posts.js "${{ inputs.lista }}" "${{ inputs.modo }}"

      - name: Guardar copias de seguridad en el repositorio
        if: always() && inputs.modo == 'aplicar'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/backups || true
          if git diff --cached --quiet; then echo "Sin copias nuevas"; exit 0; fi
          git commit -m "Copias de seguridad de posts antes de migrar"
          # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
          ok=0
          for intento in 1 2 3 4; do
            if git push; then ok=1; break; fi
            echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            sleep $((intento * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=No se pudo guardar copias de seguridad::El push a GitHub fallo 4 veces seguidas."
            exit 1
          fi
