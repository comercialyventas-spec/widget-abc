name: Migrar posts Blogger (por orden)

# Se lanza solo cuando cambia migracion/orden.json (lo sube Claude con el permiso de Dani).
# orden.json: {"lista": "migracion/xxx.json", "modo": "simular" | "aplicar" | "restaurar"}
# El resultado sale como avisos (notice) del run; las copias van a migracion/backups
on:
  push:
    branches: [main]
    paths: ['migracion/orden.json']

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrar
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          LISTA=$(node -e "console.log(require('./migracion/orden.json').lista)")
          MODO=$(node -e "console.log(require('./migracion/orden.json').modo)")
          echo "Lista: $LISTA  Modo: $MODO"
          set +e
          node migracion/migrar_posts.js "$LISTA" "$MODO" 2>&1 | tee /tmp/ultimo_resultado.txt
          echo "FIN $(date -u +%Y-%m-%dT%H:%M:%SZ) lista=$LISTA modo=$MODO" >> /tmp/ultimo_resultado.txt
          # Resumen visible como avisos del run (se leen sin iniciar sesión)
          grep -E "MODO|SE CAMBIAR|YA ESTABA|SALTADO|ERROR|CAMBIADO|RESTAURADO|SIN COPIA|con error|FIN" /tmp/ultimo_resultado.txt | while IFS= read -r l; do echo "::notice::$l"; done
          exit 0

      - name: Guardar resultado y copias de seguridad
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/backups || true
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git commit -m "Resultado de migración por orden" 2>&1 | while IFS= read -r l; do echo "::notice::commit: $l"; done
          for i in 1 2 3 4 5; do
            git fetch origin main 2>&1 | sed 's/^/::notice::fetch: /'
            git rebase origin/main 2>&1 | sed 's/^/::notice::rebase: /'
            if git push origin HEAD:main > push.log 2>&1; then exit 0; fi
            sed 's/^/::warning::push: /' push.log
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
