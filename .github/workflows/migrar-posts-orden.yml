name: Migrar posts Blogger (por orden)

# Se lanza solo cuando cambia migracion/orden.json (lo sube Claude con el permiso de Dani).
# orden.json: {"lista": "migracion/xxx.json", "modo": "simular" | "aplicar" | "restaurar"}
# El resultado queda en migracion/ultimo_resultado.txt
on:
  push:
    branches: [main]
    paths: ['migracion/orden.json']

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrar
        env:
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          LISTA=$(node -e "console.log(require('./migracion/orden.json').lista)")
          MODO=$(node -e "console.log(require('./migracion/orden.json').modo)")
          echo "Lista: $LISTA  Modo: $MODO"
          set +e
          node migracion/migrar_posts.js "$LISTA" "$MODO" 2>&1 | tee migracion/ultimo_resultado.txt
          echo "FIN $(date -u +%Y-%m-%dT%H:%M:%SZ) lista=$LISTA modo=$MODO" >> migracion/ultimo_resultado.txt
          exit 0

      - name: Guardar resultado y copias de seguridad
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/backups migracion/ultimo_resultado.txt || true
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git commit -m "Resultado de migración por orden"
          for i in 1 2 3 4 5; do
            git pull --no-edit origin main && git push && exit 0
            sleep 10
          done
          exit 1
