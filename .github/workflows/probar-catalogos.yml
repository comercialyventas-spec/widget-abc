name: Probar catalogos de productos (solo lectura)

# Solo se lanza a mano. Para cada URL de la lista prueba el mismo generador PHP
# que usan el NAS y productos-generico.yml, y dice cuántos productos saca.
# No toca Blogger ni la carpeta productos/: guarda solo el informe.
on:
  workflow_dispatch:
    inputs:
      lista:
        description: 'Archivo con una URL por línea'
        default: 'migracion/catalogos_prueba.txt'
        required: true
  # También se lanza sola cuando Claude sube migracion/catalogos_prueba_orden.txt
  push:
    branches: [main]
    paths: ['migracion/catalogos_prueba_orden.txt']

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probar cada catalogo
        run: |
          MOTOR=/tmp/motor
          mkdir -p "$MOTOR/cache_productos"
          cp productos/generar_o_servir.php "$MOTOR/"
          INFORME=migracion/informe_catalogos.tsv
          printf "url\tpaginas\tproductos_p1\tcon_foto\tcon_precio\tidioma_distinto\tprimer_titulo\tnas_productos\tnas_con_foto\n" > "$INFORME"
          while IFS= read -r url; do
            case "$url" in http://*|https://*) ;; *) continue ;; esac
            slug=$(php -r 'echo substr(md5(trim($argv[1])), 0, 16);' -- "$url")
            rm -f "$MOTOR"/cache_productos/producto-"$slug"-p*.json
            timeout 90 php -d display_errors=0 -r '$_GET = ["url" => $argv[1], "pagina" => "1", "refrescar" => "1"]; include "/tmp/motor/generar_o_servir.php";' -- "$url" > /dev/null 2>&1 || true
            n=$(find "$MOTOR/cache_productos" -maxdepth 1 -name "producto-$slug-p*.json" | wc -l)
            f="$MOTOR/cache_productos/producto-$slug-p1.json"
            if [ -f "$f" ]; then
              linea=$(php -r '$d=json_decode(file_get_contents($argv[1]),true); $p=$d["productos"]??[]; $fo=0;$pr=0; foreach($p as $x){ if(!empty($x["imagen"]))$fo++; if(!empty($x["precio"]))$pr++; } $t=isset($p[0]["titulo"])?str_replace(["\t","\n"]," ",$p[0]["titulo"]):""; echo count($p)."\t".$fo."\t".$pr."\t".(!empty($d["idioma_distinto"])?"si":"")."\t".mb_substr($t,0,60);' -- "$f")
            else
              linea="0\t0\t0\t\t"
            fi
            # Lo mismo pidiéndoselo al NAS (su caché normal, sin forzar refresco), con pausa para no cargarlo
            nas=$(curl -s -m 60 "https://carmenprofe.synology.me/generador_htmlrobots/generar_o_servir.php?url=$(php -r 'echo rawurlencode($argv[1]);' -- "$url")&pagina=1" | php -r '$d=json_decode(stream_get_contents(STDIN),true); $p=is_array($d)?($d["productos"]??[]):[]; $fo=0; foreach($p as $x){ if(!empty($x["imagen"]))$fo++; } echo count($p)."\t".$fo;' 2>/dev/null || printf "0\t0")
            printf "%s\t%s\t%b\t%b\n" "$url" "$n" "$linea" "$nas" | tee -a "$INFORME"
            sleep 15
          done < "${{ inputs.lista || 'migracion/catalogos_prueba_orden.txt' }}"
      - name: Guardar informe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add migracion/informe_catalogos.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Informe de prueba de catalogos"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
