name: Actualizar noticias-1022
on:
  workflow_dispatch:
  schedule:
    - cron: "9,39 * * * *"
concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Descargar y convertir RSS a JSON con imagenes
        run: |
          node -e '
          const https = require("https");
          const fs = "fs";
          https.get("https://www.abc.es/rss/2.0/portada/", (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                  const items = data.split("<item>").slice(1);
                  let noticias = [];
                  items.forEach(item => {
                      let titleMatch = item.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>|<title>(.*?)<\/title>/);
                      let linkMatch = item.match(/<link>(.*?)<\/link>/);
                      
                      let title = titleMatch ? (titleMatch[1] || titleMatch[2]) : "";
                      let link = linkMatch ? linkMatch[1].trim() : "";
                      // Buscar imagen en media:content o enclosure
                      let imgMatch = item.match(/<media:content[^>]+url="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i) ||
                                     item.match(/<enclosure[^>]+url="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i) ||
                                     item.match(/src="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i);
                      
                      let imagen = imgMatch ? imgMatch[1] : "";
                      if (title && link) {
                          noticias.push({
                              titulo: title.replace(/<[^>]*>/g, "").trim(),
                              link: link,
                              imagen: imagen
                          });
                      }
                  });
                  require("fs").writeFileSync("noticias-1022.json", JSON.stringify({ noticias: noticias.slice(0, 6) }, null, 2));
                  console.log("JSON actualizado con imágenes.");
              });
          }).on("error", (err) => {
              console.error(err);
              process.exit(1);
          });
          '
      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true
      - name: Guardar cambios automáticamente
          # forzar reactivación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-1022.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias con imagenes"
            # Igual que feeds-generico.yml: si otro workflow ha escrito antes, traer sus cambios y reintentar
            ok=0
            for intento in 1 2 3 4; do
              if git push; then ok=1; break; fi
              echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
              git pull --rebase -X theirs origin main || { git rebase --abort || true; }
              sleep $((intento * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "::error title=No se pudo guardar noticias-1022::El push a GitHub fallo 4 veces seguidas."
              exit 1
            fi
          fi
