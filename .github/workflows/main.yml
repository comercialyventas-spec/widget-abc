name: Actualizar Noticias ABC

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y convertir RSS a JSON
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          https.get("https://www.abc.es/rss/2.0/portada/", (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                  const items = data.split("<item>").slice(1);
                  let noticias = [];

                  items.forEach(item => {
                      let titleMatch = item.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>|<title>(.*?)<\/title>/);
                      let linkMatch = item.match(/<link>(.*?)<\/link>/);
                      let descMatch = item.match(/<description><!\[CDATA\[(.*?)\]\]><\/description>|<description>(.*?)<\/description>/);
                      
                      let title = titleMatch ? (titleMatch[1] || titleMatch[2]) : "";
                      let link = linkMatch ? linkMatch[1].trim() : "";
                      let desc = descMatch ? (descMatch[1] || descMatch[2]) : "";

                      let imgMatch = desc.match(/src="(https?:\/\/[^"]+\.(jpg|jpeg|png|webp))[^"]*"/i);
                      let imagen = imgMatch ? imgMatch[1] : "";

                      if (title && link) {
                          noticias.push({
                              titulo: title.replace(/<[^>]*>/g, "").trim(),
                              link: link,
                              imagen: imagen
                          });
                      }
                  });

                  fs.writeFileSync("noticias-1022.json", JSON.stringify({ noticias: noticias.slice(0, 6) }, null, 2));
                  console.log("JSON actualizado correctamente con " + noticias.length + " noticias.");
              });
          }).on("error", (err) => {
              console.error("Error al descargar RSS: " + err.message);
              process.exit(1);
          });
          '

      - name: Guardar cambios automáticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática de noticias ABC"
          file_pattern: noticias-1022.json
