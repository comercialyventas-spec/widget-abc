name: Playwright prueba (solo lectura)

# PRUEBA (28 nov 2026). Se lanza cuando Claude sube migracion/playwright_prueba.txt (una URL por linea).
# Abre cada tienda con un navegador sin pantalla y cuenta los productos que salen tras cargar el JavaScript.
# No escribe en el repositorio ni cambia ningun catalogo. Si no sirve, se borra este archivo y migracion/playwright_prueba.py.
on:
  push:
    branches: [main]
    paths: ['migracion/playwright_prueba.txt']

permissions:
  contents: read

concurrency:
  group: playwright-prueba
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Probar tiendas
        run: python migracion/playwright_prueba.py migracion/playwright_prueba.txt
