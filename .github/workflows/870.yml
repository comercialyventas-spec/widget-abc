name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            url = String(url || "").trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function imagenReal(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (!/\.(jpg|jpeg|png|webp)(\?|$)/i.test(u)) {
              return false;
            }

            if (u.includes("pixel.gif")) return false;
            if (u.includes("contabilizacionaccesos")) return false;
            if (u.includes("tracking")) return false;
            if (u.includes("tracker")) return false;
            if (u.includes("spacer")) return false;
            if (u.includes("transparent")) return false;

            if (u.includes("/iconos/")) return false;
            if (u.includes("/icon/")) return false;
            if (u.includes("/avatars/")) return false;
            if (u.includes("/social/img/")) return false;
            if (u.includes("elmundo.png")) return false;
            if (u.includes("logo")) return false;
            if (u.includes("favicon")) return false;
            if (u.includes("sprite")) return false;

            return true;
          }

          function buscarImagen(pagina) {

            /*
             * PRIMERA OPCIÓN Y PREFERIDA:
             * imágenes propias de los artículos antiguos.
             */
            const antiguas = pagina.match(
              /https?:\/\/[^"'<>\\s]+\/imagenes_posts\/[^"'<>\\s]+\.(?:jpg|jpeg|png|webp)/gi
            ) || [];

            for (const url of antiguas) {
              const limpia = absoluto(url);

              if (imagenReal(limpia)) {
                return limpia;
              }
            }

            /*
             * SEGUNDA OPCIÓN:
             * og:image, pero solamente si es una imagen real.
             */
            let m = pagina.match(
              /property=["']og:image["'][^>]*content=["']([^"']+)["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenReal(url)) {
                return url;
              }
            }

            m = pagina.match(
              /content=["']([^"']+)["'][^>]*property=["']og:image["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenReal(url)) {
                return url;
              }
            }

            /*
             * TERCERA OPCIÓN:
             * twitter:image.
             */
            m = pagina.match(
              /name=["']twitter:image["'][^>]*content=["']([^"']+)["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenReal(url)) {
                return url;
              }
            }

            m = pagina.match(
              /content=["']([^"']+)["'][^>]*name=["']twitter:image["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenReal(url)) {
                return url;
              }
            }

            /*
             * NO BUSCAMOS CUALQUIER IMG SRC.
             *
             * Esto evita volver a coger:
             * - logos
             * - avatares
             * - iconos
             * - pixels
             */

            return "";
          }

          /*
           * ==========================================
           * EXTRAER LOS ARTÍCULOS
           * ==========================================
           */

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a[^>]+href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while (
            (m = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link = absoluto(m[1]);

            link = link.split("#")[0];

            if (
              !link.includes(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!/\.html$/i.test(link)) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            const titulo = limpiar(m[2]);

            if (!titulo || titulo.length < 15) {
              continue;
            }

            if (
              titulo.toLowerCase() === "comentarios"
            ) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo: titulo,
              link: link
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos."
            );
          }

          /*
           * ==========================================
           * DESCARGAR CADA ARTÍCULO
           * ==========================================
           */

          const resultado = [];

          for (let i = 0; i < noticias.length; i++) {

            const noticia = noticias[i];

            const archivo =
              "articulo-" + i + ".html";

            let articulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              articulo =
                fs.readFileSync(
                  archivo,
                  "utf8"
                );

            } catch (error) {

              console.log(
                "No se pudo descargar:",
                noticia.link
              );

            }

            const imagen =
              buscarImagen(articulo);

            console.log("");
            console.log(
              "NOTICIA:",
              noticia.titulo
            );
            console.log(
              "IMAGEN:",
              imagen || "NINGUNA"
            );

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "noticias-870.json generado correctamente."
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-870.json",
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío."
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() === "comentarios"
            ) {
              throw new Error(
                "Se ha encontrado 'comentarios' como noticia."
              );
            }

            if (
              noticia.imagen &&
              (
                noticia.imagen.includes("pixel.gif") ||
                noticia.imagen.includes("contabilizacionaccesos") ||
                noticia.imagen.includes("/avatars/") ||
                noticia.imagen.includes("/social/img/") ||
                noticia.imagen.includes("/iconos/") ||
                noticia.imagen.includes("elmundo.png")
              )
            ) {
              throw new Error(
                "Imagen incorrecta detectada: " +
                noticia.imagen
              );
            }
          }

          console.log(
            "JSON válido."
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
