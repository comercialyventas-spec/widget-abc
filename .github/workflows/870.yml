name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          function leerHtml(archivo) {
            const buffer = fs.readFileSync(archivo);

            let texto = buffer.toString("utf8");

            if (texto.includes("�")) {
              const latin = buffer.toString("latin1");

              if (!latin.includes("�")) {
                texto = latin;
              }
            }

            return texto;
          }

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<noscript[\s\S]*?<\/noscript>/gi, " ")
              .replace(/<svg[\s\S]*?<\/svg>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            if (!url) return "";

            let u = String(url)
              .replace(/&amp;/gi, "&")
              .replace(/\\u002F/g, "/")
              .replace(/\\\//g, "/")
              .trim();

            u = u.replace(/^["']|["']$/g, "");

            if (u.startsWith("//")) {
              return "https:" + u;
            }

            if (u.startsWith("http://")) {
              return "https://" + u.substring(7);
            }

            if (u.startsWith("https://")) {
              return u;
            }

            if (u.startsWith("/")) {
              return "https://www.elmundo.es" + u;
            }

            return "";
          }

          function esImagenValida(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (!/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)) {
              return false;
            }

            const prohibidas = [
              "pixel.gif",
              "pixel.",
              "contabilizacionaccesos",
              "tracking",
              "tracker",
              "spacer",
              "transparent",
              "favicon",
              "/iconos/",
              "/icon/",
              "/avatars/",
              "/social/",
              "elmundo.png",
              "logo",
              "sprite",
              "default-avatar",
              "comments_default"
            ];

            for (const palabra of prohibidas) {
              if (u.includes(palabra)) {
                return false;
              }
            }

            return true;
          }

          function normalizarImagen(url) {
            const u = absoluto(url);

            if (!u) return "";

            if (!esImagenValida(u)) {
              return "";
            }

            return u;
          }

          /*
           * Busca una imagen de artículo.
           *
           * PRIORIDAD:
           * 1. imagenes_posts
           * 2. imágenes asociadas a metadatos de la página
           * 3. imágenes de contenido del artículo
           *
           * Nunca acepta logos, avatares, pixels, etc.
           */
          function buscarImagen(html) {

            if (!html) return "";

            const candidatos = [];

            function añadir(url, prioridad) {
              const imagen = normalizarImagen(url);

              if (!imagen) return;

              candidatos.push({
                url: imagen,
                prioridad
              });
            }

            /*
             * ==================================================
             * 1. SISTEMA ANTIGUO DE EL MUNDO
             * ==================================================
             */

            let m;

            const patronPosts =
              /(?:https?:)?\/\/[^"'<>\\s]+\/blogs\/elmundo\/clima\/imagenes_posts\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<>\\s]*)?/gi;

            while ((m = patronPosts.exec(html)) !== null) {
              añadir(m[0], 1000);
            }

            const patronPostsRelativo =
              /\/blogs\/elmundo\/clima\/imagenes_posts\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<>\\s]*)?/gi;

            while ((m = patronPostsRelativo.exec(html)) !== null) {
              añadir(m[0], 1000);
            }

            /*
             * ==================================================
             * 2. METADATOS og:image
             * ==================================================
             */

            const og1 =
              /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["'][^>]*>/gi;

            while ((m = og1.exec(html)) !== null) {
              añadir(m[1], 900);
            }

            const og2 =
              /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["'][^>]*>/gi;

            while ((m = og2.exec(html)) !== null) {
              añadir(m[1], 900);
            }

            /*
             * ==================================================
             * 3. twitter:image
             * ==================================================
             */

            const tw1 =
              /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["'][^>]*>/gi;

            while ((m = tw1.exec(html)) !== null) {
              añadir(m[1], 850);
            }

            const tw2 =
              /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["'][^>]*>/gi;

            while ((m = tw2.exec(html)) !== null) {
              añadir(m[1], 850);
            }

            /*
             * ==================================================
             * 4. JSON / DATOS EMBEBIDOS
             *
             * Buscamos URLs de imágenes dentro del HTML.
             * ==================================================
             */

            const urlsGenerales =
              /https?:\\?\/\\?\/[^"'<>\\s\\]+?\.(?:jpg|jpeg|png|webp)(?:\\?[^"'<>\\s\\]*)?/gi;

            while ((m = urlsGenerales.exec(html)) !== null) {
              añadir(m[0], 700);
            }

            /*
             * ==================================================
             * 5. SRC / DATA-SRC / SRCSET
             * ==================================================
             */

            const atributos = [
              /(?:src|data-src|data-original|data-lazy-src)=["']([^"']+)["']/gi,
              /(?:srcset|data-srcset)=["']([^"']+)["']/gi
            ];

            for (const patron of atributos) {

              while ((m = patron.exec(html)) !== null) {

                const valor = m[1];

                /*
                 * srcset puede contener:
                 *
                 * imagen.jpg 540w,
                 * imagen.jpg 635w
                 */
                const partes =
                  valor.split(",").map(x =>
                    x.trim().split(/\s+/)[0]
                  );

                for (const parte of partes) {
                  añadir(parte, 600);
                }
              }
            }

            /*
             * ==================================================
             * ELIMINAR DUPLICADOS
             * ==================================================
             */

            const mapa = new Map();

            for (const candidato of candidatos) {

              const anterior =
                mapa.get(candidato.url);

              if (
                !anterior ||
                candidato.prioridad > anterior.prioridad
              ) {
                mapa.set(
                  candidato.url,
                  candidato
                );
              }
            }

            const lista =
              [...mapa.values()];

            /*
             * ==================================================
             * PUNTUACIÓN FINAL
             *
             * Preferimos imágenes del blog antiguo.
             * ==================================================
             */

            function puntuacion(candidato) {

              const u =
                candidato.url.toLowerCase();

              let puntos =
                candidato.prioridad;

              if (
                u.includes(
                  "/blogs/elmundo/clima/imagenes_posts/"
                )
              ) {
                puntos += 500;
              }

              if (/635x/i.test(u)) {
                puntos += 50;
              }

              if (/640x/i.test(u)) {
                puntos += 50;
              }

              if (/540x/i.test(u)) {
                puntos += 40;
              }

              if (/1200x/i.test(u)) {
                puntos += 30;
              }

              /*
               * Penalizar imágenes claramente pequeñas.
               */

              if (
                /(?:16x16|32x32|48x48|64x64|75x75)/i.test(u)
              ) {
                puntos -= 300;
              }

              return puntos;
            }

            lista.sort(
              (a, b) =>
                puntuacion(b) -
                puntuacion(a)
            );

            return lista.length
              ? lista[0].url
              : "";
          }

          /*
           * =====================================================
           * EXTRAER ARTÍCULOS
           * =====================================================
           */

          const html =
            leerHtml("pagina.html");

          const noticias = [];
          const vistos = new Set();

          const patronEnlace =
            /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while (
            (m = patronEnlace.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link =
              absoluto(m[1]);

            link =
              link.split("#")[0];

            if (
              !link.startsWith(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!/\.html$/i.test(link)) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            const titulo =
              limpiar(m[2]);

            if (!titulo || titulo.length < 15) {
              continue;
            }

            if (
              /^comentarios$/i.test(titulo)
            ) {
              continue;
            }

            if (
              titulo.toLowerCase().includes(
                "comentarios"
              ) &&
              titulo.length < 30
            ) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          /*
           * =====================================================
           * DESCARGAR CADA ARTÍCULO
           * =====================================================
           */

          const resultado = [];

          for (
            let i = 0;
            i < noticias.length;
            i++
          ) {

            const noticia =
              noticias[i];

            const archivo =
              `articulo-${i}.html`;

            let articulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
                  "-H",
                  "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              articulo =
                leerHtml(archivo);

            } catch (error) {

              console.log(
                "No se pudo descargar:",
                noticia.link
              );
            }

            const imagen =
              buscarImagen(articulo);

            console.log("");
            console.log(
              "----------------------------------------"
            );
            console.log(
              "NOTICIA:",
              noticia.titulo
            );
            console.log(
              "IMAGEN:",
              imagen || "NINGUNA"
            );
            console.log(
              "----------------------------------------"
            );

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen
                ? "imagen"
                : ""
            });
          }

          /*
           * =====================================================
           * GUARDAR JSON
           * =====================================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "========================================"
          );
          console.log(
            "noticias-870.json generado correctamente"
          );
          console.log(
            "Noticias:",
            resultado.length
          );
          console.log(
            "========================================"
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío."
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              /^comentarios$/i.test(
                noticia.titulo.trim()
              )
            ) {
              throw new Error(
                "Se ha encontrado 'comentarios' como noticia."
              );
            }

            if (noticia.imagen) {

              const u =
                noticia.imagen.toLowerCase();

              const prohibidas = [
                "pixel.gif",
                "contabilizacionaccesos",
                "/avatars/",
                "/social/",
                "/iconos/",
                "elmundo.png",
                "favicon",
                "sprite",
                "logo"
              ];

              for (
                const palabra of prohibidas
              ) {

                if (u.includes(palabra)) {
                  throw new Error(
                    "Imagen incorrecta detectada: " +
                    noticia.imagen
                  );
                }
              }
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "Imágenes:",
            data.noticias.filter(
              n => n.imagen
            ).length
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
