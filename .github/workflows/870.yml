name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar RSS de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://e01-elmundo.uecdn.es/blogs/elmundo/clima/index.xml" \
            -o feed.xml

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const feed = fs.readFileSync("feed.xml", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<!\[CDATA\[/gi, "")
              .replace(/\]\]>/gi, "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            if (!url) return "";

            let u = String(url)
              .replace(/&amp;/gi, "&")
              .replace(/\\u002F/g, "/")
              .replace(/\\\//g, "/")
              .trim();

            u = u.replace(/^["']|["']$/g, "");

            if (u.startsWith("//")) {
              return "https:" + u;
            }

            if (u.startsWith("http://")) {
              return "https://" + u.substring(7);
            }

            if (u.startsWith("https://")) {
              return u;
            }

            if (u.startsWith("/")) {
              return "https://www.elmundo.es" + u;
            }

            return "";
          }

          function esImagenValida(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (!/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)) {
              return false;
            }

            const prohibidas = [
              "pixel.gif",
              "pixel.",
              "contabilizacionaccesos",
              "tracking",
              "tracker",
              "spacer",
              "transparent",
              "/perfiles/fotos/",
              "/avatars/",
              "/social/",
              "/iconos/",
              "/icon/",
              "elmundo.png",
              "favicon",
              "sprite",
              "logo",
              "comments_default"
            ];

            for (const palabra of prohibidas) {
              if (u.includes(palabra)) {
                return false;
              }
            }

            return true;
          }

          function imagenValida(url) {
            const u = absoluto(url);

            if (!u) return "";

            return esImagenValida(u) ? u : "";
          }

          /*
           * Extrae el contenido de una etiqueta XML.
           */
          function campo(bloque, nombre) {
            const patron = new RegExp(
              "<" + nombre + "(?:\\\\s[^>]*)?>([\\\\s\\\\S]*?)</" + nombre + ">",
              "i"
            );

            const m = bloque.match(patron);

            if (!m) return "";

            return limpiar(m[1]);
          }

          /*
           * =====================================================
           * EXTRAER ITEMS DEL RSS
           * =====================================================
           */

          const items =
            feed.match(/<item\b[\s\S]*?<\/item>/gi) || [];

          const noticias = [];
          const vistos = new Set();

          for (const item of items) {

            if (noticias.length >= 6) {
              break;
            }

            const titulo =
              campo(item, "title");

            let link =
              campo(item, "link");

            /*
             * Algunos RSS usan guid o CDATA.
             */
            if (!link) {
              link = campo(item, "guid");
            }

            link =
              absoluto(link);

            link =
              link.split("#")[0];

            if (!titulo) continue;
            if (!link) continue;

            if (
              !link.startsWith(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!/\.html$/i.test(link)) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            /*
             * El RSS puede contener imagen.
             * La buscamos solamente si parece pertenecer
             * realmente al artículo.
             */
            let imagen = "";

            const media =
              item.match(
                /<(?:media:content|media:thumbnail)[^>]+url=["']([^"']+)["'][^>]*>/i
              );

            if (media) {
              imagen =
                imagenValida(media[1]);
            }

            /*
             * También buscamos enclosure.
             */
            if (!imagen) {

              const enclosure =
                item.match(
                  /<enclosure[^>]+url=["']([^"']+)["'][^>]*>/i
                );

              if (enclosure) {
                imagen =
                  imagenValida(enclosure[1]);
              }
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link,
              imagen
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "El RSS no contiene artículos válidos."
            );
          }

          console.log(
            "Artículos encontrados en RSS:",
            noticias.length
          );

          /*
           * =====================================================
           * DESCARGAR CADA ARTÍCULO PARA BUSCAR SU FOTO
           * =====================================================
           */

          const resultado = [];

          for (
            let i = 0;
            i < noticias.length;
            i++
          ) {

            const noticia =
              noticias[i];

            const archivo =
              "articulo-" + i + ".html";

            let articulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              articulo =
                fs.readFileSync(
                  archivo,
                  "utf8"
                );

            } catch (error) {

              console.log(
                "No se pudo descargar:",
                noticia.link
              );
            }

            let imagen =
              noticia.imagen || "";

            /*
             * ==================================================
             * PRIMERA PRIORIDAD:
             * imagenes_posts
             * ==================================================
             */

            const posts =
              articulo.match(
                /(?:https?:)?\/\/[^"'<>\\s]+\/blogs\/elmundo\/clima\/imagenes_posts\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<>\\s]*)?/gi
              ) || [];

            for (const url of posts) {

              const candidata =
                imagenValida(url);

              if (candidata) {
                imagen = candidata;
                break;
              }
            }

            /*
             * ==================================================
             * SEGUNDA PRIORIDAD:
             * og:image
             * ==================================================
             *
             * Solo se utiliza si NO hemos encontrado
             * imagenes_posts.
             */

            if (!imagen) {

              const og =
                articulo.match(
                  /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
                );

              if (og) {
                imagen =
                  imagenValida(og[1]);
              }
            }

            if (!imagen) {

              const og =
                articulo.match(
                  /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["'][^>]*>/i
                );

              if (og) {
                imagen =
                  imagenValida(og[1]);
              }
            }

            /*
             * ==================================================
             * TERCERA PRIORIDAD:
             * twitter:image
             * ==================================================
             */

            if (!imagen) {

              const twitter =
                articulo.match(
                  /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
                );

              if (twitter) {
                imagen =
                  imagenValida(twitter[1]);
              }
            }

            /*
             * ==================================================
             * RESULTADO
             * ==================================================
             */

            console.log("");
            console.log(
              "----------------------------------------"
            );
            console.log(
              "NOTICIA:",
              noticia.titulo
            );
            console.log(
              "IMAGEN:",
              imagen || "NINGUNA"
            );
            console.log(
              "----------------------------------------"
            );

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          /*
           * =====================================================
           * GUARDAR JSON
           * =====================================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "OK: noticias-870.json generado."
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío."
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              /^comentarios$/i.test(
                noticia.titulo.trim()
              )
            ) {
              throw new Error(
                "Se ha encontrado 'comentarios' como noticia."
              );
            }

            if (noticia.imagen) {

              const u =
                noticia.imagen.toLowerCase();

              const prohibidas = [
                "pixel.gif",
                "contabilizacionaccesos",
                "/perfiles/fotos/",
                "/avatars/",
                "/social/",
                "/iconos/",
                "elmundo.png",
                "favicon",
                "sprite",
                "logo"
              ];

              for (
                const palabra of prohibidas
              ) {

                if (u.includes(palabra)) {
                  throw new Error(
                    "Imagen incorrecta detectada: " +
                    noticia.imagen
                  );
                }
              }
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );

          console.log(
            "Con imagen:",
            data.noticias.filter(
              n => n.imagen
            ).length
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
