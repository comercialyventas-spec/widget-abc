name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. GENERAR noticias-870.json
      # ============================================================
      - name: Generar noticias-870.json
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");
          const https = require("https");
          const http = require("http");

          const RSS_URL =
            "https://e01-elmundo.uecdn.es/blogs/elmundo/clima/index.xml";

          const BLOG_URL =
            "https://www.elmundo.es/blogs/elmundo/clima/";

          const BASE =
            "https://www.elmundo.es";

          const USER_AGENT =
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36";

          function descargar(url, redirects = 0) {
            return new Promise((resolve, reject) => {

              if (redirects > 5) {
                reject(new Error("Demasiadas redirecciones"));
                return;
              }

              const cliente =
                url.startsWith("https://")
                  ? https
                  : http;

              const req = cliente.get(
                url,
                {
                  headers: {
                    "User-Agent": USER_AGENT,
                    "Accept":
                      "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  },
                  timeout: 30000
                },
                res => {

                  const codigo = res.statusCode || 0;

                  if (
                    codigo >= 300 &&
                    codigo < 400 &&
                    res.headers.location
                  ) {
                    const siguiente =
                      new URL(
                        res.headers.location,
                        url
                      ).href;

                    res.resume();

                    descargar(
                      siguiente,
                      redirects + 1
                    )
                      .then(resolve)
                      .catch(reject);

                    return;
                  }

                  let datos = "";

                  res.setEncoding("utf8");

                  res.on(
                    "data",
                    trozo => {
                      datos += trozo;
                    }
                  );

                  res.on(
                    "end",
                    () => {

                      if (
                        codigo < 200 ||
                        codigo >= 300
                      ) {
                        reject(
                          new Error(
                            `HTTP ${codigo} al descargar ${url}`
                          )
                        );
                        return;
                      }

                      resolve(datos);
                    }
                  );
                }
              );

              req.on(
                "timeout",
                () => {
                  req.destroy(
                    new Error(
                      "Tiempo de espera agotado"
                    )
                  );
                }
              );

              req.on(
                "error",
                reject
              );
            });
          }

          function decodeEntities(texto) {

            return String(texto || "")
              .replace(
                /<!\[CDATA\[([\s\S]*?)\]\]>/gi,
                "$1"
              )
              .replace(
                /&nbsp;/gi,
                " "
              )
              .replace(
                /&amp;/gi,
                "&"
              )
              .replace(
                /&quot;/gi,
                '"'
              )
              .replace(
                /&#39;/gi,
                "'"
              )
              .replace(
                /&apos;/gi,
                "'"
              )
              .replace(
                /&lt;/gi,
                "<"
              )
              .replace(
                /&gt;/gi,
                ">"
              )
              .replace(
                /&#(\d+);/g,
                (_, n) =>
                  String.fromCharCode(
                    Number(n)
                  )
              )
              .replace(
                /&#x([0-9a-f]+);/gi,
                (_, n) =>
                  String.fromCharCode(
                    parseInt(n, 16)
                  )
              );
          }

          function limpiar(texto) {

            return decodeEntities(
              String(texto || "")
            )
              .replace(
                /<script[\s\S]*?<\/script>/gi,
                " "
              )
              .replace(
                /<style[\s\S]*?<\/style>/gi,
                " "
              )
              .replace(
                /<[^>]+>/g,
                " "
              )
              .replace(
                /\s+/g,
                " "
              )
              .trim();
          }

          function absoluto(url) {

            url =
              decodeEntities(
                String(url || "")
              ).trim();

            if (!url) {
              return "";
            }

            if (
              url.startsWith("//")
            ) {
              return "https:" + url;
            }

            if (
              url.startsWith("/")
            ) {
              return BASE + url;
            }

            try {
              return new URL(
                url,
                BASE
              ).href;
            } catch {
              return url;
            }
          }

          function esArticulo(url) {

            if (!url) {
              return false;
            }

            let limpio =
              url.split("#")[0];

            return (
              limpio.startsWith(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              ) &&
              /\.html$/i.test(limpio)
            );
          }

          function imagenReal(url) {

            if (!url) {
              return false;
            }

            const u =
              url.toLowerCase();

            if (
              !/^https?:\/\//i.test(u)
            ) {
              return false;
            }

            if (
              !/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)
            ) {
              return false;
            }

            const basura = [
              "pixel.gif",
              "contabilizacionaccesos",
              "tracking",
              "tracker",
              "spacer",
              "transparent",
              "/iconos/",
              "/icon/",
              "/avatars/",
              "/social/img/",
              "elmundo.png",
              "favicon",
              "sprite",
              "logo"
            ];

            for (
              const palabra of basura
            ) {
              if (
                u.includes(palabra)
              ) {
                return false;
              }
            }

            return true;
          }

          function candidatosImagen(html) {

            const encontrados = [];

            function añadir(url) {

              const limpio =
                absoluto(url);

              if (
                imagenReal(limpio) &&
                !encontrados.includes(limpio)
              ) {
                encontrados.push(
                  limpio
                );
              }
            }

            /*
             * ==================================================
             * PRIORIDAD 1
             * IMÁGENES PROPIAS DEL BLOG ANTIGUO
             * ==================================================
             */

            const posts =
              html.match(
                /https?:\/\/[^"'<>\\s]+\/imagenes_posts\/[^"'<>\\s]+\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/gi
              ) || [];

            for (
              const url of posts
            ) {
              añadir(url);
            }

            /*
             * ==================================================
             * PRIORIDAD 2
             * OG IMAGE
             * ==================================================
             */

            let m =
              html.match(
                /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
              );

            if (m) {
              añadir(m[1]);
            }

            m =
              html.match(
                /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["'][^>]*>/i
              );

            if (m) {
              añadir(m[1]);
            }

            /*
             * ==================================================
             * PRIORIDAD 3
             * TWITTER IMAGE
             * ==================================================
             */

            m =
              html.match(
                /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["'][^>]*>/i
              );

            if (m) {
              añadir(m[1]);
            }

            m =
              html.match(
                /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["'][^>]*>/i
              );

            if (m) {
              añadir(m[1]);
            }

            /*
             * ==================================================
             * PRIORIDAD 4
             * JSON-LD
             * ==================================================
             */

            const bloques =
              html.match(
                /<script[^>]+type=["']application\/ld\+json["'][^>]*>[\s\S]*?<\/script>/gi
              ) || [];

            for (
              const bloque of bloques
            ) {

              const contenido =
                bloque
                  .replace(
                    /^<script[^>]*>/i,
                    ""
                  )
                  .replace(
                    /<\/script>$/i,
                    ""
                  );

              try {

                const objeto =
                  JSON.parse(
                    contenido.trim()
                  );

                function recorrer(x) {

                  if (!x) {
                    return;
                  }

                  if (
                    typeof x === "string"
                  ) {

                    if (
                      imagenReal(x)
                    ) {
                      añadir(x);
                    }

                    return;
                  }

                  if (
                    Array.isArray(x)
                  ) {

                    for (
                      const item of x
                    ) {
                      recorrer(item);
                    }

                    return;
                  }

                  if (
                    typeof x === "object"
                  ) {

                    for (
                      const clave of [
                        "image",
                        "contentUrl",
                        "thumbnailUrl"
                      ]
                    ) {

                      if (
                        x[clave]
                      ) {
                        recorrer(
                          x[clave]
                        );
                      }
                    }
                  }
                }

                recorrer(
                  objeto
                );

              } catch {
                // JSON-LD inválido: continuar
              }
            }

            return encontrados;
          }

          function extraerRSS(xml) {

            const noticias = [];
            const vistos = new Set();

            /*
             * Soporta RSS <item> y Atom <entry>.
             */

            const bloques = [];

            const items =
              xml.match(
                /<item\b[\s\S]*?<\/item>/gi
              ) || [];

            for (
              const item of items
            ) {
              bloques.push(item);
            }

            const entries =
              xml.match(
                /<entry\b[\s\S]*?<\/entry>/gi
              ) || [];

            for (
              const entry of entries
            ) {
              bloques.push(entry);
            }

            for (
              const bloque of bloques
            ) {

              let titulo = "";

              let link = "";

              let m =
                bloque.match(
                  /<title[^>]*>([\s\S]*?)<\/title>/i
                );

              if (m) {
                titulo =
                  limpiar(m[1]);
              }

              m =
                bloque.match(
                  /<link[^>]+href=["']([^"']+)["']/i
                );

              if (m) {
                link =
                  absoluto(m[1]);
              }

              if (!link) {

                m =
                  bloque.match(
                    /<link[^>]*>([\s\S]*?)<\/link>/i
                  );

                if (m) {
                  link =
                    absoluto(
                      limpiar(m[1])
                    );
                }
              }

              link =
                link.split("#")[0];

              if (
                !titulo ||
                !esArticulo(link)
              ) {
                continue;
              }

              if (
                titulo.toLowerCase() ===
                "comentarios"
              ) {
                continue;
              }

              if (
                vistos.has(link)
              ) {
                continue;
              }

              vistos.add(link);

              noticias.push({
                titulo,
                link
              });

              if (
                noticias.length >= 6
              ) {
                break;
              }
            }

            return noticias;
          }

          function extraerPagina(html) {

            const noticias = [];
            const vistos = new Set();

            const patron =
              /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

            let m;

            while (
              (m = patron.exec(html)) !== null &&
              noticias.length < 6
            ) {

              let link =
                absoluto(m[1]);

              link =
                link.split("#")[0];

              if (
                !esArticulo(link)
              ) {
                continue;
              }

              if (
                vistos.has(link)
              ) {
                continue;
              }

              const titulo =
                limpiar(m[2]);

              if (
                !titulo ||
                titulo.length < 15
              ) {
                continue;
              }

              if (
                titulo
                  .toLowerCase()
                  .trim() ===
                "comentarios"
              ) {
                continue;
              }

              vistos.add(link);

              noticias.push({
                titulo,
                link
              });
            }

            return noticias;
          }

          async function main() {

            let noticias = [];

            /*
             * ==================================================
             * PRIMER INTENTO: RSS
             * ==================================================
             */

            try {

              console.log(
                "Descargando RSS:"
              );

              console.log(
                RSS_URL
              );

              const rss =
                await descargar(
                  RSS_URL
                );

              fs.writeFileSync(
                "rss.xml",
                rss,
                "utf8"
              );

              noticias =
                extraerRSS(
                  rss
                );

              console.log(
                "Artículos encontrados en RSS:",
                noticias.length
              );

            } catch (error) {

              console.log(
                "RSS no disponible:",
                error.message
              );
            }

            /*
             * ==================================================
             * SEGUNDO INTENTO: PÁGINA DEL BLOG
             * ==================================================
             */

            if (
              noticias.length === 0
            ) {

              console.log(
                "Usando página del blog como respaldo:"
              );

              console.log(
                BLOG_URL
              );

              const pagina =
                await descargar(
                  BLOG_URL
                );

              fs.writeFileSync(
                "pagina.html",
                pagina,
                "utf8"
              );

              noticias =
                extraerPagina(
                  pagina
                );

              console.log(
                "Artículos encontrados en página:",
                noticias.length
              );
            }

            if (
              noticias.length === 0
            ) {
              throw new Error(
                "No se encontraron artículos válidos de El Mundo."
              );
            }

            /*
             * ==================================================
             * DESCARGAR ARTÍCULOS Y BUSCAR IMAGEN
             * ==================================================
             */

            const resultado = [];

            for (
              let i = 0;
              i < noticias.length;
              i++
            ) {

              const noticia =
                noticias[i];

              console.log("");
              console.log(
                "========================================"
              );
              console.log(
                "NOTICIA:",
                noticia.titulo
              );
              console.log(
                "URL:",
                noticia.link
              );

              let articulo = "";

              try {

                articulo =
                  await descargar(
                    noticia.link
                  );

              } catch (error) {

                console.log(
                  "No se pudo descargar el artículo:",
                  error.message
                );
              }

              let imagen = "";

              if (
                articulo
              ) {

                const candidatos =
                  candidatosImagen(
                    articulo
                  );

                if (
                  candidatos.length > 0
                ) {

                  imagen =
                    candidatos[0];

                  console.log(
                    "IMAGEN:",
                    imagen
                  );

                } else {

                  console.log(
                    "IMAGEN: NINGUNA"
                  );
                }
              }

              resultado.push({
                titulo:
                  noticia.titulo,
                link:
                  noticia.link,
                imagen:
                  imagen,
                tipo:
                  imagen
                    ? "imagen"
                    : ""
              });
            }

            /*
             * ==================================================
             * GENERAR JSON
             * ==================================================
             */

            const salida = {
              noticias:
                resultado
            };

            fs.writeFileSync(
              "noticias-870.json",
              JSON.stringify(
                salida,
                null,
                2
              ) + "\n",
              "utf8"
            );

            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "noticias-870.json generado correctamente."
            );
            console.log(
              "Noticias:",
              resultado.length
            );
            console.log(
              "Con imagen:",
              resultado.filter(
                x => x.imagen
              ).length
            );
            console.log(
              "Sin imagen:",
              resultado.filter(
                x => !x.imagen
              ).length
            );
            console.log(
              "========================================"
            );
          }

          main().catch(error => {

            console.error(
              "ERROR:",
              error
            );

            process.exit(1);
          });
          NODE

      # ============================================================
      # 3. VALIDAR JSON
      # ============================================================
      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const archivo = "noticias-870.json";

          if (!fs.existsSync(archivo)) {
            throw new Error(
              "No existe noticias-870.json"
            );
          }

          const data =
            JSON.parse(
              fs.readFileSync(
                archivo,
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias)
          ) {
            throw new Error(
              "El JSON no contiene el array noticias."
            );
          }

          if (
            data.noticias.length === 0
          ) {
            throw new Error(
              "El JSON está vacío."
            );
          }

          for (
            const noticia of data.noticias
          ) {

            if (
              !noticia.titulo
            ) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (
              !noticia.link
            ) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() ===
              "comentarios"
            ) {
              throw new Error(
                "Se ha detectado 'comentarios' como noticia."
              );
            }

            if (
              noticia.imagen
            ) {

              const u =
                noticia.imagen
                  .toLowerCase();

              if (
                u.includes("pixel.gif") ||
                u.includes("contabilizacionaccesos") ||
                u.includes("/avatars/") ||
                u.includes("/social/img/") ||
                u.includes("/iconos/") ||
                u.includes("elmundo.png") ||
                u.includes("favicon") ||
                u.includes("tracker") ||
                u.includes("tracking")
              ) {
                throw new Error(
                  "Imagen incorrecta detectada: " +
                  noticia.imagen
                );
              }
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );
          NODE

      # ============================================================
      # 4. COMMIT + PUSH
      # ============================================================
      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
