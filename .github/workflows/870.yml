name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar noticias-870.json
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");
          const https = require("https");
          const http = require("http");

          const RSS =
            "https://e01-elmundo.uecdn.es/blogs/elmundo/clima/index.xml";

          const BLOG =
            "https://www.elmundo.es/blogs/elmundo/clima/";

          const PREFIJO =
            "https://www.elmundo.es/blogs/elmundo/clima/";

          const UA =
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36";

          function get(url, redirs = 0) {
            return new Promise((resolve, reject) => {

              if (redirs > 8) {
                reject(new Error("Demasiadas redirecciones"));
                return;
              }

              const mod = url.startsWith("https://")
                ? https
                : http;

              const req = mod.get(
                url,
                {
                  headers: {
                    "User-Agent": UA,
                    "Accept":
                      "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  },
                  timeout: 30000
                },
                res => {

                  const status = res.statusCode || 0;

                  if (
                    status >= 300 &&
                    status < 400 &&
                    res.headers.location
                  ) {
                    const next =
                      new URL(
                        res.headers.location,
                        url
                      ).href;

                    res.resume();

                    get(next, redirs + 1)
                      .then(resolve)
                      .catch(reject);

                    return;
                  }

                  let body = "";

                  res.setEncoding("utf8");

                  res.on(
                    "data",
                    x => body += x
                  );

                  res.on(
                    "end",
                    () => {

                      if (
                        status < 200 ||
                        status >= 300
                      ) {
                        reject(
                          new Error(
                            `HTTP ${status}`
                          )
                        );
                        return;
                      }

                      resolve(body);
                    }
                  );
                }
              );

              req.on(
                "timeout",
                () => {
                  req.destroy(
                    new Error("Timeout")
                  );
                }
              );

              req.on(
                "error",
                reject
              );
            });
          }

          function decode(s) {

            return String(s || "")
              .replace(
                /<!\[CDATA\[([\s\S]*?)\]\]>/gi,
                "$1"
              )
              .replace(
                /&amp;/gi,
                "&"
              )
              .replace(
                /&quot;/gi,
                '"'
              )
              .replace(
                /&#39;/gi,
                "'"
              )
              .replace(
                /&apos;/gi,
                "'"
              )
              .replace(
                /&lt;/gi,
                "<"
              )
              .replace(
                /&gt;/gi,
                ">"
              )
              .replace(
                /&#(\d+);/g,
                (_, n) =>
                  String.fromCharCode(+n)
              )
              .replace(
                /&#x([0-9a-f]+);/gi,
                (_, n) =>
                  String.fromCharCode(
                    parseInt(n, 16)
                  )
              );
          }

          function limpiar(s) {

            return decode(s)
              .replace(
                /<script[\s\S]*?<\/script>/gi,
                " "
              )
              .replace(
                /<style[\s\S]*?<\/style>/gi,
                " "
              )
              .replace(
                /<[^>]+>/g,
                " "
              )
              .replace(
                /\s+/g,
                " "
              )
              .trim();
          }

          function absoluta(url, base = "https://www.elmundo.es") {

            url =
              decode(url)
                .trim()
                .replace(
                  /^['"]|['"]$/g,
                  ""
                );

            if (!url) {
              return "";
            }

            if (
              url.startsWith("//")
            ) {
              return "https:" + url;
            }

            try {
              return new URL(
                url,
                base
              ).href;
            } catch {
              return "";
            }
          }

          function esImagenValida(url) {

            if (!url) {
              return false;
            }

            const u =
              url.toLowerCase();

            if (
              !/^https?:\/\//.test(u)
            ) {
              return false;
            }

            if (
              !/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)
            ) {
              return false;
            }

            const prohibidas = [
              "pixel.gif",
              "pixel.png",
              "contabilizacionaccesos",
              "tracking",
              "tracker",
              "spacer",
              "transparent",
              "favicon",
              "sprite",
              "/avatars/",
              "/avatar/",
              "/social/img/",
              "/iconos/",
              "/icon/",
              "elmundo.png",
              "logo",
              "logos"
            ];

            for (
              const p of prohibidas
            ) {
              if (
                u.includes(p)
              ) {
                return false;
              }
            }

            return true;
          }

          function extraerURLImagen(valor) {

            if (!valor) {
              return [];
            }

            const salida = [];

            const partes =
              String(valor)
                .split(",");

            for (
              const parte of partes
            ) {

              let x =
                parte.trim()
                  .split(/\s+/)[0];

              x =
                x.replace(
                  /^['"]|['"]$/g,
                  ""
                );

              if (
                esImagenValida(x)
              ) {
                salida.push(x);
              }
            }

            return salida;
          }

          function buscarImagen(html) {

            const candidatas = [];

            function añadir(valor) {

              for (
                const x of extraerURLImagen(valor)
              ) {

                const u =
                  absoluta(x);

                if (
                  esImagenValida(u) &&
                  !candidatas.includes(u)
                ) {
                  candidatas.push(u);
                }
              }
            }

            /*
             * 1. IMÁGENES DEL SISTEMA ANTIGUO
             *
             * Esta es la prioridad máxima para este blog.
             */

            const antiguas =
              html.match(
                /(?:https?:)?\/\/[^"'<>\\s]+\/imagenes_posts\/[^"'<>\\s]+/gi
              ) || [];

            for (
              const x of antiguas
            ) {
              añadir(x);
            }

            /*
             * 2. IMG TAGS
             */

            const imgs =
              html.match(
                /<img\b[^>]*>/gi
              ) || [];

            for (
              const tag of imgs
            ) {

              const atributos = [
                "data-src",
                "data-original",
                "data-lazy-src",
                "data-image",
                "src",
                "srcset",
                "data-srcset"
              ];

              for (
                const atributo of atributos
              ) {

                const re =
                  new RegExp(
                    atributo +
                    "\\s*=\\s*[\"']([^\"']+)[\"']",
                    "i"
                  );

                const m =
                  tag.match(re);

                if (m) {
                  añadir(m[1]);
                }
              }
            }

            /*
             * 3. OG IMAGE
             */

            const og =
              html.match(
                /<meta\b[^>]*property\s*=\s*["']og:image["'][^>]*>/gi
              ) || [];

            for (
              const tag of og
            ) {

              const m =
                tag.match(
                  /content\s*=\s*["']([^"']+)["']/i
                );

              if (m) {
                añadir(m[1]);
              }
            }

            /*
             * 4. TWITTER IMAGE
             */

            const tw =
              html.match(
                /<meta\b[^>]*(?:name|property)\s*=\s*["']twitter:image(?::src)?["'][^>]*>/gi
              ) || [];

            for (
              const tag of tw
            ) {

              const m =
                tag.match(
                  /content\s*=\s*["']([^"']+)["']/i
                );

              if (m) {
                añadir(m[1]);
              }
            }

            /*
             * 5. JSON-LD
             */

            const ld =
              html.match(
                /<script\b[^>]*type\s*=\s*["']application\/ld\+json["'][^>]*>[\s\S]*?<\/script>/gi
              ) || [];

            for (
              const bloque of ld
            ) {

              const contenido =
                bloque
                  .replace(
                    /^<script\b[^>]*>/i,
                    ""
                  )
                  .replace(
                    /<\/script>$/i,
                    ""
                  );

              try {

                const obj =
                  JSON.parse(
                    contenido.trim()
                  );

                function recorrer(x) {

                  if (!x) {
                    return;
                  }

                  if (
                    typeof x === "string"
                  ) {

                    añadir(x);
                    return;
                  }

                  if (
                    Array.isArray(x)
                  ) {

                    for (
                      const y of x
                    ) {
                      recorrer(y);
                    }

                    return;
                  }

                  if (
                    typeof x === "object"
                  ) {

                    for (
                      const clave of [
                        "image",
                        "contentUrl",
                        "thumbnailUrl"
                      ]
                    ) {

                      if (
                        x[clave]
                      ) {
                        recorrer(
                          x[clave]
                        );
                      }
                    }
                  }
                }

                recorrer(obj);

              } catch {
                // continuar
              }
            }

            /*
             * ==================================================
             * IMPORTANTE:
             *
             * Si hay imágenes /imagenes_posts/, devolver la
             * primera de esas antes que cualquier otra.
             * ==================================================
             */

            const propia =
              candidatas.find(
                x =>
                  x.toLowerCase()
                    .includes(
                      "/imagenes_posts/"
                    )
              );

            if (propia) {
              return propia;
            }

            return candidatas[0] || "";
          }

          function extraerArticulosRSS(xml) {

            const resultado = [];
            const vistos = new Set();

            const bloques =
              [
                ...(xml.match(
                  /<item\b[\s\S]*?<\/item>/gi
                ) || []),
                ...(xml.match(
                  /<entry\b[\s\S]*?<\/entry>/gi
                ) || [])
              ];

            for (
              const bloque of bloques
            ) {

              let titulo = "";
              let link = "";

              let m =
                bloque.match(
                  /<title\b[^>]*>([\s\S]*?)<\/title>/i
                );

              if (m) {
                titulo =
                  limpiar(m[1]);
              }

              m =
                bloque.match(
                  /<link\b[^>]*href\s*=\s*["']([^"']+)["']/i
                );

              if (m) {
                link =
                  absoluta(m[1]);
              }

              if (!link) {

                m =
                  bloque.match(
                    /<link\b[^>]*>([\s\S]*?)<\/link>/i
                  );

                if (m) {
                  link =
                    absoluta(
                      limpiar(m[1])
                    );
                }
              }

              link =
                link.split("#")[0];

              if (
                !titulo ||
                !link ||
                !link.startsWith(PREFIJO) ||
                !/\.html$/i.test(link)
              ) {
                continue;
              }

              if (
                titulo
                  .trim()
                  .toLowerCase() ===
                "comentarios"
              ) {
                continue;
              }

              if (
                vistos.has(link)
              ) {
                continue;
              }

              vistos.add(link);

              resultado.push({
                titulo,
                link
              });

              if (
                resultado.length >= 6
              ) {
                break;
              }
            }

            return resultado;
          }

          function extraerArticulosPagina(html) {

            const resultado = [];
            const vistos = new Set();

            const re =
              /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

            let m;

            while (
              (m = re.exec(html)) &&
              resultado.length < 6
            ) {

              let link =
                absoluta(m[1]);

              link =
                link.split("#")[0];

              if (
                !link.startsWith(PREFIJO) ||
                !/\.html$/i.test(link)
              ) {
                continue;
              }

              if (
                vistos.has(link)
              ) {
                continue;
              }

              const titulo =
                limpiar(m[2]);

              if (
                !titulo ||
                titulo.length < 15
              ) {
                continue;
              }

              if (
                titulo
                  .toLowerCase()
                  .trim() ===
                "comentarios"
              ) {
                continue;
              }

              vistos.add(link);

              resultado.push({
                titulo,
                link
              });
            }

            return resultado;
          }

          async function main() {

            let noticias = [];

            /*
             * RSS
             */

            try {

              console.log(
                "Intentando RSS..."
              );

              const xml =
                await get(RSS);

              fs.writeFileSync(
                "rss.xml",
                xml
              );

              noticias =
                extraerArticulosRSS(
                  xml
                );

              console.log(
                "RSS:",
                noticias.length,
                "artículos"
              );

            } catch (e) {

              console.log(
                "RSS falló:",
                e.message
              );
            }

            /*
             * PÁGINA COMO RESPALDO
             */

            if (
              noticias.length === 0
            ) {

              console.log(
                "Usando página del blog..."
              );

              const html =
                await get(BLOG);

              fs.writeFileSync(
                "pagina.html",
                html
              );

              noticias =
                extraerArticulosPagina(
                  html
                );

              console.log(
                "Página:",
                noticias.length,
                "artículos"
              );
            }

            if (
              noticias.length === 0
            ) {
              throw new Error(
                "No se encontraron artículos."
              );
            }

            const salida = [];

            /*
             * PROCESAR LOS 6 ARTÍCULOS
             */

            for (
              let i = 0;
              i < noticias.length;
              i++
            ) {

              const n =
                noticias[i];

              console.log("");
              console.log(
                "----------------------------------------"
              );
              console.log(
                `${i + 1}. ${n.titulo}`
              );

              let html = "";

              try {

                html =
                  await get(n.link);

              } catch (e) {

                console.log(
                  "Error descargando artículo:",
                  e.message
                );
              }

              let imagen = "";

              if (html) {

                imagen =
                  buscarImagen(
                    html
                  );

                console.log(
                  "Imagen:",
                  imagen || "NINGUNA"
                );
              }

              salida.push({
                titulo:
                  n.titulo,
                link:
                  n.link,
                imagen:
                  imagen,
                tipo:
                  imagen
                    ? "imagen"
                    : ""
              });
            }

            /*
             * GUARDAR JSON
             */

            fs.writeFileSync(
              "noticias-870.json",
              JSON.stringify(
                {
                  noticias:
                    salida
                },
                null,
                2
              ) + "\n",
              "utf8"
            );

            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "GENERADO noticias-870.json"
            );
            console.log(
              "Noticias:",
              salida.length
            );
            console.log(
              "Con imagen:",
              salida.filter(
                n => n.imagen
              ).length
            );
            console.log(
              "Sin imagen:",
              salida.filter(
                n => !n.imagen
              ).length
            );
            console.log(
              "========================================"
            );
          }

          main()
            .catch(error => {
              console.error(
                "ERROR:",
                error.message
              );
              process.exit(1);
            });
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json vacío."
            );
          }

          for (
            const n of data.noticias
          ) {

            if (!n.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!n.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              n.titulo
                .trim()
                .toLowerCase() ===
              "comentarios"
            ) {
              throw new Error(
                "Se encontró 'comentarios'."
              );
            }

            if (
              n.imagen &&
              (
                n.imagen.includes(
                  "pixel.gif"
                ) ||
                n.imagen.includes(
                  "contabilizacionaccesos"
                ) ||
                n.imagen.includes(
                  "/avatars/"
                ) ||
                n.imagen.includes(
                  "/social/img/"
                ) ||
                n.imagen.includes(
                  "/iconos/"
                ) ||
                n.imagen.includes(
                  "elmundo.png"
                ) ||
                n.imagen.includes(
                  "favicon"
                ) ||
                n.imagen.includes(
                  "tracker"
                ) ||
                n.imagen.includes(
                  "tracking"
                )
              )
            ) {
              throw new Error(
                "Imagen inválida: " +
                n.imagen
              );
            }
          }

          console.log(
            "JSON validado correctamente."
          );
          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
