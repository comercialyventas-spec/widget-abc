name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");

          const html = fs.readFileSync("pagina.html");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function corregirUtf8(texto) {
            try {
              return Buffer.from(texto, "latin1").toString("utf8");
            } catch {
              return texto;
            }
          }

          function absoluto(url) {
            if (!url) return "";

            url = String(url)
              .replace(/&amp;/gi, "&")
              .trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function atributo(bloque, nombre) {
            const patron = new RegExp(
              nombre + "\\s*=\\s*[\"']([^\"']+)[\"']",
              "i"
            );

            const m = bloque.match(patron);
            return m ? absoluto(m[1]) : "";
          }

          function imagenDePagina(pagina) {

            /*
             * 1. Open Graph
             */

            let m = pagina.match(
              /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i
            );

            if (m) {
              return absoluto(m[1]);
            }

            m = pagina.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i
            );

            if (m) {
              return absoluto(m[1]);
            }

            /*
             * 2. twitter:image
             */

            m = pagina.match(
              /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i
            );

            if (m) {
              return absoluto(m[1]);
            }

            m = pagina.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i
            );

            if (m) {
              return absoluto(m[1]);
            }

            /*
             * 3. Imágenes de article.
             */

            const imagenes =
              pagina.match(
                /https?:\/\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/gi
              ) || [];

            for (const url of imagenes) {
              if (
                !url.includes("logo") &&
                !url.includes("icon") &&
                !url.includes("avatar") &&
                !url.includes("sprite")
              ) {
                return absoluto(url);
              }
            }

            /*
             * 4. img src
             */

            const img =
              pagina.match(
                /<img[^>]+src=["']([^"']+)["']/i
              );

            if (img) {
              return absoluto(img[1]);
            }

            return "";
          }

          function descargar(url, archivo) {
            try {
              cp.execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  url,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              return fs.readFileSync(
                archivo,
                "utf8"
              );
            } catch {
              return "";
            }
          }

          /*
           * ==========================================
           * EXTRAER ARTÍCULOS DE LA PORTADA
           * ==========================================
           */

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let encontrado;

          while (
            (encontrado = patron.exec(html.toString("utf8"))) !== null
          ) {

            if (noticias.length >= 6) {
              break;
            }

            let link = absoluto(
              encontrado[1]
            );

            link = link.split("#")[0];

            if (
              !link.includes(
                "elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (
              link.endsWith("/clima/") ||
              link.endsWith("/clima")
            ) {
              continue;
            }

            if (
              !/\.html(?:\?.*)?$/i.test(link)
            ) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            let titulo =
              limpiar(encontrado[2]);

            titulo =
              corregirUtf8(titulo);

            if (!titulo) {
              continue;
            }

            if (
              titulo.length < 15 ||
              /^comentarios$/i.test(titulo) ||
              /^leer más$/i.test(titulo) ||
              /^ver más$/i.test(titulo)
            ) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link
            });
          }

          /*
           * ==========================================
           * BUSCAR IMAGEN EN CADA ARTÍCULO
           * ==========================================
           */

          const resultado = [];

          for (
            let i = 0;
            i < noticias.length;
            i++
          ) {

            const noticia = noticias[i];

            console.log(
              "Buscando imagen:",
              noticia.titulo
            );

            const archivo =
              "articulo-" + i + ".html";

            const pagina =
              descargar(
                noticia.link,
                archivo
              );

            let imagen = "";

            if (pagina) {
              imagen =
                imagenDePagina(pagina);
            }

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen
                ? "imagen"
                : ""
            });

            console.log(
              "Imagen:",
              imagen || "NO ENCONTRADA"
            );
          }

          /*
           * ==========================================
           * VALIDACIÓN
           * ==========================================
           */

          if (resultado.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          if (resultado.some(
            n => n.titulo.toLowerCase() === "comentarios"
          )) {
            throw new Error(
              "Se ha detectado un elemento de comentarios."
            );
          }

          /*
           * ==========================================
           * ESCRIBIR JSON
           * ==========================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "=========================================="
          );
          console.log(
            "noticias-870.json GENERADO"
          );
          console.log(
            "Noticias:",
            resultado.length
          );
          console.log(
            "=========================================="
          );

          console.log(
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            )
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío o es inválido"
            );
          }

          const enlaces = new Set();

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Hay una noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Hay una noticia sin enlace"
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() === "comentarios"
            ) {
              throw new Error(
                "El JSON contiene comentarios"
              );
            }

            if (
              enlaces.has(noticia.link)
            ) {
              throw new Error(
                "Hay enlaces duplicados"
              );
            }

            enlaces.add(noticia.link);
          }

          console.log(
            "JSON 870 válido."
          );

          console.log(
            "Número de noticias:",
            data.noticias.length
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
