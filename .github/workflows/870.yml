name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # 2. DESCARGAR EL MUNDO
      # ==================================================

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            "http://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html

      # ==================================================
      # 3. GENERAR JSON
      # ==================================================

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              );
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]*>/g, " ")
            )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            if (!url) return "";

            url = decodeHtml(url).trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "http://www.elmundo.es" + url;
            }

            return url;
          }

          function atributo(bloque, nombre) {
            const patron =
              new RegExp(
                nombre + "\\s*=\\s*[\"']([^\"']+)[\"']",
                "i"
              );

            const encontrado = bloque.match(patron);

            return encontrado
              ? absoluto(encontrado[1])
              : "";
          }

          function buscarImagen(bloque) {

            let imagen;

            imagen = atributo(bloque, "data-src");
            if (imagen) return imagen;

            imagen = atributo(bloque, "data-original");
            if (imagen) return imagen;

            imagen = atributo(bloque, "data-lazy-src");
            if (imagen) return imagen;

            imagen = atributo(bloque, "data-image");
            if (imagen) return imagen;

            imagen = atributo(bloque, "src");
            if (imagen) return imagen;

            const og1 = bloque.match(
              /property\s*=\s*["']og:image["'][^>]*content\s*=\s*["']([^"']+)["']/i
            );

            if (og1) return absoluto(og1[1]);

            const og2 = bloque.match(
              /content\s*=\s*["']([^"']+)["'][^>]*property\s*=\s*["']og:image["']/i
            );

            if (og2) return absoluto(og2[1]);

            const urls = bloque.match(
              /https?:\/\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/gi
            );

            if (urls && urls.length) {
              return urls[0];
            }

            return "";
          }

          const noticias = [];
          const vistos = new Set();

          /*
           * Buscar artículos del blog.
           */

          const patron =
            /<a\b[^>]*href\s*=\s*["']([^"']*\/blogs\/elmundo\/clima\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let encontrado;

          while (
            (encontrado = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            const link = absoluto(encontrado[1]);
            const contenido = encontrado[2];

            if (!link) continue;

            if (
              link === "http://www.elmundo.es/blogs/elmundo/clima/" ||
              link === "http://www.elmundo.es/blogs/elmundo/clima"
            ) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            let titulo = limpiar(contenido);

            if (!titulo || titulo.length < 10) {
              continue;
            }

            vistos.add(link);

            /*
             * Buscar imagen en el propio enlace.
             */

            let imagen = buscarImagen(encontrado[0]);

            /*
             * Buscar imagen alrededor del enlace.
             */

            if (!imagen) {

              const inicio =
                Math.max(0, encontrado.index - 2000);

              const fin =
                Math.min(
                  html.length,
                  encontrado.index +
                  encontrado[0].length +
                  2000
                );

              const contexto =
                html.substring(inicio, fin);

              imagen = buscarImagen(contexto);
            }

            noticias.push({
              titulo: titulo,
              link: link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          /*
           * Segundo método de búsqueda por si la estructura
           * HTML del blog no utiliza el mismo formato.
           */

          if (noticias.length < 6) {

            const patronUrl =
              /https?:\/\/(?:www\.)?elmundo\.es\/blogs\/elmundo\/clima\/[^"'<>\\s]+/gi;

            const urls = html.match(patronUrl) || [];

            for (
              const urlOriginal of urls
            ) {

              if (noticias.length >= 6) break;

              const link =
                urlOriginal.replace(
                  /&amp;/gi,
                  "&"
                );

              if (vistos.has(link)) {
                continue;
              }

              const posicion =
                html.indexOf(urlOriginal);

              if (posicion < 0) continue;

              const inicio =
                Math.max(
                  0,
                  posicion - 2000
                );

              const fin =
                Math.min(
                  html.length,
                  posicion + 2500
                );

              const contexto =
                html.substring(
                  inicio,
                  fin
                );

              let titulo = "";

              const h =
                contexto.match(
                  /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i
                );

              if (h) {
                titulo =
                  limpiar(h[1]);
              }

              if (
                !titulo ||
                titulo.length < 10
              ) {
                continue;
              }

              const imagen =
                buscarImagen(contexto);

              vistos.add(link);

              noticias.push({
                titulo: titulo,
                link: link,
                imagen: imagen,
                tipo: imagen
                  ? "imagen"
                  : ""
              });
            }
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          /*
           * Máximo 6 noticias.
           */

          const finales =
            noticias.slice(0, 6);

          const resultado = {
            noticias: finales
          };

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log(
            "===================================="
          );

          console.log(
            "noticias-870.json generado"
          );

          console.log(
            "Noticias:",
            finales.length
          );

          console.log(
            JSON.stringify(
              resultado,
              null,
              2
            )
          );

          console.log(
            "===================================="
          );
          NODE

      # ==================================================
      # 4. VALIDAR JSON
      # ==================================================

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-870.json",
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío o es inválido"
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Hay una noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Hay una noticia sin enlace"
              );
            }

          }

          console.log(
            "JSON válido."
          );

          console.log(
            "Número de noticias:",
            data.noticias.length
          );
          NODE

      # ==================================================
      # 5. GUARDAR EN GITHUB
      # ==================================================

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
