name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. DESCARGAR EL MUNDO
      # ==========================================

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail \
            --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html

      # ==========================================
      # 3. GENERAR JSON
      # ==========================================

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          /*
           * ----------------------------------------
           * DECODIFICACIÓN HTML
           * ----------------------------------------
           */

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              );
          }

          /*
           * ----------------------------------------
           * LIMPIAR HTML
           * ----------------------------------------
           */

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]*>/g, " ")
            )
              .replace(/\s+/g, " ")
              .trim();
          }

          /*
           * ----------------------------------------
           * URL ABSOLUTA
           * ----------------------------------------
           */

          function absoluto(url) {
            if (!url) return "";

            url = decodeHtml(url).trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          /*
           * ----------------------------------------
           * ATRIBUTO HTML
           * ----------------------------------------
           */

          function atributo(bloque, nombre) {

            const patron = new RegExp(
              nombre + "\\s*=\\s*[\"']([^\"']+)[\"']",
              "i"
            );

            const m = bloque.match(patron);

            return m
              ? absoluto(m[1])
              : "";
          }

          /*
           * ----------------------------------------
           * BUSCAR IMAGEN
           * ----------------------------------------
           *
           * IMPORTANTE:
           * Solo buscamos imágenes dentro del bloque
           * correspondiente al artículo.
           */

          function buscarImagen(bloque) {

            let imagen;

            imagen = atributo(bloque, "data-src");
            if (imagen) return imagen;

            imagen = atributo(bloque, "data-original");
            if (imagen) return imagen;

            imagen = atributo(bloque, "data-lazy-src");
            if (imagen) return imagen;

            imagen = atributo(bloque, "src");
            if (imagen) return imagen;

            /*
             * Imágenes antiguas de El Mundo.
             */

            const urls = bloque.match(
              /https?:\/\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|gif|webp)(?:\?[^"'<>\\s]*)?/gi
            );

            if (urls && urls.length) {
              return urls[0];
            }

            return "";
          }

          /*
           * ----------------------------------------
           * EXTRAER BLOQUES DE ARTÍCULOS
           * ----------------------------------------
           */

          const noticias = [];
          const vistos = new Set();

          /*
           * Buscamos enlaces cuyo destino sea un artículo.
           *
           * NO aceptamos:
           * - #comentarios
           * - enlaces de navegación
           * - la portada del blog
           */

          const patron = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let encontrado;

          while (
            (encontrado = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link = absoluto(encontrado[1]);

            if (!link) continue;

            /*
             * Eliminar fragmentos.
             */

            const sinFragmento =
              link.split("#")[0];

            link = sinFragmento;

            /*
             * Solo artículos del blog Clima.
             */

            if (
              !link.includes(
                "elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            /*
             * No aceptar portada.
             */

            if (
              link.endsWith("/clima/") ||
              link.endsWith("/clima")
            ) {
              continue;
            }

            /*
             * Evitar duplicados.
             */

            if (vistos.has(link)) {
              continue;
            }

            /*
             * El enlace tiene que terminar en .html
             * para considerarlo artículo.
             */

            if (!/\.html(?:\?.*)?$/i.test(link)) {
              continue;
            }

            /*
             * TÍTULO
             */

            let titulo =
              limpiar(encontrado[2]);

            /*
             * Ignorar "comentarios" y textos
             * de navegación.
             */

            if (
              !titulo ||
              titulo.length < 15 ||
              /^comentarios$/i.test(titulo) ||
              /^leer más$/i.test(titulo) ||
              /^ver más$/i.test(titulo)
            ) {
              continue;
            }

            /*
             * Si el título contiene demasiados elementos
             * de navegación, descartarlo.
             */

            if (
              /^(facebook|twitter|compartir|comentar)$/i.test(
                titulo
              )
            ) {
              continue;
            }

            vistos.add(link);

            /*
             * --------------------------------------
             * BLOQUE DEL ARTÍCULO
             * --------------------------------------
             *
             * Miramos hacia atrás y adelante, pero
             * buscamos una imagen únicamente si está
             * próxima al enlace.
             */

            const posicion =
              encontrado.index;

            const inicio =
              Math.max(
                0,
                posicion - 1000
              );

            const fin =
              Math.min(
                html.length,
                posicion +
                encontrado[0].length +
                1000
              );

            const contexto =
              html.substring(
                inicio,
                fin
              );

            let imagen =
              buscarImagen(encontrado[0]);

            /*
             * Si el enlace no contiene imagen,
             * buscamos dentro del bloque cercano.
             */

            if (!imagen) {
              imagen =
                buscarImagen(contexto);
            }

            noticias.push({
              titulo: titulo,
              link: link,
              imagen: imagen,
              tipo: imagen
                ? "imagen"
                : ""
            });

          }

          /*
           * ----------------------------------------
           * ELIMINAR DUPLICADOS
           * ----------------------------------------
           */

          const finales = [];
          const links = new Set();

          for (const noticia of noticias) {

            if (finales.length >= 6) {
              break;
            }

            if (links.has(noticia.link)) {
              continue;
            }

            links.add(noticia.link);

            finales.push(noticia);
          }

          /*
           * ----------------------------------------
           * VALIDACIÓN
           * ----------------------------------------
           */

          if (finales.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          /*
           * ----------------------------------------
           * GENERAR JSON
           * ----------------------------------------
           */

          const resultado = {
            noticias: finales
          };

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              resultado,
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "=========================================="
          );
          console.log(
            "NOTICIAS-870 GENERADO CORRECTAMENTE"
          );
          console.log(
            "=========================================="
          );
          console.log(
            "Número de noticias:",
            finales.length
          );

          finales.forEach(
            (n, i) => {
              console.log("");
              console.log(
                (i + 1) + ". " + n.titulo
              );
              console.log(
                "URL: " + n.link
              );
              console.log(
                "IMAGEN: " +
                (n.imagen || "NO ENCONTRADA")
              );
            }
          );

          console.log("");
          NODE

      # ==========================================
      # 4. VALIDAR JSON
      # ==========================================

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío o es inválido"
            );
          }

          const enlaces =
            new Set();

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Hay una noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Hay una noticia sin enlace"
              );
            }

            if (
              noticia.titulo
                .toLowerCase()
                .trim() === "comentarios"
            ) {
              throw new Error(
                "Se ha detectado un enlace de comentarios"
              );
            }

            if (
              enlaces.has(noticia.link)
            ) {
              throw new Error(
                "Hay enlaces duplicados"
              );
            }

            enlaces.add(noticia.link);
          }

          console.log(
            "================================"
          );
          console.log(
            "JSON 870 VALIDADO CORRECTAMENTE"
          );
          console.log(
            "Noticias:",
            data.noticias.length
          );
          console.log(
            "================================"
          );
          NODE

      # ==========================================
      # 5. GUARDAR EN GITHUB
      # ==========================================

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
