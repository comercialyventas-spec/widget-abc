name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            url = String(url || "").trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("http://")) {
              return "https://" + url.substring(7);
            }

            if (url.startsWith("https://")) {
              return url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function esImagenValida(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (!/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)) {
              return false;
            }

            if (u.includes("pixel")) return false;
            if (u.includes("contabilizacion")) return false;
            if (u.includes("tracking")) return false;
            if (u.includes("tracker")) return false;
            if (u.includes("spacer")) return false;
            if (u.includes("transparent")) return false;

            if (u.includes("/avatars/")) return false;
            if (u.includes("/social/img/")) return false;
            if (u.includes("/iconos/")) return false;
            if (u.includes("/icon/")) return false;
            if (u.includes("favicon")) return false;
            if (u.includes("sprite")) return false;
            if (u.includes("logo")) return false;
            if (u.includes("elmundo.png")) return false;

            return true;
          }

          function extraerImagenArticulo(pagina) {

            /*
             * ==================================================
             * 1. PRIORIDAD ABSOLUTA:
             *    imagenes_posts
             * ==================================================
             */

            const candidatos = [];

            const regexImagenPosts =
              /(?:https?:)?\/\/[^"'<>\\s]+\/imagenes_posts\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<>\\s]*)?/gi;

            let m;

            while ((m = regexImagenPosts.exec(pagina)) !== null) {
              candidatos.push(m[0]);
            }

            /*
             * También puede aparecer como URL relativa.
             */

            const regexRelativa =
              /["'=]\s*(\/[^"'<>\\s]*\/imagenes_posts\/[^"'<>\\s]+\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<>\\s]*)?)/gi;

            while ((m = regexRelativa.exec(pagina)) !== null) {
              candidatos.push(m[1]);
            }

            for (const candidato of candidatos) {

              let url = candidato
                .replace(/&amp;/gi, "&")
                .replace(/\\u002F/gi, "/")
                .trim();

              url = absoluto(url);

              if (esImagenValida(url)) {
                return url;
              }
            }

            /*
             * ==================================================
             * 2. og:image
             * ==================================================
             */

            const ogPatterns = [
              /property=["']og:image["'][^>]*content=["']([^"']+)["']/i,
              /content=["']([^"']+)["'][^>]*property=["']og:image["']/i
            ];

            for (const patron of ogPatterns) {

              const x = pagina.match(patron);

              if (!x) continue;

              const url = absoluto(
                x[1]
                  .replace(/&amp;/gi, "&")
                  .trim()
              );

              if (esImagenValida(url)) {
                return url;
              }
            }

            /*
             * ==================================================
             * 3. twitter:image
             * ==================================================
             */

            const twitterPatterns = [
              /name=["']twitter:image["'][^>]*content=["']([^"']+)["']/i,
              /content=["']([^"']+)["'][^>]*name=["']twitter:image["']/i
            ];

            for (const patron of twitterPatterns) {

              const x = pagina.match(patron);

              if (!x) continue;

              const url = absoluto(
                x[1]
                  .replace(/&amp;/gi, "&")
                  .trim()
              );

              if (esImagenValida(url)) {
                return url;
              }
            }

            return "";
          }

          /*
           * ==================================================
           * EXTRAER ARTÍCULOS
           * ==================================================
           */

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while (
            (m = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link = absoluto(m[1]);

            link = link.split("#")[0];

            if (
              !link.startsWith(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!/\.html$/i.test(link)) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            const titulo = limpiar(m[2]);

            if (!titulo || titulo.length < 15) {
              continue;
            }

            if (
              titulo
                .toLowerCase()
                .trim() === "comentarios"
            ) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          /*
           * ==================================================
           * DESCARGAR CADA ARTÍCULO Y BUSCAR SU PROPIA IMAGEN
           * ==================================================
           */

          const resultado = [];

          for (let i = 0; i < noticias.length; i++) {

            const noticia = noticias[i];

            const archivo =
              `articulo-${i}.html`;

            let articulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              articulo =
                fs.readFileSync(
                  archivo,
                  "utf8"
                );

            } catch (error) {

              console.log(
                "No se pudo descargar:",
                noticia.link
              );
            }

            const imagen =
              extraerImagenArticulo(articulo);

            console.log("");
            console.log("NOTICIA:");
            console.log(noticia.titulo);
            console.log("IMAGEN:");
            console.log(imagen || "NINGUNA");

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          /*
           * ==================================================
           * GUARDAR JSON
           * ==================================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "noticias-870.json generado correctamente."
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-870.json",
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío."
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() === "comentarios"
            ) {
              throw new Error(
                "Se ha encontrado 'comentarios' como noticia."
              );
            }

            if (
              noticia.imagen &&
              (
                noticia.imagen.includes("/avatars/") ||
                noticia.imagen.includes("/social/img/") ||
                noticia.imagen.includes("/iconos/") ||
                noticia.imagen.includes("pixel") ||
                noticia.imagen.includes("contabilizacion") ||
                noticia.imagen.includes("elmundo.png")
              )
            ) {
              throw new Error(
                "Imagen incorrecta detectada: " +
                noticia.imagen
              );
            }
          }

          console.log(
            "JSON válido."
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
