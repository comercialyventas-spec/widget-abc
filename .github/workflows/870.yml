name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar índice de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          function decodificar(buffer) {
            let texto = buffer.toString("utf8");

            if (texto.includes("�")) {
              texto = buffer.toString("latin1");
            }

            return texto;
          }

          function limpiar(texto) {
            return String(texto || "")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            url = String(url || "")
              .replace(/&amp;/gi, "&")
              .replace(/\\u002F/g, "/")
              .trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("http://")) {
              return "https://" + url.substring(7);
            }

            if (url.startsWith("https://")) {
              return url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function imagenArticulo(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (!/imagenes_posts/i.test(u)) {
              return false;
            }

            if (!/\.(jpg|jpeg|png|webp)(?:[?#].*)?$/i.test(u)) {
              return false;
            }

            return true;
          }

          /*
           * Busca EXCLUSIVAMENTE imágenes pertenecientes
           * al sistema antiguo de imágenes del blog.
           */
          function extraerImagen(pagina) {

            const urls = [];

            /*
             * URL absoluta.
             */
            const absoluta =
              /https?:\/\/[^"'<> \t\r\n]+\/blogs\/elmundo\/clima\/imagenes_posts\/[^"'<> \t\r\n]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<> \t\r\n]*)?/gi;

            let m;

            while ((m = absoluta.exec(pagina)) !== null) {
              urls.push(m[0]);
            }

            /*
             * URL que empieza directamente por /blogs/...
             */
            const relativa =
              /\/blogs\/elmundo\/clima\/imagenes_posts\/[^"'<> \t\r\n]+?\.(?:jpg|jpeg|png|webp)(?:[?#][^"'<> \t\r\n]*)?/gi;

            while ((m = relativa.exec(pagina)) !== null) {
              urls.push(m[0]);
            }

            /*
             * Eliminar duplicados manteniendo orden.
             */
            const unicas = [...new Set(urls)];

            /*
             * Preferimos las imágenes grandes.
             */
            unicas.sort((a, b) => {

              const score = url => {
                let s = 0;

                if (/635x/i.test(url)) s += 100;
                if (/540x/i.test(url)) s += 80;
                if (/640x/i.test(url)) s += 80;
                if (/1200x/i.test(url)) s += 70;

                return s;
              };

              return score(b) - score(a);
            });

            for (const url of unicas) {

              const finalUrl = absoluto(url);

              if (imagenArticulo(finalUrl)) {
                return finalUrl;
              }
            }

            return "";
          }

          /*
           * =====================================================
           * OBTENER LOS 6 ARTÍCULOS
           * =====================================================
           */

          const htmlBuffer =
            fs.readFileSync("pagina.html");

          const html =
            decodificar(htmlBuffer);

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while (
            (m = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link = absoluto(m[1]);

            link = link.split("#")[0];

            if (
              !link.startsWith(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!/\.html$/i.test(link)) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            let titulo = limpiar(m[2]);

            if (!titulo || titulo.length < 15) {
              continue;
            }

            if (
              titulo.toLowerCase() === "comentarios"
            ) {
              continue;
            }

            /*
             * Evitar enlaces cuyo texto sea únicamente
             * comentarios aunque lleven más contenido.
             */
            if (
              /^comentarios$/i.test(titulo)
            ) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          /*
           * =====================================================
           * DESCARGAR CADA ARTÍCULO
           * =====================================================
           */

          const resultado = [];

          for (let i = 0; i < noticias.length; i++) {

            const noticia = noticias[i];

            const archivo =
              `articulo-${i}.html`;

            let articulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              const buffer =
                fs.readFileSync(archivo);

              articulo =
                decodificar(buffer);

            } catch (error) {

              console.log(
                "No se pudo descargar:",
                noticia.link
              );
            }

            const imagen =
              extraerImagen(articulo);

            console.log("");
            console.log("================================");
            console.log("TÍTULO:", noticia.titulo);
            console.log("ENLACE:", noticia.link);
            console.log(
              "IMAGEN:",
              imagen || "NINGUNA"
            );
            console.log("================================");

            resultado.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          /*
           * =====================================================
           * GUARDAR JSON
           * =====================================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "OK: noticias-870.json generado."
          );
          console.log(
            "Noticias:",
            resultado.length
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-870.json",
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío."
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título."
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace."
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() === "comentarios"
            ) {
              throw new Error(
                "Se ha encontrado comentarios como noticia."
              );
            }

            if (noticia.imagen) {

              if (
                !noticia.imagen.includes(
                  "/blogs/elmundo/clima/imagenes_posts/"
                )
              ) {
                throw new Error(
                  "La imagen no pertenece a imagenes_posts: " +
                  noticia.imagen
                );
              }
            }
          }

          console.log(
            "JSON válido."
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
