name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            -H "Accept: text/html,application/xhtml+xml" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");

          const portada = fs.readFileSync("pagina.html");

          function textoUtf8(buffer) {
            let s = buffer.toString("utf8");

            /*
             * Si aparecen caracteres de reemplazo, intentamos
             * reconstruir el texto desde Windows-1252.
             */
            if (s.includes("�")) {
              try {
                const decoder = new TextDecoder("windows-1252");
                const alternativo = decoder.decode(buffer);

                if (
                  !alternativo.includes("�") &&
                  alternativo.length > 0
                ) {
                  s = alternativo;
                }
              } catch (_) {}
            }

            return s;
          }

          const html = textoUtf8(portada);

          function decodeHtml(texto) {
            return String(texto || "")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              );
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<svg[\s\S]*?<\/svg>/gi, " ")
                .replace(/<[^>]+>/g, " ")
            )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            if (!url) return "";

            url = decodeHtml(url)
              .replace(/\\u0026/g, "&")
              .trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function esImagenValida(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (
              u.includes("pixel.gif") ||
              u.includes("contabilizacionaccesos") ||
              u.includes("tracking") ||
              u.includes("tracker") ||
              u.includes("/pixel") ||
              u.includes("spacer.gif") ||
              u.includes("blank.gif") ||
              u.includes("transparent.gif")
            ) {
              return false;
            }

            if (
              u.includes("logo") ||
              u.includes("icon") ||
              u.includes("avatar") ||
              u.includes("sprite")
            ) {
              return false;
            }

            return (
              /\.(jpg|jpeg|png|webp)(\?|$)/i.test(u)
            );
          }

          function limpiarUrlImagen(url) {
            if (!url) return "";

            url = absoluto(url);

            /*
             * Algunas páginas antiguas tienen entidades HTML
             * dentro de las URL.
             */
            url = url
              .replace(/&amp;/gi, "&")
              .replace(/\\u0026/g, "&")
              .trim();

            return esImagenValida(url)
              ? url
              : "";
          }

          function atributo(bloque, nombre) {
            const patron = new RegExp(
              nombre + "\\s*=\\s*[\"']([^\"']+)[\"']",
              "i"
            );

            const m = bloque.match(patron);

            return m
              ? limpiarUrlImagen(m[1])
              : "";
          }

          /*
           * Busca imágenes reales dentro de UNA página.
           * Se da prioridad a las imágenes antiguas de los blogs
           * de El Mundo.
           */
          function buscarImagen(pagina) {

            let m;

            /*
             * 1. Ruta histórica de imágenes de posts.
             */
            m = pagina.match(
              /https?:\/\/[^"'<>\\s]+\/imagenes_posts\/[^"'<>\\s]+\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/i
            );

            if (m) {
              const img = limpiarUrlImagen(m[0]);
              if (img) return img;
            }

            /*
             * 2. og:image
             */
            m = pagina.match(
              /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i
            );

            if (m) {
              const img = limpiarUrlImagen(m[1]);
              if (img) return img;
            }

            m = pagina.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i
            );

            if (m) {
              const img = limpiarUrlImagen(m[1]);
              if (img) return img;
            }

            /*
             * 3. twitter:image
             */
            m = pagina.match(
              /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i
            );

            if (m) {
              const img = limpiarUrlImagen(m[1]);
              if (img) return img;
            }

            m = pagina.match(
              /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i
            );

            if (m) {
              const img = limpiarUrlImagen(m[1]);
              if (img) return img;
            }

            /*
             * 4. data-src / data-original / data-lazy-src.
             */
            const atributos = [
              "data-src",
              "data-original",
              "data-lazy-src"
            ];

            for (const nombre of atributos) {
              const patron =
                new RegExp(
                  nombre +
                  "\\s*=\\s*[\"']([^\"']+)[\"']",
                  "gi"
                );

              while ((m = patron.exec(pagina)) !== null) {
                const img =
                  limpiarUrlImagen(m[1]);

                if (img) return img;
              }
            }

            /*
             * 5. img src.
             */
            const imgs =
              pagina.match(
                /<img\b[\s\S]*?>/gi
              ) || [];

            for (const bloque of imgs) {

              const img =
                atributo(bloque, "src");

              if (img) return img;
            }

            /*
             * 6. Último recurso: URLs de imágenes.
             * Excluimos completamente tracking/pixel.
             */
            const urls =
              pagina.match(
                /https?:\/\/[^"'<>\\s]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<>\\s]*)?/gi
              ) || [];

            for (const url of urls) {

              const img =
                limpiarUrlImagen(url);

              if (img) return img;
            }

            return "";
          }

          /*
           * ==========================================
           * EXTRAER ARTÍCULOS
           * ==========================================
           */

          const noticias = [];
          const vistos = new Set();

          const patron =
            /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while (
            (m = patron.exec(html)) !== null &&
            noticias.length < 6
          ) {

            let link =
              absoluto(m[1]);

            link =
              link.split("#")[0];

            if (
              !link.includes(
                "elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (
              link.endsWith("/clima") ||
              link.endsWith("/clima/")
            ) {
              continue;
            }

            if (
              !/\.html(?:\?.*)?$/i.test(link)
            ) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            let titulo =
              limpiar(m[2]);

            if (!titulo) {
              continue;
            }

            /*
             * Eliminar elementos de navegación.
             */
            if (
              /^comentarios$/i.test(titulo) ||
              /^leer más$/i.test(titulo) ||
              /^ver más$/i.test(titulo) ||
              /^compartir$/i.test(titulo) ||
              /^facebook$/i.test(titulo) ||
              /^twitter$/i.test(titulo)
            ) {
              continue;
            }

            if (titulo.length < 15) {
              continue;
            }

            vistos.add(link);

            noticias.push({
              titulo,
              link
            });
          }

          if (noticias.length === 0) {
            throw new Error(
              "No se encontraron artículos de tecnología/clima."
            );
          }

          /*
           * ==========================================
           * ABRIR CADA ARTÍCULO
           * ==========================================
           */

          const resultado = [];

          for (
            let i = 0;
            i < noticias.length;
            i++
          ) {

            const noticia =
              noticias[i];

            console.log("");
            console.log(
              "Artículo " +
              (i + 1) +
              ": " +
              noticia.titulo
            );

            console.log(
              "URL: " +
              noticia.link
            );

            const archivo =
              "articulo-" +
              i +
              ".html";

            let paginaArticulo = "";

            try {
              cp.execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  "-H",
                  "Accept: text/html,application/xhtml+xml",
                  "-H",
                  "Accept-Language: es-ES,es;q=0.9",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              const buffer =
                fs.readFileSync(
                  archivo
                );

              paginaArticulo =
                textoUtf8(buffer);

            } catch (error) {
              console.log(
                "No se pudo descargar el artículo."
              );
            }

            let imagen = "";

            if (paginaArticulo) {
              imagen =
                buscarImagen(
                  paginaArticulo
                );
            }

            /*
             * Seguridad adicional:
             * jamás guardar un pixel como imagen.
             */
            if (
              imagen &&
              !esImagenValida(imagen)
            ) {
              imagen = "";
            }

            console.log(
              "Imagen encontrada: " +
              (imagen || "NINGUNA")
            );

            resultado.push({
              titulo:
                noticia.titulo,
              link:
                noticia.link,
              imagen:
                imagen,
              tipo:
                imagen
                  ? "imagen"
                  : ""
            );
          }

          /*
           * ==========================================
           * ESCRIBIR JSON
           * ==========================================
           */

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: resultado
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "=========================================="
          );
          console.log(
            "noticias-870.json GENERADO"
          );
          console.log(
            "Artículos:",
            resultado.length
          );
          console.log(
            "=========================================="
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "noticias-870.json",
                "utf8"
              )
            );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío o es inválido"
            );
          }

          const enlaces = new Set();

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Hay una noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Hay una noticia sin enlace"
              );
            }

            if (
              noticia.titulo
                .trim()
                .toLowerCase() === "comentarios"
            ) {
              throw new Error(
                "Se ha detectado 'comentarios' como noticia."
              );
            }

            if (
              enlaces.has(noticia.link)
            ) {
              throw new Error(
                "Hay enlaces duplicados."
              );
            }

            enlaces.add(noticia.link);

            if (
              noticia.imagen &&
              (
                noticia.imagen
                  .toLowerCase()
                  .includes("pixel.gif") ||
                noticia.imagen
                  .toLowerCase()
                  .includes("contabilizacionaccesos")
              )
            ) {
              throw new Error(
                "Se ha detectado una imagen de tracking."
              );
            }
          }

          console.log(
            "JSON 870 válido."
          );

          console.log(
            "Noticias:",
            data.noticias.length
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
