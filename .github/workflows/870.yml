name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar página de El Mundo
        run: |
          curl -L --fail \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            "http://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

          echo "Página descargada:"
          wc -c pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("pagina.html", "utf8");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCharCode(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCharCode(parseInt(n, 16))
              );
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]*>/g, " ")
            )
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            if (!url) return "";

            url = decodeHtml(url).trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "http://www.elmundo.es" + url;
            }

            return url;
          }

          function buscarAtributo(bloque, atributo) {
            const re = new RegExp(
              atributo + "\\s*=\\s*[\"']([^\"']+)[\"']",
              "i"
            );

            const m = bloque.match(re);

            return m ? absoluto(m[1]) : "";
          }

          function buscarImagen(bloque) {

            let imagen = buscarAtributo(bloque, "src");
            if (imagen) return imagen;

            imagen = buscarAtributo(bloque, "data-src");
            if (imagen) return imagen;

            imagen = buscarAtributo(bloque, "data-original");
            if (imagen) return imagen;

            imagen = buscarAtributo(bloque, "data-lazy-src");
            if (imagen) return imagen;

            imagen = buscarAtributo(bloque, "data-image");
            if (imagen) return imagen;

            const og = bloque.match(
              /property\s*=\s*["']og:image["'][^>]+content\s*=\s*["']([^"']+)["']/i
            );

            if (og) return absoluto(og[1]);

            const og2 = bloque.match(
              /content\s*=\s*["']([^"']+)["'][^>]+property\s*=\s*["']og:image["']/i
            );

            if (og2) return absoluto(og2[1]);

            const imagenes = bloque.match(
              /https?:\/\/[^"'<> \s]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<> ]*)?/gi
            );

            if (imagenes && imagenes.length) {
              return imagenes[0];
            }

            return "";
          }

          const noticias = [];
          const vistos = new Set();

          /*
           * Buscamos enlaces que pertenezcan al blog clima.
           */
          const patronEnlace =
            /<a\b[^>]*href\s*=\s*["']([^"']*\/blogs\/elmundo\/clima\/[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let match;

          while ((match = patronEnlace.exec(html)) !== null) {

            if (noticias.length >= 6) break;

            let link = absoluto(match[1]);
            let bloque = match[0];
            let contenido = match[2];

            if (!link) continue;

            /*
             * Ignoramos enlaces generales del propio blog.
             */
            if (
              link.endsWith("/clima/") ||
              link.endsWith("/clima")
            ) {
              continue;
            }

            /*
             * Título.
             */
            let titulo = limpiar(contenido);

            /*
             * Si el enlace contiene elementos HTML, intentamos
             * localizar también un título en atributos.
             */
            if (!titulo || titulo.length < 10) {

              const titleAttr = buscarAtributo(bloque, "title");

              if (titleAttr) {
                titulo = limpiar(titleAttr);
              }
            }

            if (!titulo || titulo.length < 10) {
              continue;
            }

            /*
             * Evitar duplicados.
             */
            if (vistos.has(link)) {
              continue;
            }

            vistos.add(link);

            /*
             * Imagen asociada al bloque del enlace.
             */
            let imagen = buscarImagen(bloque);

            /*
             * Si el enlace no contiene imagen, buscamos alrededor
             * del enlace, porque algunas versiones antiguas de
             * El Mundo colocaban la imagen fuera del <a>.
             */
            if (!imagen) {

              const posicion = match.index;

              const inicio = Math.max(0, posicion - 1500);
              const fin = Math.min(
                html.length,
                posicion + bloque.length + 1500
              );

              const contexto = html.slice(inicio, fin);

              imagen = buscarImagen(contexto);
            }

            noticias.push({
              titulo: titulo,
              link: link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          }

          /*
           * Si el HTML utiliza otra estructura, buscamos directamente
           * URLs de artículos del blog.
           */
          if (noticias.length < 6) {

            const patronUrl =
              /https?:\/\/(?:www\.)?elmundo\.es\/blogs\/elmundo\/clima\/[^"'<> \s]+/gi;

            const urls = html.match(patronUrl) || [];

            for (const urlOriginal of urls) {

              if (noticias.length >= 6) break;

              const link = urlOriginal.replace(/&amp;/gi, "&");

              if (vistos.has(link)) continue;

              vistos.add(link);

              /*
               * No podemos garantizar un título desde una URL aislada,
               * así que solo añadimos el artículo si encontramos un
               * bloque razonable alrededor de él.
               */
              const posicion = html.indexOf(urlOriginal);

              const inicio = Math.max(0, posicion - 1200);
              const fin = Math.min(
                html.length,
                posicion + 1800
              );

              const contexto = html.slice(inicio, fin);

              let titulo = "";

              const titleMatch = contexto.match(
                /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i
              );

              if (titleMatch) {
                titulo = limpiar(titleMatch[1]);
              }

              if (!titulo) {
                const titleAttr = contexto.match(
                  /title\s*=\s*["']([^"']+)["']/i
                );

                if (titleAttr) {
                  titulo = limpiar(titleAttr[1]);
                }
              }

              if (!titulo || titulo.length < 10) {
                continue;
              }

              const imagen = buscarImagen(contexto);

              noticias.push({
                titulo: titulo,
                link: link,
                imagen: imagen,
                tipo: imagen ? "imagen" : ""
              });
            }
          }

          /*
           * Limpiar posibles duplicados finales.
           */
          const finales = [];
          const linksFinales = new Set();

          for (const noticia of noticias) {

            if (finales.length >= 6) break;

            if (linksFinales.has(noticia.link)) {
              continue;
            }

            linksFinales.add(noticia.link);

            finales.push(noticia);
          }

          if (finales.length === 0) {
            throw new Error(
              "No se encontraron artículos de El Mundo."
            );
          }

          const resultado = {
            noticias: finales
          };

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(resultado, null, 2),
            "utf8"
          );

          console.log(
            "Generado noticias-870.json con",
            finales.length,
            "noticias."
          );

          console.log(
            JSON.stringify(resultado, null, 2)
          );
          NODE

      - name: Validar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("noticias-870.json", "utf8")
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "noticias-870.json está vacío o es inválido"
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Hay una noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Hay una noticia sin enlace"
              );
            }
          }

          console.log("JSON válido.");
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
