name: Actualizar noticias-870

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar página
        run: |
          curl -L --fail --max-time 30 \
            -A "Mozilla/5.0" \
            "https://www.elmundo.es/blogs/elmundo/clima/" \
            -o pagina.html

      - name: Generar noticias-870.json
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const html = fs.readFileSync("pagina.html", "utf8");

          function limpiar(s) {
            return String(s || "")
              .replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<style[\s\S]*?<\/style>/gi, "")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, function(_, n) {
                return String.fromCharCode(Number(n));
              })
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluto(url) {
            url = String(url || "").trim();

            if (url.startsWith("//")) {
              return "https:" + url;
            }

            if (url.startsWith("/")) {
              return "https://www.elmundo.es" + url;
            }

            return url;
          }

          function imagenValida(url) {
            if (!url) return false;

            const u = url.toLowerCase();

            if (u.includes("pixel.gif")) return false;
            if (u.includes("contabilizacionaccesos")) return false;
            if (u.includes("tracking")) return false;
            if (u.includes("tracker")) return false;
            if (u.includes("spacer")) return false;
            if (u.includes("transparent")) return false;

            return /\.(jpg|jpeg|png|webp)(\?|$)/i.test(u);
          }

          function buscarImagen(pagina) {

            let m;

            /*
             * Primero buscamos las imágenes antiguas
             * específicas de los blogs de El Mundo.
             */
            m = pagina.match(
              /https?:\/\/[^"' ]+\/imagenes_posts\/[^"' ]+\.(jpg|jpeg|png|webp)/i
            );

            if (m && imagenValida(m[0])) {
              return m[0];
            }

            /*
             * Después buscamos og:image.
             */
            m = pagina.match(
              /property=["']og:image["'][^>]*content=["']([^"']+)["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenValida(url)) {
                return url;
              }
            }

            m = pagina.match(
              /content=["']([^"']+)["'][^>]*property=["']og:image["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenValida(url)) {
                return url;
              }
            }

            /*
             * Twitter image.
             */
            m = pagina.match(
              /name=["']twitter:image["'][^>]*content=["']([^"']+)["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenValida(url)) {
                return url;
              }
            }

            /*
             * data-src.
             */
            m = pagina.match(
              /data-src=["']([^"']+)["']/i
            );

            if (m) {
              const url = absoluto(m[1]);

              if (imagenValida(url)) {
                return url;
              }
            }

            /*
             * img src.
             */
            const imgs = pagina.match(
              /<img[^>]+src=["']([^"']+)["']/gi
            ) || [];

            for (const img of imgs) {

              const x = img.match(
                /src=["']([^"']+)["']/i
              );

              if (!x) continue;

              const url = absoluto(x[1]);

              if (imagenValida(url)) {
                return url;
              }
            }

            return "";
          }

          /*
           * Buscar enlaces de artículos.
           */
          const enlaces = [];
          const vistos = new Set();

          const patron =
            /<a[^>]+href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

          let m;

          while ((m = patron.exec(html)) !== null) {

            let link = absoluto(m[1]);

            link = link.split("#")[0];

            if (
              !link.includes(
                "https://www.elmundo.es/blogs/elmundo/clima/"
              )
            ) {
              continue;
            }

            if (!link.endsWith(".html")) {
              continue;
            }

            if (vistos.has(link)) {
              continue;
            }

            const titulo = limpiar(m[2]);

            if (!titulo) {
              continue;
            }

            if (titulo.toLowerCase() === "comentarios") {
              continue;
            }

            if (titulo.length < 15) {
              continue;
            }

            vistos.add(link);

            enlaces.push({
              titulo: titulo,
              link: link
            });

            if (enlaces.length >= 6) {
              break;
            }
          }

          if (enlaces.length === 0) {
            throw new Error(
              "No se encontraron artículos."
            );
          }

          /*
           * Abrimos cada artículo por separado para obtener
           * SU propia imagen.
           */
          const noticias = [];

          enlaces.forEach(function(noticia, indice) {

            const archivo =
              "articulo-" + indice + ".html";

            let paginaArticulo = "";

            try {

              execFileSync(
                "curl",
                [
                  "-L",
                  "--fail",
                  "--max-time",
                  "30",
                  "-A",
                  "Mozilla/5.0",
                  noticia.link,
                  "-o",
                  archivo
                ],
                {
                  stdio: "ignore"
                }
              );

              paginaArticulo =
                fs.readFileSync(
                  archivo,
                  "utf8"
                );

            } catch (e) {
              console.log(
                "No se pudo descargar:",
                noticia.link
              );
            }

            const imagen =
              buscarImagen(paginaArticulo);

            console.log("");
            console.log(noticia.titulo);
            console.log("Imagen:", imagen || "NINGUNA");

            noticias.push({
              titulo: noticia.titulo,
              link: noticia.link,
              imagen: imagen,
              tipo: imagen ? "imagen" : ""
            });
          });

          fs.writeFileSync(
            "noticias-870.json",
            JSON.stringify(
              {
                noticias: noticias
              },
              null,
              2
            ),
            "utf8"
          );

          console.log("");
          console.log(
            "OK: noticias-870.json generado con " +
            noticias.length +
            " noticias."
          );
          NODE

      - name: Validar JSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "noticias-870.json",
              "utf8"
            )
          );

          if (
            !data.noticias ||
            !Array.isArray(data.noticias) ||
            data.noticias.length === 0
          ) {
            throw new Error(
              "JSON vacío o inválido"
            );
          }

          for (const noticia of data.noticias) {

            if (!noticia.titulo) {
              throw new Error(
                "Noticia sin título"
              );
            }

            if (!noticia.link) {
              throw new Error(
                "Noticia sin enlace"
              );
            }

            if (
              noticia.imagen &&
              noticia.imagen.includes(
                "pixel.gif"
              )
            ) {
              throw new Error(
                "Se ha detectado pixel.gif"
              );
            }

            if (
              noticia.imagen &&
              noticia.imagen.includes(
                "contabilizacionaccesos"
              )
            ) {
              throw new Error(
                "Se ha detectado una imagen de tracking"
              );
            }
          }

          console.log(
            "JSON válido."
          );

          console.log(
            JSON.stringify(
              data,
              null,
              2
            )
          );
          NODE

      - name: Guardar noticias-870.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-870.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar noticias-870"
            git push
          fi
