name: Desplegar conector Blogger (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "conector-blogger/**"
      - ".github/workflows/desplegar-conector-blogger.yml"
  workflow_dispatch:

concurrency:
  group: conector-blogger
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conector-blogger
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Almacen de copias (KV) - crear si no existe y enlazarlo
        run: |
          CUENTA=a9381cc56c9174783f6b95c9bc8a175e
          TITULO=conector-blogger-copias
          API=https://api.cloudflare.com/client/v4/accounts/$CUENTA/storage/kv/namespaces
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | jq -r --arg t "$TITULO" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"title\":\"$TITULO\"}" "$API" | jq -r '.result.id')
            echo "KV creado: $ID"
          else
            echo "KV ya existia: $ID"
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "::error::No se pudo obtener el KV de copias"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "COPIAS"\nid = "%s"\n' "$ID" >> wrangler.toml
          cat wrangler.toml
      - name: Publicar el Worker
        run: npx --yes wrangler@4 deploy
      - name: Guardar secretos en el Worker
        env:
          S_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          S_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          S_REFRESH: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          S_CLAVE: ${{ secrets.MCP_CLAVE }}
        run: |
          printf '%s' "$S_CLIENT_ID"     | npx --yes wrangler@4 secret put BLOGGER_CLIENT_ID
          printf '%s' "$S_CLIENT_SECRET" | npx --yes wrangler@4 secret put BLOGGER_CLIENT_SECRET
          printf '%s' "$S_REFRESH"       | npx --yes wrangler@4 secret put BLOGGER_REFRESH_TOKEN
          if [ -n "$S_CLAVE" ]; then
            printf '%s' "$S_CLAVE" | npx --yes wrangler@4 secret put MCP_CLAVE
          else
            echo "::warning::Falta el secreto MCP_CLAVE en GitHub: el conector no aceptará conexiones hasta que exista."
          fi
