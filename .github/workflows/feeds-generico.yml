name: Actualizar feeds genéricos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Procesar todos los feeds
        env:
          LISTAR_FEEDS_URL: "https://script.google.com/macros/s/AKfycbw3CPo21pjeJ6Iom59N0glwaJuxC75FknVtX7Et5PgHoplWz33GjcH4Jble_uh6Pw0/exec"
          LISTAR_FEEDS_TOKEN: ${{ secrets.LISTAR_FEEDS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)));
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<!\[CDATA\[/g, "")
                .replace(/\]\]>/g, "")
                .replace(/<[^>]+>/g, " ")
            ).replace(/\s+/g, " ").trim();
          }

          function extraerTag(bloque, tag) {
            const regex = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)<\\/" + tag + ">", "i");
            const m = bloque.match(regex);
            return m ? m[1] : "";
          }

          function extraerAtributo(bloque, tag, atributo) {
            const regex = new RegExp("<" + tag + "[^>]*\\b" + atributo + "\\s*=\\s*(['\"])(.*?)\\1[^>]*\\/?>", "i");
            const m = bloque.match(regex);
            return m ? m[2] : "";
          }

          function parsearRss(xml) {
            const itemsRaw = xml.match(/<item\b[\s\S]*?<\/item>/gi) || [];
            const noticias = [];

            for (const bloque of itemsRaw.slice(0, 6)) {
              const titulo = limpiar(extraerTag(bloque, "title"));
              let link = decodeHtml(extraerTag(bloque, "link").trim()).split("#")[0].split("?")[0];
              if (!titulo || !link) continue;

              let imagen = "";
              const enclosureUrl = extraerAtributo(bloque, "enclosure", "url");
              const enclosureType = extraerAtributo(bloque, "enclosure", "type");
              if (enclosureUrl && (!enclosureType || /image/i.test(enclosureType))) imagen = enclosureUrl;
              if (!imagen) imagen = extraerAtributo(bloque, "media:content", "url");
              if (!imagen) imagen = extraerAtributo(bloque, "media:thumbnail", "url");
              if (!imagen) {
                const contentEncoded = extraerTag(bloque, "content:encoded") || extraerTag(bloque, "description");
                const imgMatch = contentEncoded.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp))[^"']*["']/i);
                if (imgMatch) imagen = imgMatch[1];
              }
              imagen = decodeHtml(imagen);

              noticias.push({ titulo, link, imagen, tipo: imagen ? "imagen" : "" });
            }
            return { noticias };
          }

          async function procesarFeed(feed) {
            const wid = feed.wid;
            const url = feed.url;

            try {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 6000);

              const respuesta = await fetch(url, {
                signal: controller.signal,
                headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" }
              });
              clearTimeout(timeout);

              if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);

              const texto = await respuesta.text();
              const trimmed = texto.trim();

              let resultado;
              if (trimmed.startsWith("{")) {
                const data = JSON.parse(trimmed);
                if (Array.isArray(data.noticias)) resultado = data;
                else throw new Error("JSON sin campo 'noticias' válido");
              } else {
                resultado = parsearRss(texto);
              }

              if (!resultado.noticias || resultado.noticias.length === 0) {
                throw new Error("Sin noticias extraídas");
              }

              const archivo = wid + ".json";
              const contenidoNuevo = JSON.stringify(resultado, null, 2);
              let contenidoAnterior = "";
              if (fs.existsSync(archivo)) contenidoAnterior = fs.readFileSync(archivo, "utf8");

              if (contenidoAnterior.trim() !== contenidoNuevo.trim()) {
                fs.writeFileSync(archivo, contenidoNuevo, "utf8");
                console.log("[" + wid + "] Actualizado (" + resultado.noticias.length + " noticias)");
                return "actualizado";
              } else {
                console.log("[" + wid + "] Sin cambios");
                return "sin_cambios";
              }

            } catch (error) {
              console.warn("[" + wid + "] ERROR: " + error.message);
              return "error";
            }
          }

          (async function () {
            const listarFeedsUrl = process.env.LISTAR_FEEDS_URL;
            const token = process.env.LISTAR_FEEDS_TOKEN;

            if (!listarFeedsUrl || !token) {
              throw new Error("Faltan LISTAR_FEEDS_URL o LISTAR_FEEDS_TOKEN.");
            }

            console.log("Obteniendo lista de feeds desde Apps Script...");

            const respuestaFeeds = await fetch(
              listarFeedsUrl + "?accion=listarFeeds&token=" + encodeURIComponent(token)
            );

            if (!respuestaFeeds.ok) {
              throw new Error("No se pudo obtener la lista de feeds: HTTP " + respuestaFeeds.status);
            }

            const config = await respuestaFeeds.json();
            const feeds = config.feeds || [];

            console.log("Total de feeds a procesar: " + feeds.length);

            let actualizados = 0, sinCambios = 0, errores = 0;
            const TAMANO_LOTE = 20;

            for (let i = 0; i < feeds.length; i += TAMANO_LOTE) {
              const lote = feeds.slice(i, i + TAMANO_LOTE);
              const resultados = await Promise.all(lote.map(procesarFeed));

              resultados.forEach(r => {
                if (r === "actualizado") actualizados++;
                else if (r === "sin_cambios") sinCambios++;
                else errores++;
              });

              console.log("Progreso: " + Math.min(i + TAMANO_LOTE, feeds.length) + "/" + feeds.length);
            }

            console.log("========================================");
            console.log("Actualizados: " + actualizados);
            console.log("Sin cambios: " + sinCambios);
            console.log("Con error: " + errores);
            console.log("========================================");
          })();

          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-*.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar feeds genéricos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
