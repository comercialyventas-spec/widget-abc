name: Actualizar feeds genéricos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Procesar todos los feeds
        env:
          LISTAR_FEEDS_URL: "https://script.google.com/macros/s/AKfycbw3CPo21pjeJ6Iom59N0glwaJuxC75FknVtX7Et5PgHoplWz33GjcH4Jble_uh6Pw0/exec"
          LISTAR_FEEDS_TOKEN: ${{ secrets.LISTAR_FEEDS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)));
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<!\[CDATA\[/g, "")
                .replace(/\]\]>/g, "")
                .replace(/<[^>]+>/g, " ")
            ).replace(/\s+/g, " ").trim();
          }

          function extraerTag(bloque, tag) {
            const regex = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)<\\/" + tag + ">", "i");
            const m = bloque.match(regex);
            return m ? m[1] : "";
          }

          function extraerAtributo(bloque, tag, atributo) {
            const regex = new RegExp("<" + tag + "[^>]*\\b" + atributo + "\\s*=\\s*(['\"])(.*?)\\1[^>]*\\/?>", "i");
            const m = bloque.match(regex);
            return m ? m[2] : "";
          }

          function parsearRss(xml) {
            const itemsRaw = xml.match(/<item\b[\s\S]*?<\/item>/gi) || [];
            const noticias = [];

            for (const bloque of itemsRaw.slice(0, 6)) {
              const titulo = limpiar(extraerTag(bloque, "title"));
              let link = decodeHtml(extraerTag(bloque, "link").trim()).split("#")[0].split("?")[0];
              if (!titulo || !link) continue;

              let imagen = "";
              const enclosureUrl = extraerAtributo(bloque, "enclosure", "url");
              const enclosureType = extraerAtributo(bloque, "enclosure", "type");
              if (enclosureUrl && (!enclosureType || /image/i.test(enclosureType))) imagen = enclosureUrl;
              if (!imagen) imagen = extraerAtributo(bloque, "media:content", "url");
              if (!imagen) imagen = extraerAtributo(bloque, "media:thumbnail", "url");
              if (!imagen) {
                const contentEncoded = extraerTag(bloque, "content:encoded") || extraerTag(bloque, "description");
                const imgMatch = contentEncoded.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp))[^"']*["']/i);
                if (imgMatch) imagen = imgMatch[1];
              }
              imagen = decodeHtml(imagen);

              noticias.push({ titulo, link, imagen, tipo: imagen ? "imagen" : "" });
            }
            return { noticias };
          }

          async function procesarFeed(feed, opciones) {
            const wid = feed.wid;
            const url = feed.url;
            const intentosMaximos = (opciones && opciones.intentosMaximos) || 1;
            const timeoutMs = (opciones && opciones.timeoutMs) || 6000;
            let intento = 1;

            while (true) {
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), timeoutMs);

                const respuesta = await fetch(url, {
                  signal: controller.signal,
                  headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" }
                });
                clearTimeout(timeout);

                // 17 sept: el semaforo de concurrencia de scraper_generico.php en el
                // NAS devuelve 503 cuando sus huecos (maximo 2 simultaneos) estan
                // ocupados. Antes eso se trataba como un fallo definitivo del feed en
                // este ciclo; ahora, solo para los feeds que pasan por el NAS,
                // reintentamos con una breve espera con jitter antes de rendirnos.
                if (respuesta.status === 503 && intento < intentosMaximos) {
                  const espera = 3000 + Math.floor(Math.random() * 2000);
                  console.warn("[" + wid + "] NAS ocupado (503), reintento " + intento + "/" + intentosMaximos + " en " + espera + "ms");
                  await new Promise(r => setTimeout(r, espera));
                  intento++;
                  continue;
                }

                if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);

                const texto = await respuesta.text();
                const trimmed = texto.trim();

                let resultado;
                if (trimmed.startsWith("{")) {
                  const data = JSON.parse(trimmed);
                  if (Array.isArray(data.noticias)) resultado = data;
                  else throw new Error("JSON sin campo 'noticias' válido");
                } else {
                  resultado = parsearRss(texto);
                }

                if (!resultado.noticias || resultado.noticias.length === 0) {
                  throw new Error("Sin noticias extraídas");
                }

                const archivo = wid + ".json";
                const contenidoNuevo = JSON.stringify(resultado, null, 2);
                let contenidoAnterior = "";
                if (fs.existsSync(archivo)) contenidoAnterior = fs.readFileSync(archivo, "utf8");

                if (contenidoAnterior.trim() !== contenidoNuevo.trim()) {
                  fs.writeFileSync(archivo, contenidoNuevo, "utf8");
                  console.log("[" + wid + "] Actualizado (" + resultado.noticias.length + " noticias)");
                  return "actualizado";
                } else {
                  console.log("[" + wid + "] Sin cambios");
                  return "sin_cambios";
                }

              } catch (error) {
                console.warn("[" + wid + "] ERROR: " + error.message);
                return "error";
              }
            }
          }

          async function procesarEnLotes(feeds, tamanoLote, opciones, contadores) {
            for (let i = 0; i < feeds.length; i += tamanoLote) {
              const lote = feeds.slice(i, i + tamanoLote);
              const resultados = await Promise.all(lote.map(f => procesarFeed(f, opciones)));

              resultados.forEach(r => {
                if (r === "actualizado") contadores.actualizados++;
                else if (r === "sin_cambios") contadores.sinCambios++;
                else contadores.errores++;
              });

              console.log("Progreso: " + Math.min(i + tamanoLote, feeds.length) + "/" + feeds.length);
            }
          }

          (async function () {
            const listarFeedsUrl = process.env.LISTAR_FEEDS_URL;
            const token = process.env.LISTAR_FEEDS_TOKEN;

            if (!listarFeedsUrl || !token) {
              throw new Error("Faltan LISTAR_FEEDS_URL o LISTAR_FEEDS_TOKEN.");
            }

            console.log("Obteniendo lista de feeds desde Apps Script...");

            const respuestaFeeds = await fetch(
              listarFeedsUrl + "?accion=listarFeeds&token=" + encodeURIComponent(token)
            );

            if (!respuestaFeeds.ok) {
              let cuerpoError = "";
              try {
                cuerpoError = await respuestaFeeds.text();
              } catch (e) {
                cuerpoError = "(no se pudo leer el cuerpo: " + e.message + ")";
              }
              console.error("========================================");
              console.error("CUERPO DE LA RESPUESTA DE ERROR (primeros 3000 caracteres):");
              console.error(cuerpoError.slice(0, 3000));
              console.error("========================================");
              throw new Error("No se pudo obtener la lista de feeds: HTTP " + respuestaFeeds.status);
            }

            const config = await respuestaFeeds.json();
            const feeds = config.feeds || [];

            // 17 sept: separamos los feeds que se sirven a traves del semaforo de
            // concurrencia del NAS (scraper_generico.php, maximo 2 huecos a la vez)
            // de los que van directos a la fuente original. Los del NAS se procesan
            // en lotes mas pequeños y con reintento ante 503; el resto sigue
            // exactamente igual que antes.
            const feedsNas = feeds.filter(f => f.url && f.url.includes("scraper_generico.php"));
            const feedsOtros = feeds.filter(f => !f.url || !f.url.includes("scraper_generico.php"));

            console.log("Total de feeds a procesar: " + feeds.length + " (NAS: " + feedsNas.length + ", otros: " + feedsOtros.length + ")");

            const contadores = { actualizados: 0, sinCambios: 0, errores: 0 };

            await procesarEnLotes(feedsOtros, 20, { intentosMaximos: 1, timeoutMs: 6000 }, contadores);
            await procesarEnLotes(feedsNas, 10, { intentosMaximos: 3, timeoutMs: 20000 }, contadores);

            console.log("========================================");
            console.log("Actualizados: " + contadores.actualizados);
            console.log("Sin cambios: " + contadores.sinCambios);
            console.log("Con error: " + contadores.errores);
            console.log("========================================");
          })();

          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-*.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar feeds genéricos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
