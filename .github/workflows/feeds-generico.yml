name: Actualizar feeds genéricos

on:
  workflow_dispatch:
  schedule:
    - cron: "3,33 * * * *"

# Grupo propio: en el grupo compartido widget-abc-git-write solo cabía 1 run en marcha + 1 en espera para todos los
# workflows, y GitHub cancelaba los que esperaban. El choque de pushes lo resuelven el paso de sincronizar y los reintentos.
concurrency:
  group: feeds-generico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Procesar todos los feeds
        env:
          LISTAR_FEEDS_URL: "https://script.google.com/macros/s/AKfycbw3CPo21pjeJ6Iom59N0glwaJuxC75FknVtX7Et5PgHoplWz33GjcH4Jble_uh6Pw0/exec"
          LISTAR_FEEDS_TOKEN: ${{ secrets.LISTAR_FEEDS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          function decodeHtml(text) {
            return String(text || "")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)));
          }

          function limpiar(texto) {
            return decodeHtml(
              String(texto || "")
                .replace(/<!\[CDATA\[/g, "")
                .replace(/\]\]>/g, "")
                .replace(/<[^>]+>/g, " ")
            ).replace(/\s+/g, " ").trim();
          }

          function extraerTag(bloque, tag) {
            const regex = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)<\\/" + tag + ">", "i");
            const m = bloque.match(regex);
            return m ? m[1] : "";
          }

          function extraerAtributo(bloque, tag, atributo) {
            const regex = new RegExp("<" + tag + "[^>]*\\b" + atributo + "\\s*=\\s*(['\"])(.*?)\\1[^>]*\\/?>", "i");
            const m = bloque.match(regex);
            return m ? m[2] : "";
          }

          // 17 sept: muchos periodicos cargan la imagen "en diferido" (lazy
          // loading) - el <img> del HTML/RSS no trae la URL real en "src"
          // sino en "data-src" o en un "srcset" (o dentro de un <picture>
          // con <source srcset="...">). Antes solo mirabamos src="...jpg",
          // asi que estos casos se quedaban sin imagen aunque el dato SI
          // estaba presente en el contenido. Ampliamos la busqueda, en
          // orden de preferencia, antes de rendirnos.
          function extraerImagenInline(bloque) {
            const contenido = extraerTag(bloque, "content:encoded") || extraerTag(bloque, "description");
            if (!contenido) return "";

            let m = contenido.match(/<img[^>]+\bsrc\s*=\s*["']([^"']+\.(?:jpg|jpeg|png|webp|gif))[^"']*["']/i);
            if (m) return m[1];

            m = contenido.match(/<img[^>]+\bdata-src\s*=\s*["']([^"']+\.(?:jpg|jpeg|png|webp|gif))[^"']*["']/i);
            if (m) return m[1];

            m = contenido.match(/<(?:img|source)[^>]+\b(?:data-)?srcset\s*=\s*["']([^"',\s]+)/i);
            if (m) return m[1];

            m = contenido.match(/https?:\/\/[^\s"'<>]+\.(?:jpg|jpeg|png|webp)/i);
            if (m) return m[0];

            return "";
          }

          // 17 sept: ultimo recurso cuando el feed no trae imagen en ningun
          // sitio reconocible - visitamos la propia pagina del articulo.
          // 25 oct: ademas de og:image se mira og:image:secure_url, twitter:image
          // y, si no hay ninguna (p. ej. dsca.gob.es, Consumo), la primera foto real
          // del contenido (sin logos, iconos ni svg). Y se guarda lo encontrado en
          // .cache-imagenes.json para no volver a visitar el mismo articulo en cada
          // pasada: el presupuesto de 250 visitas se gasta solo en noticias nuevas.
          let presupuestoOgImage = 250;
          const RUTA_CACHE_IMG = ".cache-imagenes.json";
          const DIAS_CACHE_VACIA = 3;   // si no se encontro foto, se reintenta pasados 3 dias
          const MAX_CACHE_IMG = 8000;
          let cacheImg = {};
          try { cacheImg = JSON.parse(fs.readFileSync(RUTA_CACHE_IMG, "utf8")); } catch (e) { cacheImg = {}; }
          let cacheImgCambiada = false;

          function guardarCacheImagenes() {
            if (!cacheImgCambiada) return;
            const claves = Object.keys(cacheImg);
            if (claves.length > MAX_CACHE_IMG) {
              claves.sort((a, b) => (cacheImg[a].t || 0) - (cacheImg[b].t || 0));
              for (const k of claves.slice(0, claves.length - MAX_CACHE_IMG)) delete cacheImg[k];
            }
            fs.writeFileSync(RUTA_CACHE_IMG, JSON.stringify(cacheImg));
          }

          function metaContenido(html, nombre) {
            const n = nombre.replace(/:/g, "\\:");
            let m = html.match(new RegExp("<meta[^>]+(?:property|name)=[\"']" + n + "[\"'][^>]+content=[\"']([^\"']+)[\"']", "i"));
            if (!m) m = html.match(new RegExp("<meta[^>]+content=[\"']([^\"']+)[\"'][^>]+(?:property|name)=[\"']" + n + "[\"']", "i"));
            return m ? decodeHtml(m[1]).trim() : "";
          }

          const IMG_DESCARTE = /(^|[\/_.-])(logo|logos|icon|icons|sprite|avatar|favicon|placeholder|spinner)([\/_.-]|$)|\.svg(\?|$)|^data:/i;
          function primeraFotoContenido(html, base) {
            const zona = (html.match(/<article\b[\s\S]*?<\/article>/i) || html.match(/<main\b[\s\S]*?<\/main>/i) || [html])[0];
            const imgs = zona.match(/<img\b[^>]*>/gi) || [];
            for (const tag of imgs) {
              const m = tag.match(/\b(?:data-src|src)\s*=\s*["']([^"']+)["']/i);
              if (!m) continue;
              const src = decodeHtml(m[1]);
              if (IMG_DESCARTE.test(src) || !/\.(jpe?g|png|webp)(\?|$)/i.test(src)) continue;
              try { return new URL(src, base).href; } catch (e) {}
            }
            return "";
          }

          async function obtenerImagenOg(url, timeoutMs) {
            if (!url) return "";
            const c = cacheImg[url];
            if (c && (c.img || Date.now() - (c.t || 0) < DIAS_CACHE_VACIA * 86400000)) return c.img || "";
            if (presupuestoOgImage <= 0) return "";
            presupuestoOgImage--;
            let img = "";
            try {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), timeoutMs);
              const respuesta = await fetch(url, {
                signal: controller.signal,
                headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" }
              });
              clearTimeout(timeout);
              if (!respuesta.ok) return "";   // error de la web: no se anota, se reintenta en la proxima pasada
              const html = await respuesta.text();
              img = metaContenido(html, "og:image") || metaContenido(html, "og:image:secure_url") ||
                    metaContenido(html, "twitter:image") || metaContenido(html, "twitter:image:src") ||
                    primeraFotoContenido(html, url);
              if (img && !/^https?:\/\//i.test(img)) { try { img = new URL(img, url).href; } catch (e) { img = ""; } }
              if (img && IMG_DESCARTE.test(img)) img = "";
            } catch (error) {
              return "";
            }
            cacheImg[url] = { img, t: Date.now() };
            cacheImgCambiada = true;
            return img;
          }

          // 25 oct: titulos que son en realidad paginas de error o de bloqueo
          // (p. ej. EFE devolvio "429 Too Many Requests" y se guardo como noticias).
          const TITULO_ERROR = /^\s*(4\d\d|5\d\d)\s+(too many|forbidden|not found|unauthorized|bad (request|gateway)|internal server|service unavailable|gateway time)|^\s*(error:?\s*)?(too many requests|access denied|403 forbidden|just a moment|attention required|are you a robot|the request could not be satisfied|enable javascript|p[aá]gina no encontrada|page not found|service unavailable|error 40[34])\b/i;
          function esTituloError(t) { return TITULO_ERROR.test(String(t || "")); }

          // 4 oct: algunos feeds (p. ej. los RSS antiguos de El Mundo) vienen en ISO-8859-1 y
          // .text() los leia siempre como UTF-8, rompiendo los acentos ("teor�a"). Ahora, solo si
          // el feed declara una codificacion latina (cabecera Content-Type o <?xml encoding="...">),
          // se lee con esa codificacion. Los feeds en UTF-8 o sin declaracion se leen igual que antes.
          const CODIFICACIONES_LATINAS = /^(iso-8859-1|iso-8859-15|latin-?1|windows-1252|cp1252)$/i;
          async function leerTextoFeed(respuesta) {
            const bytes = Buffer.from(await respuesta.arrayBuffer());
            const tipo = respuesta.headers.get("content-type") || "";
            const mCabecera = tipo.match(/charset\s*=\s*["']?([\w.-]+)/i);
            const mXml = bytes.subarray(0, 300).toString("latin1").match(/^\s*<\?xml[^>]*encoding\s*=\s*["']([\w.-]+)["']/i);
            const declarada = mCabecera ? mCabecera[1] : (mXml ? mXml[1] : "");
            if (CODIFICACIONES_LATINAS.test(declarada)) {
              try { return new TextDecoder(declarada.toLowerCase()).decode(bytes); }
              catch (e) { return new TextDecoder("windows-1252").decode(bytes); }
            }
            return new TextDecoder("utf-8").decode(bytes);
          }

          async function parsearRss(xml) {
            let itemsRaw = xml.match(/<item\b[\s\S]*?<\/item>/gi) || [];
            // 3 oct: feeds Atom (<entry>, enlace en <link href="...">), p. ej. blogs de Shopify.
            // Solo se usa si el feed no trae ningun <item>, asi que los RSS no cambian.
            const esAtom = itemsRaw.length === 0;
            if (esAtom) itemsRaw = xml.match(/<entry\b[\s\S]*?<\/entry>/gi) || [];
            const noticias = [];

            for (const bloque of itemsRaw.slice(0, 6)) {
              const titulo = limpiar(extraerTag(bloque, "title"));
              // 3 oct: algunos RSS (p. ej. diariocritico.com) envuelven el enlace en <![CDATA[...]]>
              let linkTxt = extraerTag(bloque, "link").replace(/<!\[CDATA\[/g, "").replace(/\]\]>/g, "").trim();
              if (!linkTxt && esAtom) linkTxt = extraerAtributo(bloque, "link", "href");
              let link = decodeHtml(linkTxt).split("#")[0].split("?")[0];
              if (!titulo || !link) continue;

              let imagen = "";
              const enclosureUrl = extraerAtributo(bloque, "enclosure", "url");
              const enclosureType = extraerAtributo(bloque, "enclosure", "type");
              if (enclosureUrl && (!enclosureType || /image/i.test(enclosureType))) imagen = enclosureUrl;
              if (!imagen) imagen = extraerAtributo(bloque, "media:content", "url");
              if (!imagen) imagen = extraerAtributo(bloque, "media:thumbnail", "url");
              if (!imagen) imagen = extraerImagenInline(bloque);
              if (!imagen && esAtom) {
                const cont = decodeHtml(extraerTag(bloque, "content") || extraerTag(bloque, "summary"));
                const mi = cont.match(/<img[^>]+\bsrc\s*=\s*["']([^"']+)["']/i);
                if (mi) imagen = mi[1].startsWith("//") ? "https:" + mi[1] : mi[1];
              }
              imagen = decodeHtml(imagen);
              // 5 oct: algunos RSS (p. ej. El Debate) dan la foto con ruta relativa ("/files/...");
              // en el blog saldria rota, asi que se completa con el dominio del enlace.
              if (imagen && !/^https?:\/\//i.test(imagen)) {
                try { imagen = new URL(imagen, link).href; } catch (e) { imagen = ""; }
              }

              noticias.push({ titulo, link, imagen });
            }

            await Promise.all(noticias.map(async (noticia) => {
              if (!noticia.imagen) {
                noticia.imagen = await obtenerImagenOg(noticia.link, 3500);
              }
            }));

            noticias.forEach(n => { n.tipo = n.imagen ? "imagen" : ""; });

            return { noticias };
          }

          async function procesarFeed(feed, opciones) {
            const wid = feed.wid;
            const url = feed.url;
            const intentosMaximos = (opciones && opciones.intentosMaximos) || 1;
            const timeoutMs = (opciones && opciones.timeoutMs) || 6000;
            let intento = 1;

            while (true) {
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), timeoutMs);

                const respuesta = await fetch(url, {
                  signal: controller.signal,
                  headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" }
                });
                clearTimeout(timeout);

                // 17 sept: el semaforo de concurrencia de scraper_generico.php en el
                // NAS devuelve 503 cuando sus huecos (maximo 2 simultaneos) estan
                // ocupados. Antes eso se trataba como un fallo definitivo del feed en
                // este ciclo; ahora, solo para los feeds que pasan por el NAS,
                // reintentamos con una breve espera con jitter antes de rendirnos.
                if (respuesta.status === 503 && intento < intentosMaximos) {
                  const espera = 3000 + Math.floor(Math.random() * 2000);
                  console.warn("[" + wid + "] NAS ocupado (503), reintento " + intento + "/" + intentosMaximos + " en " + espera + "ms");
                  await new Promise(r => setTimeout(r, espera));
                  intento++;
                  continue;
                }

                if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);

                const texto = await leerTextoFeed(respuesta);
                const trimmed = texto.trim();

                let resultado;
                if (trimmed.startsWith("{")) {
                  const data = JSON.parse(trimmed);
                  if (Array.isArray(data.noticias)) resultado = data;
                  else throw new Error("JSON sin campo 'noticias' válido");
                } else {
                  resultado = await parsearRss(texto);
                }

                // 25 oct: fuera las noticias con titulo de pagina de error; si no queda ninguna,
                // se trata como fallo y se conserva el archivo anterior (no se guarda basura).
                if (Array.isArray(resultado.noticias)) {
                  const antes = resultado.noticias.length;
                  resultado.noticias = resultado.noticias.filter(n => n && !esTituloError(n.titulo));
                  if (resultado.noticias.length < antes) console.warn("[" + wid + "] Descartadas " + (antes - resultado.noticias.length) + " noticias con titulo de pagina de error");
                  // las que llegan del NAS en JSON tambien buscan foto en el articulo si no la traen
                  await Promise.all(resultado.noticias.map(async (n) => {
                    if (!n.imagen && n.link) {
                      n.imagen = await obtenerImagenOg(n.link, 3500);
                      if (n.imagen) n.tipo = "imagen";
                    }
                  }));
                }

                if (!resultado.noticias || resultado.noticias.length === 0) {
                  throw new Error("Sin noticias extraídas");
                }

                const archivo = wid + ".json";
                const contenidoNuevo = JSON.stringify(resultado, null, 2);
                let contenidoAnterior = "";
                if (fs.existsSync(archivo)) contenidoAnterior = fs.readFileSync(archivo, "utf8");

                if (contenidoAnterior.trim() !== contenidoNuevo.trim()) {
                  fs.writeFileSync(archivo, contenidoNuevo, "utf8");
                  console.log("[" + wid + "] Actualizado (" + resultado.noticias.length + " noticias)");
                  return "actualizado";
                } else {
                  console.log("[" + wid + "] Sin cambios");
                  return "sin_cambios";
                }

              } catch (error) {
                console.warn("[" + wid + "] ERROR: " + error.message);
                return "error";
              }
            }
          }

          async function procesarEnLotes(feeds, tamanoLote, opciones, contadores) {
            for (let i = 0; i < feeds.length; i += tamanoLote) {
              const lote = feeds.slice(i, i + tamanoLote);
              const resultados = await Promise.all(lote.map(f => procesarFeed(f, opciones)));

              resultados.forEach(r => {
                if (r === "actualizado") contadores.actualizados++;
                else if (r === "sin_cambios") contadores.sinCambios++;
                else contadores.errores++;
              });

              console.log("Progreso: " + Math.min(i + tamanoLote, feeds.length) + "/" + feeds.length);
            }
          }

          (async function () {
            const listarFeedsUrl = process.env.LISTAR_FEEDS_URL;
            const token = process.env.LISTAR_FEEDS_TOKEN;

            if (!listarFeedsUrl || !token) {
              throw new Error("Faltan LISTAR_FEEDS_URL o LISTAR_FEEDS_TOKEN.");
            }

            console.log("Obteniendo lista de feeds desde Apps Script...");

            const respuestaFeeds = await fetch(
              listarFeedsUrl + "?accion=listarFeeds&token=" + encodeURIComponent(token)
            );

            if (!respuestaFeeds.ok) {
              let cuerpoError = "";
              try {
                cuerpoError = await respuestaFeeds.text();
              } catch (e) {
                cuerpoError = "(no se pudo leer el cuerpo: " + e.message + ")";
              }
              console.error("========================================");
              console.error("CUERPO DE LA RESPUESTA DE ERROR (primeros 3000 caracteres):");
              console.error(cuerpoError.slice(0, 3000));
              console.error("========================================");
              if (/Authorization needed|ppConfig|accounts\.google\.com|ServiceLogin/i.test(cuerpoError)) {
                console.log("::error title=Apps Script LISTAR_FEEDS sin autorizar::El script 'Publicador Blogger' pide autorizacion de nuevo. Abre la direccion de LISTAR_FEEDS_URL con tu cuenta de Google y pulsa Review permissions.");
              } else {
                console.log("::error title=LISTAR_FEEDS no responde::El Apps Script de la lista de feeds devolvio HTTP " + respuestaFeeds.status + ". Mira el log de este paso.");
              }
              throw new Error("No se pudo obtener la lista de feeds: HTTP " + respuestaFeeds.status);
            }

            const textoFeeds = await respuestaFeeds.text();
            let config;
            try {
              config = JSON.parse(textoFeeds);
            } catch (e) {
              if (/Authorization needed|ppConfig|accounts\.google\.com|ServiceLogin/i.test(textoFeeds)) {
                console.log("::error title=Apps Script LISTAR_FEEDS sin autorizar::El script 'Publicador Blogger' pide autorizacion de nuevo. Abre la direccion de LISTAR_FEEDS_URL con tu cuenta de Google y pulsa Review permissions.");
              } else {
                console.log("::error title=LISTAR_FEEDS respuesta no valida::El Apps Script no devolvio JSON. Primeros caracteres: " + textoFeeds.slice(0, 200).replace(/\s+/g, " "));
              }
              throw new Error("La lista de feeds no es JSON valido.");
            }
            const feedsTodos = config.feeds || [];

            // 24 sept: frecuencia por seccion. Portadas, ultima hora y similares
            // (las que cambian rapido) se siguen pidiendo en cada pasada (30 min);
            // el resto de secciones, como mucho una vez cada HORAS_LENTAS horas.
            // Se anota cuando se pidio cada seccion lenta (aunque fallara), para no
            // insistir cada 30 min contra webs que bloquean por exceso de visitas.
            const RUTA_ESTADO = ".estado-frecuencias.json";
            const HORAS_LENTAS = 3;
            let estadoFrec = {};
            try { estadoFrec = JSON.parse(fs.readFileSync(RUTA_ESTADO, "utf8")); } catch (e) { estadoFrec = {}; }
            const ahoraMs = Date.now();

            function urlOrigen(u) {
              u = String(u || "");
              try {
                const x = new URL(u);
                if (x.pathname.includes("scraper_generico.php") && x.searchParams.get("url")) return x.searchParams.get("url");
              } catch (e) {}
              return u;
            }

            function esRapida(f) {
              let ruta = "", host = "";
              try {
                const x = new URL(urlOrigen(f.url));
                ruta = x.pathname.toLowerCase().replace(/\/+$/, "");
                host = x.hostname.toLowerCase();
              } catch (e) { return false; }
              // 6 oct: portada de El Confidencial (noticias-209). Su web bloquea bots y solo
              // sirve este feed, que trae las ultimas horas de todas las secciones: se pide
              // cada 30 min como las demas portadas aunque el host no empiece por www.
              // Solo esa fila: noticias-232 y noticias-1000 usan la misma URL y siguen como estaban.
              if (f.wid === "noticias-209" && host === "rss.elconfidencial.com" && ruta === "") return true;
              // portada del medio (no la de subdominios como tienda., club., hemeroteca.)
              if (ruta === "") return /^www\./.test(host) || host.split(".").length === 2;
              if (/^\/(index\.html?|home|portada|es|rss|feed|rss\.xml|feed\.xml|rss\/home(\.xml)?|rss\/portada(\.xml)?|rss\/ultima-hora(\.xml)?)$/.test(ruta)) return true;
              return /ultima-hora|ultimas-noticias|ultimas-horas|lo-ultimo|portada|en-directo|breaking|latest/.test(ruta);
            }

            const feeds = feedsTodos.filter(f => {
              if (esRapida(f)) return true;
              const ultima = Number(estadoFrec[f.wid] || 0);
              return ahoraMs - ultima >= HORAS_LENTAS * 3600000 - 10 * 60000;
            });
            feeds.forEach(f => { if (f.wid && !esRapida(f)) estadoFrec[f.wid] = ahoraMs; });
            fs.writeFileSync(RUTA_ESTADO, JSON.stringify(estadoFrec));
            console.log("Frecuencia: " + feeds.length + " de " + feedsTodos.length + " feeds en esta pasada (" +
              feedsTodos.filter(esRapida).length + " rapidos cada 30 min, resto cada " + HORAS_LENTAS + " h)");

            // 17 sept: separamos los feeds que se sirven a traves del semaforo de
            // concurrencia del NAS (scraper_generico.php, maximo 2 huecos a la vez)
            // de los que van directos a la fuente original. Los del NAS se procesan
            // en lotes mas pequeños y con reintento ante 503; el resto sigue
            // exactamente igual que antes.
            const feedsNas = feeds.filter(f => f.url && f.url.includes("scraper_generico.php"));
            const feedsOtros = feeds.filter(f => !f.url || !f.url.includes("scraper_generico.php"));

            console.log("Total de feeds a procesar: " + feeds.length + " (NAS: " + feedsNas.length + ", otros: " + feedsOtros.length + ")");

            const contadores = { actualizados: 0, sinCambios: 0, errores: 0 };

            await procesarEnLotes(feedsOtros, 20, { intentosMaximos: 1, timeoutMs: 6000 }, contadores);
            await procesarEnLotes(feedsNas, 10, { intentosMaximos: 3, timeoutMs: 20000 }, contadores);
            guardarCacheImagenes();

            console.log("========================================");
            console.log("Actualizados: " + contadores.actualizados);
            console.log("Sin cambios: " + contadores.sinCambios);
            console.log("Con error: " + contadores.errores);
            console.log("========================================");
          })();

          NODE

      - name: Sincronizar con la rama remota antes de guardar
        run: |
          git pull --no-edit origin main || true

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias-*.json .estado-frecuencias.json .cache-imagenes.json 2>/dev/null || git add noticias-*.json .estado-frecuencias.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar feeds genéricos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            ok=0
            for intento in 1 2 3 4; do
              if git push; then ok=1; break; fi
              echo "Push rechazado (intento $intento). Trayendo cambios recientes y reintentando..."
              git pull --rebase -X theirs origin main || { git rebase --abort || true; }
              sleep $((intento * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "::error title=No se pudieron guardar los feeds::El push a GitHub fallo 4 veces seguidas."
              exit 1
            fi
          fi
