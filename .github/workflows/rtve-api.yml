name: Noticias RTVE por API (Ciencia y Loterias)

# Las secciones de RTVE de Ciencia y Loterías salen mal leyendo la página; su API de temas va bien.
# Cada 30 minutos genera noticias-2435.json (Ciencia y tecnología) y noticias-2438.json (Loterías).
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['migracion/rtve_api.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-abc-git-write
  cancel-in-progress: false

jobs:
  rtve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generar
        run: node migracion/rtve_api.js
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in noticias-2435.json noticias-2438.json; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Noticias RTVE por API (Ciencia y Loterias)"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
