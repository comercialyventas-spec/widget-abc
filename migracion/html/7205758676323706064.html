<div id="tienda-catalogo"></div>
<div id="sentinel" style="height: 1px;"></div>
<div id="loader" style="display: none; padding: 15px; text-align: center;">Cargando ofertas, por favor espera...</div>
<div id="web-oficial-container" style="display: none; margin-top: 30px; padding: 20px 0px 40px; text-align: center;">
  <a href="https://alsa.wd3.myworkdayjobs.com/Alsa" style="background: rgb(17, 17, 17); border-radius: 6px; color: white; display: inline-block; font-family: 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: bold; letter-spacing: 1px; padding: 14px 36px; text-decoration: none; text-transform: uppercase;" target="_blank">
    Ver todas las ofertas
  </a>
</div>
<style>
#tienda-catalogo table{width:100%;border-collapse:separate;border-spacing:10px;}
#tienda-catalogo td{width:33%;vertical-align:top;border:1px solid #eaeaea;padding:12px;border-radius:10px;text-align:center;background:#fff;}
#tienda-catalogo td img{width:100%;height:160px;object-fit:cover;border-radius:8px;}
.producto-title{font-size:13px;margin:8px 0;font-weight:600;word-break:break-word;}
.producto-date{font-size:11px;color:#999;margin-bottom:8px;}
.producto-link{display:block;background:#111;color:#fff;padding:8px;text-decoration:none;border-radius:6px;font-size:11px;font-weight:bold;}
</style>
<script>
(function() {
  var F = "datos/alsa-empleo.json";
  var BOTON = "Ver oferta";
  var URLS = [
    "https://raw.githubusercontent.com/comercialyventas-spec/widget-abc/main/" + F,
    "https://cdn.jsdelivr.net/gh/comercialyventas-spec/widget-abc@main/" + F
  ];
  var LOTE = 30;
  var lista = [], mostrados = 0, filaActual = null;
  function esc(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  function pedir(i) {
    if (i >= URLS.length) return Promise.reject(new Error("sin datos"));
    return fetch(URLS[i], { cache: "no-store" })
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d) { if (!d || !d.items || !d.items.length) throw new Error("vacio"); return d.items; })
      .catch(function() { return pedir(i + 1); });
  }
  function celda(p) {
    var tabla = document.querySelector("#tienda-catalogo table");
    if (!tabla) {
      tabla = document.createElement("table");
      document.getElementById("tienda-catalogo").appendChild(tabla);
    }
    if (mostrados % 3 === 0) {
      filaActual = document.createElement("tr");
      tabla.appendChild(filaActual);
    }
    var info = [];
    if (p.lugar) info.push(esc(p.lugar));
    if (p.publicado) info.push(esc(p.publicado));
    else if (p.fecha) info.push("Actualizado: " + esc(p.fecha));
    var td = document.createElement("td");
    td.innerHTML =
      (p.img ? '<img src="' + esc(p.img) + '" loading="lazy" alt="' + esc(p.nombre) + '" onerror="this.style.display=\'none\'">' : '') +
      '<div class="producto-title">' + esc(p.nombre) + '</div>' +
      (info.length ? '<div class="producto-date">' + info.join(" · ") + '</div>' : '') +
      '<a class="producto-link" href="' + esc(p.url) + '" target="_blank">' + BOTON + '</a>';
    filaActual.appendChild(td);
    mostrados++;
  }
  function mostrarMas() {
    var fin = Math.min(lista.length, mostrados + LOTE);
    while (mostrados < fin) celda(lista[mostrados]);
    if (mostrados >= lista.length) document.getElementById("web-oficial-container").style.display = "block";
  }
  function iniciar() {
    var loader = document.getElementById("loader");
    loader.style.display = "block";
    pedir(0).then(function(items) {
      loader.style.display = "none";
      lista = items;
      mostrarMas();
      var observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && mostrados < lista.length) mostrarMas();
      }, { rootMargin: "250px" });
      observer.observe(document.getElementById("sentinel"));
    }).catch(function() {
      loader.style.display = "none";
      document.getElementById("web-oficial-container").style.display = "block";
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();
</script>
