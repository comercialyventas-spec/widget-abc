<div id="ed-opinion-widget">
  <div id="ed-opinion-destacada"></div>
  <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;" />
  <div id="ed-opinion-lista">Cargando artículos de opinión...</div>
</div>

<style>
  #ed-opinion-widget { font-family: 'Segoe UI', Roboto, Arial, sans-serif; max-width: 800px; margin: auto; color: #333; }
  #ed-opinion-widget .ed-featured { text-align: center; margin-bottom: 40px; }
  #ed-opinion-widget .ed-img-featured { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
  #ed-opinion-widget .ed-title-featured { font-size: 28px; font-weight: 800; color: #111; text-decoration: none; line-height: 1.2; display: block; margin-bottom: 15px; }
  #ed-opinion-widget .ed-title-featured:hover { color: #c0392b; }
  #ed-opinion-widget .ed-item { display: flex; flex-direction: column; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
  #ed-opinion-widget .ed-img-container { width: 100%; height: 200px; overflow: hidden; border-radius: 6px; margin-bottom: 12px; }
  #ed-opinion-widget .ed-img-container img { width: 100%; height: 100%; object-fit: cover; }
  #ed-opinion-widget .ed-item-title { font-size: 19px; font-weight: 700; color: #1a1a1a; text-decoration: none; line-height: 1.3; display: block; margin-bottom: 8px; }
  #ed-opinion-widget .ed-item-title:hover { color: #c0392b; }
  #ed-opinion-widget .ed-author { font-size: 12px; color: #888; margin-bottom: 8px; }
  #ed-opinion-widget .ed-meta { font-size: 11px; color: #aaa; text-transform: uppercase; margin-top: 5px; font-weight: bold; }
  @media (min-width: 600px) {
    #ed-opinion-widget .ed-item { flex-direction: row; gap: 20px; align-items: flex-start; }
    #ed-opinion-widget .ed-img-container { width: 180px; height: 110px; flex-shrink: 0; margin-bottom: 0; }
  }
</style>

<script>
(function() {
  function cargarED() {
    var rssUrl = "https://www.estrelladigital.es/rss/opinion/";
    var proxy = "https://script.google.com/macros/s/AKfycbzeMKVUzOXYNngx1d8OMhEF6ebsFmfXa8Iyd9ZOgpBoX4zqvs93rMJuortAtPxnu-2v/exec";
    var url = proxy + "?url=" + encodeURIComponent(rssUrl);

    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(text) {
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(text, "text/xml");
        var items = Array.from(xmlDoc.querySelectorAll("item"));
        
        if (items.length === 0) throw new Error("Sin resultados");
        
        var noticias = items.slice(0, 6).map(function(item) {
          var title = item.querySelector("title")?.textContent?.trim() || "";
          var link = item.querySelector("link")?.textContent?.trim() || "";
          var pubDate = item.querySelector("pubDate")?.textContent || "";
          var author = item.querySelector("dc\\:creator")?.textContent?.trim() || "Estrella Digital";
          
          var img = "";
          var enclosure = item.querySelector("enclosure");
          if (enclosure) img = enclosure.getAttribute("url") || "";
          if (!img) {
            var mediaContent = item.querySelector("media\\:content");
            if (mediaContent) img = mediaContent.getAttribute("url") || "";
          }
          
          return { title: title, link: link, pubDate: pubDate, author: author, img: img };
        }).filter(function(n) { return n.title; });

        function renderizar() {
          var destacadoHtml = "";
          var listaHtml = "";

          noticias.forEach(function(noticia, index) {
            var fecha = new Date(noticia.pubDate).toLocaleDateString('es-ES',
              { day: '2-digit', month: 'short', year: 'numeric' });

            if (index === 0) {
              destacadoHtml =
                '<div class="ed-featured">' +
                (noticia.img ? '<a href="' + noticia.link + '" target="_blank"><img src="' + noticia.img + '" class="ed-img-featured" alt="' + noticia.title + '"></a>' : '') +
                '<a class="ed-title-featured" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="ed-author">Por ' + noticia.author + '</div>' +
                '<div class="ed-meta">ESTRELLA DIGITAL &#183; ' + fecha + '</div>' +
                '</div>';
            } else {
              listaHtml +=
                '<div class="ed-item">' +
                (noticia.img ? '<div class="ed-img-container"><img src="' + noticia.img + '" alt="' + noticia.title + '"></div>' : '') +
                '<div>' +
                '<a class="ed-item-title" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="ed-author">Por ' + noticia.author + '</div>' +
                '<div class="ed-meta">' + fecha + '</div>' +
                '</div>' +
                '</div>';
            }
          });

          document.getElementById("ed-opinion-destacada").innerHTML = destacadoHtml;
          document.getElementById("ed-opinion-lista").innerHTML = listaHtml;
        }

        renderizar();

      })
      .catch(function() {
        document.getElementById("ed-opinion-widget").innerHTML =
          "<p style='color:red'>Error al cargar artículos de Estrella Digital.</p>";
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", cargarED);
  } else {
    cargarED();
  }
})();
</script>
