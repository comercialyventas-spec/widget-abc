<div id="cooking-news-widget">
  <div id="cooking-news-destacada"></div>
  <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;" />
  <div id="cooking-news-lista">Cargando últimas noticias...</div>
</div>

<style>
  #cooking-news-widget { font-family: 'Segoe UI', Roboto, Arial, sans-serif; max-width: 800px; margin: auto; color: #333; }
  #cooking-news-widget .cn-featured { text-align: center; margin-bottom: 40px; }
  #cooking-news-widget .cn-img-featured { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #f5f5f5; }
  #cooking-news-widget .cn-title-featured { font-size: 28px; font-weight: 800; color: #111; text-decoration: none; line-height: 1.2; display: block; margin-bottom: 15px; }
  #cooking-news-widget .cn-title-featured:hover { color: #8c7853; }
  #cooking-news-widget .cn-item { display: flex; flex-direction: column; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
  #cooking-news-widget .cn-img-container { width: 100%; height: 200px; overflow: hidden; border-radius: 6px; margin-bottom: 12px; background: #f5f5f5; }
  #cooking-news-widget .cn-img-container img { width: 100%; height: 100%; object-fit: cover; }
  #cooking-news-widget .cn-item-title { font-size: 19px; font-weight: 700; color: #1a1a1a; text-decoration: none; line-height: 1.3; display: block; margin-bottom: 8px; }
  #cooking-news-widget .cn-item-title:hover { color: #8c7853; }
  #cooking-news-widget .cn-author { font-size: 12px; color: #888; margin-bottom: 8px; }
  #cooking-news-widget .cn-meta { font-size: 11px; color: #aaa; text-transform: uppercase; margin-top: 5px; font-weight: bold; letter-spacing: 1px; }
  @media (min-width: 600px) {
    #cooking-news-widget .cn-item { flex-direction: row; gap: 20px; align-items: flex-start; }
    #cooking-news-widget .cn-img-container { width: 180px; height: 110px; flex-shrink: 0; margin-bottom: 0; }
  }
</style>

<script>
(function() {
  function cargarCookingNews() {
    var rssUrl = "https://www.cookingsurface.com/feed/";
    var proxy = "https://script.google.com/macros/s/AKfycbzeMKVUzOXYNngx1d8OMhEF6ebsFmfXa8Iyd9ZOgpBoX4zqvs93rMJuortAtPxnu-2v/exec";
    var url = proxy + "?url=" + encodeURIComponent(rssUrl);

    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(text) {
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(text, "text/xml");
        var items = Array.from(xmlDoc.querySelectorAll("item"));
        
        if (items.length === 0) throw new Error("Sin resultados");
        
        var noticias = items.slice(0, 6).map(function(item) {
          var title = item.querySelector("title")?.textContent?.trim() || "";
          var link = item.querySelector("link")?.textContent?.trim() || "";
          var pubDate = item.querySelector("pubDate")?.textContent || "";
          var author = item.querySelector("dc\\:creator")?.textContent?.trim() || "Cooking Surface";
          
          var img = "";
          
          // 1. Intentar buscar en enclosure (estándar de imágenes en feeds)
          var enclosure = item.querySelector("enclosure");
          if (enclosure && enclosure.getAttribute("type")?.indexOf("image") !== -1) {
            img = enclosure.getAttribute("url") || "";
          }
          
          // 2. Intentar buscar mediante media:content o variantes de namespaces
          if (!img) {
            var mediaContent = item.querySelector("media\\:content") || 
                               item.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "content")[0] ||
                               item.querySelector("content");
            if (mediaContent) {
              img = mediaContent.getAttribute("url") || "";
            }
          }

          // 3. Intentar buscar mediante media:thumbnail
          if (!img) {
            var mediaThumb = item.querySelector("media\\:thumbnail") || 
                             item.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "thumbnail")[0];
            if (mediaThumb) {
              img = mediaThumb.getAttribute("url") || "";
            }
          }
          
          // 4. Extraer del HTML interno de la descripción o contenido (Útil para WordPress en Blogger)
          if (!img) {
            var elContenido = "";
            // Revisamos tanto content:encoded como description
            var contentEncoded = item.getElementsByTagNameNS("http://purl.org/rss/1.0/modules/content/", "encoded")[0];
            if (contentEncoded) {
              elContenido = contentEncoded.textContent;
            } else {
              elContenido = item.querySelector("description")?.textContent || "";
            }
            
            if (elContenido) {
              var srcMatch = elContenido.match(/src=["']([^"']+\.(?:jpg|jpeg|png|gif|webp)(?:\?[^"']*)?)["']/i);
              if (srcMatch && srcMatch[1]) {
                img = srcMatch[1];
              }
            }
          }
          
          return { title: title, link: link, pubDate: pubDate, author: author, img: img };
        }).filter(function(n) { return n.title; });

        function renderizar() {
          var destacadoHtml = "";
          var listaHtml = "";

          noticias.forEach(function(noticia, index) {
            var fecha = new Date(noticia.pubDate).toLocaleDateString('es-ES',
              { day: '2-digit', month: 'short', year: 'numeric' });

            // Si el feed no traía ninguna imagen, se usa una por defecto elegante y neutra para que no quede el hueco roto
            var imagenUrl = noticia.img || "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=500&q=80";

            if (index === 0) {
              destacadoHtml =
                '<div class="cn-featured">' +
                '<a href="' + noticia.link + '" target="_blank"><img src="' + imagenUrl + '" class="cn-img-featured" alt="' + noticia.title + '"></a>' +
                '<a class="cn-title-featured" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="cn-author">Por ' + noticia.author + '</div>' +
                '<div class="cn-meta">COOKING SURFACE &#183; ' + fecha + '</div>' +
                '</div>';
            } else {
              listaHtml +=
                '<div class="cn-item">' +
                '<div class="cn-img-container"><a href="' + noticia.link + '" target="_blank"><img src="' + imagenUrl + '" alt="' + noticia.title + '"></a></div>' +
                '<div>' +
                '<a class="cn-item-title" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="cn-author">Por ' + noticia.author + '</div>' +
                '<div class="cn-meta">' + fecha + '</div>' +
                '</div>' +
                '</div>';
            }
          });

          document.getElementById("cooking-news-destacada").innerHTML = destacadoHtml;
          document.getElementById("cooking-news-lista").innerHTML = listaHtml;
        }

        renderizar();

      })
      .catch(function() {
        document.getElementById("cooking-news-widget").innerHTML =
          "<p style='color:red; text-align:center;'>Error al cargar las noticias de Cooking Surface.</p>";
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", cargarCookingNews);
  } else {
    cargarCookingNews();
  }
})();
</script>
