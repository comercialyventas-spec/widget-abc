<div id="dc-arte-widget">
  <div id="dc-arte-destacada"></div>
  <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;" />
  <div id="dc-arte-lista">Cargando noticias de Arte y Cultura...</div>
</div>

<style>
  #dc-arte-widget { font-family: 'Segoe UI', Roboto, Arial, sans-serif; max-width: 800px; margin: auto; color: #333; }
  #dc-arte-widget .dc-featured { text-align: center; margin-bottom: 40px; }
  #dc-arte-widget .dc-img-featured { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
  #dc-arte-widget .dc-title-featured { font-size: 28px; font-weight: 800; color: #111; text-decoration: none; line-height: 1.2; display: block; margin-bottom: 15px; }
  #dc-arte-widget .dc-title-featured:hover { color: #c0392b; }
  #dc-arte-widget .dc-item { display: flex; flex-direction: column; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
  #dc-arte-widget .dc-img-container { width: 100%; height: 200px; overflow: hidden; border-radius: 6px; margin-bottom: 12px; }
  #dc-arte-widget .dc-img-container img { width: 100%; height: 100%; object-fit: cover; }
  #dc-arte-widget .dc-item-title { font-size: 19px; font-weight: 700; color: #1a1a1a; text-decoration: none; line-height: 1.3; display: block; margin-bottom: 8px; }
  #dc-arte-widget .dc-item-title:hover { color: #c0392b; }
  #dc-arte-widget .dc-meta { font-size: 11px; color: #aaa; text-transform: uppercase; margin-top: 5px; font-weight: bold; }
  @media (min-width: 600px) {
    #dc-arte-widget .dc-item { flex-direction: row; gap: 20px; align-items: flex-start; }
    #dc-arte-widget .dc-img-container { width: 180px; height: 110px; flex-shrink: 0; margin-bottom: 0; }
  }
</style>

<script>
(function() {
  function cargarDC() {
    var rssUrl = "https://www.diariocritico.com/rss/seccion/106/";
    var proxy = "https://script.google.com/macros/s/AKfycbzeMKVUzOXYNngx1d8OMhEF6ebsFmfXa8Iyd9ZOgpBoX4zqvs93rMJuortAtPxnu-2v/exec";
    var url = proxy + "?url=" + encodeURIComponent(rssUrl);

    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(text) {
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(text, "text/xml");
        var items = Array.from(xmlDoc.querySelectorAll("item"));
        
        if (items.length === 0) throw new Error("Sin resultados");
        
        var noticias = items.slice(0, 6).map(function(item) {
          var title = item.querySelector("title")?.textContent?.trim() || "";
          var link = item.querySelector("link")?.textContent?.trim() || "";
          var pubDate = item.querySelector("pubDate")?.textContent || "";
          var author = item.querySelector("author")?.textContent?.replace(/\(.*\)/, '').trim() || "Diariocrítico";
          
          var img = "";
          var mediaContent = item.querySelector("media\\:content") ||
                            item.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "content")[0];
          if (mediaContent) {
            img = mediaContent.getAttribute("url") || "";
          }
          
          return { title: title, link: link, pubDate: pubDate, author: author, img: img };
        }).filter(function(n) { return n.title; });

        function renderizar() {
          var destacadoHtml = "";
          var listaHtml = "";

          noticias.forEach(function(noticia, index) {
            var fecha = new Date(noticia.pubDate).toLocaleDateString('es-ES',
              { day: '2-digit', month: 'short', year: 'numeric' });

            if (index === 0) {
              destacadoHtml =
                '<div class="dc-featured">' +
                '<a href="' + noticia.link + '" target="_blank">' +
                '<img src="' + noticia.img + '" class="dc-img-featured" alt="' + noticia.title + '">' +
                '</a>' +
                '<a class="dc-title-featured" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="dc-meta">DIARIOCRÍTICO CULTURA &#183; ' + noticia.author + ' &#183; ' + fecha + '</div>' +
                '</div>';
            } else {
              listaHtml +=
                '<div class="dc-item">' +
                '<div class="dc-img-container"><img src="' + noticia.img + '" alt="' + noticia.title + '"></div>' +
                '<div>' +
                '<a class="dc-item-title" href="' + noticia.link + '" target="_blank">' + noticia.title + '</a>' +
                '<div class="dc-meta">' + noticia.author + ' &#183; ' + fecha + '</div>' +
                '</div>' +
                '</div>';
            }
          });

          document.getElementById("dc-arte-destacada").innerHTML = destacadoHtml;
          document.getElementById("dc-arte-lista").innerHTML = listaHtml;
        }

        renderizar();

      })
      .catch(function() {
        document.getElementById("dc-arte-widget").innerHTML =
          "<p style='color:red'>Error al cargar noticias de Diariocrítico.</p>";
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", cargarDC);
  } else {
    cargarDC();
  }
})();
</script>
